# Which validated case file backs each repair example on each card.
#
# `examples` is the card's repair examples after alignment, in order. Each entry
# names the validation case file the code is taken from, so every example a
# model reads has been executed and measured rather than written by hand.
#
# `title` and `note` carry the teaching the card already had; only the code is
# replaced. `new` marks a shape that was measured but never shown on the card.
#
# `gaps` lists repairs the card teaches that no case file covers, and that are
# central enough to the root cause to be worth measuring. Each becomes a new
# file under validation/taxonomy/.

C1.S1:
  examples:
    - file: C1S1_dead_expensive_result
      title: an expensive result nobody consumes
    - file: C1S1_dead_loop
      title: a loop that builds something and drops it
    - file: C1S1_dead_code
      title: a scratch value recomputed every iteration
      new: true
  gaps: []

