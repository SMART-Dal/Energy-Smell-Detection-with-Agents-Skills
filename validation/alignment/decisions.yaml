  gaps:
    - file: C4S2_implied_by_domain_fact
      why: >
        `ceiling < limit` implying `floor < limit` is the card's own account of
        what makes this root cause invisible to static rules -- the fact comes
        from arithmetic, not syntax. The only measured redundancy is
        `C4S2_redundant_condition`, where the two tests are textually
        identical, which is the case a rule *can* find.
    - file: C4S2_negated_elif
      why: >
        `if x < 0 ... elif x >= 0` is the most common shape this root cause
        takes and the one with a behaviour trap worth measuring: the original
        returns None for NaN, so the repair is not equivalence-preserving on
        every input. Nothing measured covers it.

