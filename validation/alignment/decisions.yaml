C10.S6:
  examples:
    - file: C10S6_overload_accumulation
      title: accumulation that allocates per element
    - file: C10S6_comparison_dunder
      title: a comparison dunder on the per-element path
    - file: C10S6_operator_overload
      title: the same accumulation, unwrapped inside the loop
      new: true
    - file: C10S6_thin_delegating_dunder
      title: a dunder delegating to an array operation
      new: true
  gaps:
    - file: C10S6_comparison_dunder
      why: >
        Both measured files overload arithmetic. A comparison dunder is
        reached by a different path -- `min`/`sorted` call it through the
        comparison protocol rather than through an operator the loop writes --
        and the repair is `min(key=...)` rather than unwrapping an
        accumulator, so neither the cost nor the repair is covered.

