      new: true
  gaps:
    - file: C9S4_unparameterised_statement
      why: >
        Interpolating the id into the SQL text makes every iteration a
        textually distinct statement, so the engine re-parses and re-plans each
        one and the prepared-statement cache never hits. That is a different
        cost from the other two measured files, which change what the engine
        *does* rather than how often it has to decide what to do -- and it is
        the one shape here that is also an injection vector.

