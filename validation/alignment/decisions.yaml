    - file: C10S3_append_to_extend
      title: element-at-a-time transfer
    - file: C10S3_slice_instead_of_index
      title: an index-based loop where a slice does the work
    - file: C10S3_vectorised
      title: a Python loop over a NumPy array
    - file: C10S3_bulk_primitive
      title: an append loop the comprehension replaces
      new: true
  gaps:
    - file: C10S3_slice_instead_of_index
      why: >
        Slicing is the batched primitive here, and it is the only one of the
        three whose repair changes the return type -- a tuple or str input
        comes back as itself rather than as a list, which is a behaviour change
        the card has to warn about and no measurement has ever exercised.

