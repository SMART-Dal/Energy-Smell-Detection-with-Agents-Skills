- id: C9.S1
  signals:
    - io_call_in_loop
  in_one_line: |
    many small independent external operations where one bulk operation would do
  look_for: |
    Many small external operations where one bulk operation would move the same data: an `INSERT` executed per row, a `write` followed by `flush` per line, a `requests.get` or `urlopen` per URL. Every operation pays a fixed cost before any data moves -- a syscall, a buffer flush, a query parse, a round trip -- so N operations pay it N times where one bulk call pays it once. The operations are independent, and each call really leaves the process: `.get()`, `.write()` and `.execute()` are ordinary in-process method names too.
  refactoring:
    summary: combine the small operations into one bulk operation
  repairs:
    - case: C9S1_writelines
    - case: C9S1_executemany
      note: |
        The statement is parsed and planned once instead of N times, and the rows cross in one batch.
    - case: C9S1_fragmented_io
    - case: C9S1_already_buffered
      note: |
        Without a `flush` in the loop, the file object's buffer already issues one syscall per 8 KB, so the I/O is the same and joining first adds a copy of the whole payload.
  not_this:
    - title: each record's failure handled on its own
      source: catalog
      code: |
        for record in records:
            try:
                api.submit(record)
            except Rejected as exc:
                failed.append((record, exc))
      tempting: |
        try:
            api.submit_many(records)
        except Rejected as exc:
            failed.append((records, exc))
      why: |
        A batch submit reports one failure for the whole batch, and the code needs to know which record was rejected. Batching loses information the caller uses.
    - title: a stream written as it arrives
      source: catalog
      code: |
        for chunk in stream:
            handle.write(chunk)
      tempting: |
        handle.write(b"".join(stream))
      why: |
        Joining first holds the whole stream in memory and writes nothing until its last chunk has arrived, where the loop held one chunk at a time and wrote as it went.
  similar:
    - C8.S4
    - C9.S2
    - C9.S3
    - C10.S3
    - C11.S5
- id: C9.S2
  signals: []
  in_one_line: |
    more data pulled across a process boundary than the program ever consults
  look_for: |
    A fetch that brings back more than the code goes on to use: `SELECT *` where one column is read, a whole file read and split into lines to keep the first few, every file read in full to learn its size. Everything fetched is paid for at both ends and in between -- serialised at the source, carried, then turned into Python objects, one per field -- and the unused part is allocated and freed unread. The source can return less: a column list, a bounded read, a metadata call.
  refactoring:
    summary: request only the fields, rows or bytes the code consumes
  repairs:
    - case: C9S2_select_columns
      note: |
        Less is serialised at the far end, fewer bytes cross, and fewer Python objects are built per row; the deserialisation is usually the largest share. Check that no index-only scan is lost.
    - case: C9S2_oversized_retrieval
    - case: C9S2_metadata_without_payload
      note: |
        This exists only because the source offers a metadata call, which is what "can the source return less" is asking.
    - case: C9S2_generic_consumer
      note: |
        The consumer is generic, so every column is used by code that names none of them. Projecting would break the serialiser, so `after` asks for the same columns by name.
  not_this:
    - source: lookalike:C9S2_lookalike
      why: |
        The query feeds both the page and a total, so `LIMIT 20` keeps the page right and makes the total the sum of twenty rows. Find every consumer of a result before bounding it; a total needs its own aggregate query.
  similar:
    - C6.S3
    - C9.S1
    - C9.S4
- id: C9.S3
  signals:
    - io_call_in_loop
  in_one_line: |
    one fetch per row of an earlier fetch, where a join would have taken one trip
  look_for: |
    One query returns N rows and each row then triggers another fetch for its related data -- a `SELECT name FROM customers WHERE id = ?` for every order -- so the total is N+1 round trips where a join, or one query per relation, would take one or two. Each inner fetch takes its parameter from the outer row. In ORM code the inner fetch can hide behind an attribute: `order.customer` reads like a field and may be a query, so read the model as well as the loop.
  refactoring:
    summary: fetch the related data in one query, or in one query per relation
  repairs:
    - case: C9S3_n_plus_one
      note: |
        The join is safe because `customer_id` is many-to-one, so the row count does not multiply. One thing changes: an order with a missing customer disappears from the join, where the loop raised.
    - case: C9S3_traversal_behind_a_branch
      note: |
        The deciding fact is the branch's selectivity: a traversal behind a branch that rarely fires costs a few round trips, where the prefetch fetches every customer.
    - case: C9S3_join_multiplies_rows
      note: |
        Here `before` is one query per relation and `after` the single join, which returns items x notes rows per order. Row multiplication across two one-to-many relations makes the join the wrong repair.
  similar:
    - C3.S4
    - C8.S4
    - C9.S1
    - C9.S4
- id: C9.S4
  in_one_line: |
    a query whose shape makes the engine do far more work than the answer needs
  look_for: |
    A query whose structure makes the engine do work the answer does not need: a predicate that wraps an indexed column in a function, as in `WHERE lower(email) = ?`, so a lookup becomes a scan of every row; `UNION` over inputs that cannot overlap, which sorts and deduplicates for nothing; a value interpolated into the SQL text, so every execution is a new statement to parse and plan; tables listed with no join condition, which returns their Cartesian product. The cost is paid inside the engine, and `EXPLAIN` shows it.
  refactoring:
    summary: restructure the query so the engine can execute it cheaply
  repairs:
    - case: C9S4_expensive_query
      note: |
        The repair is correct only because the stored emails are already normalised; otherwise it silently stops matching, and the fix is a functional index rather than a new query.
    - case: C9S4_union_all
      note: |
        Valid only because a user cannot be both active and archived. State that invariant, because if it can be violated the repair returns duplicates.
    - case: C9S4_unparameterised_statement
      note: |
        Every iteration produced a textually distinct statement, so the engine parsed and planned each one. It was also an injection vector.
    - case: C9S4_missing_join_predicate
      note: |
        The finding needs the row counts: a Cartesian product between two three-row tables is nine rows.
  not_this:
    - source: lookalike:C9S4_lookalike
      why: |
        The two tables overlap, so `UNION ALL` returns every duplicate and the count is inflated. Disjointness has to come from a constraint, not from what the tables hold today.
    - title: only the table name is interpolated
      source: catalog
      code: |
        query = f"SELECT * FROM {table_name} WHERE id = %s"
        cursor.execute(query, (record_id,))
      tempting: |
        cursor.execute("SELECT * FROM %s WHERE id = %s", (table_name, record_id))
      why: |
        Placeholders bind values, not identifiers, so the parameterised table name is sent as a quoted string and the statement fails. The value is already a parameter and the table name comes from a fixed set, so there is one statement per table and the plan cache works.
    - title: a self-join whose condition is not an equality
      source: catalog
      code: |
        pairs = connection.execute(
            "SELECT a.id, b.id FROM regions a, regions b WHERE a.id < b.id").fetchall()
      tempting: |
        pairs = connection.execute(
            "SELECT a.id, b.id FROM regions a JOIN regions b ON a.id = b.id").fetchall()
      why: |
        The comma join is a deliberate self-join producing every unordered pair, and the `WHERE` is its condition. An equality predicate returns each region paired with itself instead.
  similar:
    - C7.S1
    - C9.S2
    - C9.S3
