- id: C9.S1
  signals:
  - io_call_in_loop
  in_one_line: |
    many small independent external operations where one bulk operation would do
  what_to_look_for: |
    Every external operation has a fixed cost before any data moves: a syscall boundary, a buffer flush, a protocol frame, a query parse, a network round trip.  N small operations pay that N times where one bulk operation pays it once and moves the same bytes, so the saving is N times the per-operation overhead and is independent of how much data there is -- which is why batching a thousand tiny writes saves more than batching two large ones. Most candidates die on the first question, which is whether the call actually leaves the process: `.get()`, `.read()`, `.write()` and `.execute()` are ordinary in-process method names too, and `store.get(key)` differs from `dict.get(key)` by six orders of magnitude with nothing in the syntax to say which you have.  So read what the receiver is.  Then establish the operations are *independent* and could run in any order, because a call whose argument comes from the previous call's result cannot be batched at all.  Name the bulk form -- `writelines`, one buffered `write`, `executemany`, `bulk_create`, a batch endpoint, a single query with an `IN` clause -- and name what batching costs, since one transaction that fails loses everything where a thousand lose one, and one buffered write holds the whole payload in memory.
  not_a_smell_when:
  - |
    the calls are dependent, so each one's argument comes from the previous one's result
  - |
    per-item failure handling is required -- one bad row must not fail the batch
  - |
    the batch would have to hold more in memory than the process can afford
  - |
    streaming is deliberate, so that a consumer sees results as they arrive
  - |
    the "external" call is not external at all, which is the commonest reason to reject
  counter_examples:
  - code: |
      for key in keys:
          value = cache.get(key)
          if value is not None:
              results.append(value)
    why: |
      `cache` here is a plain dict. `.get()` in a loop is one of the commonest expressions in Python, and the method name tells you nothing about whether it leaves the process -- one ordinary pure-Python module that performs no I/O at all contains eight of these. Establish what the receiver is before anything else.
  - code: |
      for record in records:
          try:
              api.submit(record)
          except Rejected as exc:
              failed.append((record, exc))
    why: |
      Genuinely external and genuinely per-item, and the per-item error handling is the reason. A batch submit reports one failure for the batch and the code needs to know which record. Batching here loses information the caller uses.
  - code: |
      for chunk in stream:
          handle.write(chunk)
    why: |
      A write per chunk, and Python's buffered writer already accumulates these and flushes when its buffer fills -- so the syscall count is already far below the call count. Checking whether a lower layer already batches is why the card asks what batching costs as well as what it saves.
  refactoring:
    summary: combine the small operations into one bulk operation
    examples:
    - title: a write per line
      before: |
        import os


        import tempfile


        def before(lines):
            handle, path = tempfile.mkstemp(suffix=".c9s1")
            os.close(handle)
            try:
                with open(path, "w", encoding="utf-8") as out:
                    for line in lines:
                        out.write(line)
                        out.flush()                 # one syscall per line
                return os.path.getsize(path)
            finally:
                os.unlink(path)
      after: |
        import os


        import tempfile


        def after(lines):
            handle, path = tempfile.mkstemp(suffix=".c9s1")
            os.close(handle)
            try:
                with open(path, "w", encoding="utf-8") as out:
                    out.writelines(lines)
                return os.path.getsize(path)
            finally:
                os.unlink(path)
      note: |
        A million `write` calls become one. Note what this trades: the whole payload is now in memory, and a crash mid-loop previously left a partial file where now it leaves an empty one. On a million entries the saving is real; on a hundred, Python's own buffering had already dealt with it and this is churn.

        Measured in `validation/taxonomy/C9S1_writelines.py`.
    - title: one insert per row
      before: |
        import sqlite3


        def _fresh():
            connection = sqlite3.connect(":memory:")
            connection.execute("CREATE TABLE events (id INTEGER, payload TEXT)")
            return connection


        def before(rows):
            connection = _fresh()
            for row in rows:
                connection.execute("INSERT INTO events VALUES (?, ?)", row)
            connection.commit()
            return connection.execute("SELECT count(*) FROM events").fetchone()[0]
      after: |
        import sqlite3


        def _fresh():
            connection = sqlite3.connect(":memory:")
            connection.execute("CREATE TABLE events (id INTEGER, payload TEXT)")
            return connection


        def after(rows):
            connection = _fresh()
            connection.executemany("INSERT INTO events VALUES (?, ?)", rows)
            connection.commit()
            return connection.execute("SELECT count(*) FROM events").fetchone()[0]
      note: |
        The statement is parsed and planned once instead of N times, and the rows cross in one batch. The largest available effect in this category. It also makes the whole insert atomic in a way the original was not quite -- which is usually an improvement and is still a change.

        Measured in `validation/taxonomy/C9S1_executemany.py`.
    - title: N lookups replaced by one query
      before: |
        def before(connection, limit):
            """One query for the orders, then one more for each order's customer."""
            orders = connection.execute(
                "SELECT id, customer_id FROM orders ORDER BY id LIMIT ?", (limit,)
            ).fetchall()
            out = []
            for order_id, customer_id in orders:
                row = connection.execute(
                    "SELECT name FROM customers WHERE id = ?", (customer_id,)
                ).fetchone()
                out.append((order_id, row[0]))
            return out
      after: |
        def after(connection, limit):
            """One query, joined at the source."""
            return connection.execute(
                "SELECT o.id, c.name FROM orders o "
                "JOIN customers c ON c.id = o.customer_id "
                "ORDER BY o.id LIMIT ?",
                (limit,),
            ).fetchall()
      note: |
        N round trips become one, and the index rebuilds the caller's ordering. Note the repair is longer and has two new failure modes: a missing id now raises `KeyError` instead of `TypeError`, and a very long `ids` can exceed the driver's parameter limit. Chunking at a few hundred is the production form.

        Measured in `validation/taxonomy/C9S3_n_plus_one.py`.
    - title: a flush after every write
      before: |
        import os, tempfile


        _DIR = tempfile.mkdtemp()


        def before(lines):
            path = os.path.join(_DIR, "a.txt")
            with open(path, "w") as f:
                for line in lines:
                    f.write(line)
                    f.flush()
            return os.path.getsize(path)
      after: |
        import os, tempfile


        _DIR = tempfile.mkdtemp()


        def after(lines):
            path = os.path.join(_DIR, "b.txt")
            with open(path, "w") as f:
                f.write("".join(lines))
            return os.path.getsize(path)
      note: |
        Many small writes against one batched write.

        Measured in `validation/taxonomy/C9S1_fragmented_io.py`.
    - title: the batching the buffer was already doing
      before: |
        import os


        import tempfile


        _DIR = tempfile.mkdtemp(prefix="c9s1-counter-")


        def before(lines):
            path = os.path.join(_DIR, "a.txt")
            with open(path, "w", encoding="utf-8") as out:
                for line in lines:
                    out.write(line)                  # buffered; no flush
            return os.path.getsize(path)
      after: |
        import os


        import tempfile


        _DIR = tempfile.mkdtemp(prefix="c9s1-counter-")


        def after(lines):
            path = os.path.join(_DIR, "b.txt")
            with open(path, "w", encoding="utf-8") as out:
                out.write("".join(lines))            # one string, then the same buffer
            return os.path.getsize(path)
      note: |
        The file object was already
        batching.

        `C9S1_writelines` measures one write per line against one buffered write at
        +95.8%, and `C9S1_fragmented_io` at +97%. Both of those call `flush()` in the
        loop, which is what makes each line a syscall.

        Without the flush there is no fragmentation to remove. A Python file object
        buffers 8 KB by default, so a loop of `write()` calls already issues one syscall
        per 8 KB; joining the lines first adds a full copy of the payload into a new
        string and then hands the same bytes to the same buffer. The I/O is identical
        and the repair is a memory allocation the size of the output.

        Look for what actually crosses the boundary before batching: an unflushed file
        object, a buffered socket, an ORM that defers until commit, and a client library
        with its own queue are all already doing this, and the repair only moves the
        copying.

        Measured in `validation/taxonomy/C9S1_already_buffered.py`.
  patch_shape: structural
  measurability: scales_with_input
  min_workload_hint: |
    the effect is per operation avoided, so the case needs many items rather than large ones -- and the external call has to be stubbed at a defensible cost, or the number means nothing
  notes: |
    Measuring anything in this category needs a stub, because a submission cannot make a real network call.  A stub that returns instantly makes every repair here look worthless; an arbitrary `sleep` makes the figure meaningless.  The defensible options are to stub at a latency you can justify from an observed measurement and say so, or to report the operations avoided as a count and leave the energy claim unmade.  A counted claim honestly stated is worth more than a measured one built on an invented constant.
  similar:
  - C8.S4
  - C9.S2
  - C9.S3
  - C10.S3
  - C11.S5
- id: C9.S2
  signals: []
  in_one_line: |
    more data pulled across a process boundary than the program ever consults
  what_to_look_for: |
    Data that crosses a process boundary is paid for at both ends and in between: the remote system reads and serialises it, the transport carries it, and the local process deserialises it into objects.  Deserialisation is usually the largest share and the least visible, since turning a wide row into Python objects allocates one object per field -- a `SELECT *` returning forty columns where two are used allocates thirty-eight objects per row and frees them unread.  So name what is fetched against what is consumed, as a proportion: two columns of forty is a finding, thirty-eight of forty is not. Two things have to hold and both need reading outside the unit.  The source must be able to return less, which a `SELECT` or a range request can and a fixed endpoint cannot.  And nothing downstream may need the rest -- the commonest way to get this wrong is a *generic* consumer, a serialiser that reflects over the row or a logger that dumps it, where every column is used by code that names none of them.  Check the projection does not cost more elsewhere, since selecting a subset can lose an index-only scan and a byte range can defeat a cache holding the whole object.
  not_a_smell_when:
  - |
    the extra data is used somewhere the reader has not looked -- a serialiser, a log line, a caller that forwards the object
  - |
    the source cannot return less: a fixed endpoint, a whole-file format, a response shape you do not control
  - |
    the proportion saved is small
  - |
    projecting would change the query plan for the worse, or defeat a cache holding the full object
  - |
    the full object is cached and reused, so fetching it once for everything is the cheaper total
  counter_examples:
  - code: |
      rows = connection.execute("SELECT * FROM users").fetchall()
      return [serialise(r) for r in rows]
    why: |
      `SELECT *` feeding a serialiser that reflects over every column. The columns are all used -- by code that does not name any of them. This is the commonest way to get C9.S2 wrong: the consumer is generic, so nothing in the function mentions the fields it needs.
  - code: |
      content = path.read_text()
      return hashlib.sha256(content.encode()).hexdigest()
    why: |
      The whole file is read for a hash, which looks like fetching more than is needed -- and a hash needs every byte. The available repair is to stream the file in blocks so peak memory is bounded, which is C6.S3; the *amount* transferred is already minimal.
  refactoring:
    summary: request only the fields, rows or bytes the code consumes
    examples:
    - title: projecting the columns actually used
      before: |
        def before(connection, limit):
            rows = connection.execute("SELECT * FROM wide LIMIT ?", (limit,)).fetchall()
            return sum(r[0] for r in rows)
      after: |
        def after(connection, limit):
            rows = connection.execute("SELECT id FROM wide LIMIT ?", (limit,)).fetchall()
            return sum(r[0] for r in rows)
      note: |
        Two columns instead of forty: less serialised at the far end, fewer bytes on the wire, and two Python objects per row instead of forty. The deserialisation is usually the largest share. Check the table's real width before claiming a proportion -- and that no index-only scan is lost.

        Measured in `validation/taxonomy/C9S2_select_columns.py`.
    - title: bounding the rows at the source
      before: |
        def before(n):
            with open(_PATH) as f:
                rows = f.read().splitlines()
            return len(rows[:n])
      after: |
        def after(n):
            out = []
            with open(_PATH) as f:
                for line in f:
                    out.append(line.rstrip("\n"))
                    if len(out) >= n:
                        break
            return len(out)
      note: |
        The unbounded query materialises the whole table locally and discards all but `limit` rows. `LIMIT` also lets the database stop sorting early if the ordering column is indexed, so the saving is at both ends. Same principle as C3.S6, moved across the process boundary -- which is why it belongs here.

        Measured in `validation/taxonomy/C9S2_oversized_retrieval.py`.
    - title: metadata without the payload
      before: |
        def before(paths):
            total = 0
            for path in paths:
                with open(path, "rb") as handle:
                    total += len(handle.read())
            return total
      after: |
        import os


        def after(paths):
            total = 0
            for path in paths:
                total += os.path.getsize(path)
            return total
      note: |
        The original transfers every object in full to measure it. `head` returns the metadata alone. The largest ratio in this category -- gigabytes against a few hundred bytes -- and it only exists because the protocol offers a metadata call, which is what "can the source return less" is asking.

        Measured in `validation/taxonomy/C9S2_metadata_without_payload.py`.
    - title: the consumer that reflects over every column it is given
      before: |
        def _serialise(row):
            return sum(len(str(value)) for value in row)


        def before(connection, limit):
            rows = connection.execute("SELECT * FROM wide LIMIT ?", (limit,)).fetchall()
            return sum(_serialise(r) for r in rows)
      after: |
        COLUMNS = 40


        _NAMES = ", ".join(f"c{i}" for i in range(COLUMNS))


        def _serialise(row):
            return sum(len(str(value)) for value in row)


        def after(connection, limit):
            rows = connection.execute(
                f"SELECT id, {_NAMES} FROM wide LIMIT ?", (limit,)).fetchall()
            return sum(_serialise(r) for r in rows)
      note: |
        The consumer uses every column.

        The card's first `NOT a smell when` clause and what it calls the commonest way
        to get this wrong: the consumer is generic, so every column is used by code
        that names none of them. Projecting here does not save a transfer, it breaks
        the serialiser -- so `after` fetches the same columns and the only difference
        is that it asks for them by name.

        Expected to read as nothing, which is the answer that stops an agent projecting
        a query it has not read the consumer of.

        Measured in `validation/taxonomy/C9S2_generic_consumer.py`.
  patch_shape: expression
  measurability: scales_with_input
  min_workload_hint: |
    the effect is proportional to the bytes and objects avoided, so the case needs realistically wide rows or large payloads; a two-column table shows nothing
