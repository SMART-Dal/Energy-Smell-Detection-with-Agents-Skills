- id: C9.S4
  in_one_line: |
    a query whose shape makes the engine do far more work than the answer needs
  what_to_look_for: |
    Some queries are expensive for the engine whatever the client does, and the cost is paid entirely at the far end -- in CPU, in temporary storage, and in energy on a machine this process is not measuring.  A missing join condition produces a Cartesian product, so two ten-thousand-row tables become a hundred million rows.  `UNION` sorts and deduplicates where `UNION ALL` does not.  A predicate wrapped in a function -- `WHERE lower(email) = ?` -- cannot use an index on `email`, so a lookup becomes a full scan.  And a query built by string interpolation is textually different on every execution, so the plan cache never hits and every call re-parses and re-plans.  Name the specific structure, then establish it is expensive *here*, because row counts and indexes are facts about the database rather than the code and a Cartesian product between two three-row tables is nine rows.  Preserving the result is the hard part of each repair: `UNION ALL` only when the inputs are provably disjoint, a rewritten predicate only when it selects the same rows including at the edges of case, nulls and collation.  `EXPLAIN` is the instrument for this root cause and a finding without it is a guess -- the local energy meter cannot see any of this.
  not_a_smell_when:
  - |
    the tables are small enough that the structure's cost is irrelevant
  - |
    `UNION`'s deduplication is needed because the inputs can overlap
  - |
    the function in the predicate is matched by a functional index, so the index is still usable
  - |
    the interpolated value is a constant, so there is one distinct statement and the plan cache works
  - |
    the engine's optimiser already rewrites it, which `EXPLAIN` will show
  counter_examples:
  - code: |
      query = f"SELECT * FROM {table_name} WHERE id = %s"
      cursor.execute(query, (record_id,))
    why: |
      String interpolation into SQL, which is the shape -- and only the table name is interpolated, from a fixed set, while the value is properly parameterised. That yields one distinct statement per table and the plan cache works. The finding needs the *varying* part to be in the text.
  - code: |
      SELECT a.id, b.id FROM regions a, regions b WHERE a.id < b.id
    why: |
      A comma join with no equality condition, which reads exactly like a missing join predicate -- and it is a deliberate self-join producing every unordered pair, which is what the query is for. The `WHERE` is the condition; it is simply not an equality.
  refactoring:
    summary: restructure the query so the engine can execute it cheaply
    examples:
    - title: a predicate that defeats the index
      before: |
        def before(connection, addresses):
            """`lower()` on the column makes the index unusable: a full scan per lookup."""
            out = []
            for address in addresses:
                row = connection.execute(
                    "SELECT id FROM users WHERE lower(email) = ?", (address.lower(),)
                ).fetchone()
                out.append(row[0] if row else None)
            return out
      after: |
        def after(connection, addresses):
            """The same question asked of the column directly, so the index applies."""
            out = []
            for address in addresses:
                row = connection.execute(
                    "SELECT id FROM users WHERE email = ?", (address.lower(),)
                ).fetchone()
                out.append(row[0] if row else None)
            return out
      note: |
        Wrapping the column in `lower()` makes the index on `email` unusable, so the engine scans every row. The repair is only correct if the stored values are already normalised -- otherwise it silently stops matching, and the right fix is the functional index rather than the query. Confirm with `EXPLAIN` either way.

        Measured in `validation/taxonomy/C9S4_expensive_query.py`.
    - title: deduplication nobody asked for
      before: |
        def before(connection, disjoint):
            left, right = ("active", "archived") if disjoint else ("overlap_a", "overlap_b")
            return len(connection.execute(
                f"SELECT id FROM {left} UNION SELECT id FROM {right}").fetchall())
      after: |
        def after(connection, disjoint):
            if disjoint:
                return len(connection.execute(
                    "SELECT id FROM active UNION ALL SELECT id FROM archived").fetchall())
            return len(connection.execute(
                "SELECT id FROM overlap_a UNION SELECT id FROM overlap_b").fetchall())
      note: |
        `UNION` sorts both inputs and removes duplicates; `UNION ALL` streams them. Valid only because a user cannot be both active and archived -- state that invariant, because if it can be violated the repair returns duplicates and the caller may not notice.

        Measured in `validation/taxonomy/C9S4_union_all.py`.
    - title: a plan cache that never hits
      before: |
        def before(connection, order_ids):
            total = 0
            for order_id in order_ids:
                row = connection.execute(
                    f"SELECT total FROM orders WHERE id = {order_id}"
                ).fetchone()
                total += row[0]
            return total
      after: |
        def after(connection, order_ids):
            total = 0
            for order_id in order_ids:
                row = connection.execute(
                    "SELECT total FROM orders WHERE id = ?", (order_id,)
                ).fetchone()
                total += row[0]
            return total
      note: |
        Two problems in one line and both are fixed together: every iteration produced a textually distinct statement, so the engine re-parsed and re-planned each one, and there were N round trips. It was also an injection vector. The batching half is C9.S1 -- report whichever is larger and subsume the other.

        Measured in `validation/taxonomy/C9S4_unparameterised_statement.py`.
    - title: a join with no predicate to join on
      before: |
        def before(connection, big):
            a, b = ("big_a", "big_b") if big else ("tiny_a", "tiny_b")
            rows = connection.execute(f"SELECT x.id, y.id FROM {a} x, {b} y").fetchall()
            return sum(1 for xi, yi in rows if xi == yi)
      after: |
        def after(connection, big):
            a, b = ("big_a", "big_b") if big else ("tiny_a", "tiny_b")
            rows = connection.execute(
                f"SELECT x.id, y.id FROM {a} x JOIN {b} y ON y.id = x.id").fetchall()
            return len(rows)
      note: |
        A Cartesian product from a missing join
        condition.

        The card's first named structure, and it insists the finding needs the row
        counts: a Cartesian product between two three-row tables is nine rows. So the
        two cases are the same query against a table that makes it expensive and one
        that makes it trivial, which is the difference between a finding and a shape.

        Measured in `validation/taxonomy/C9S4_missing_join_predicate.py`.
