- id: C9.S3
  signals:
  - io_call_in_loop
  in_one_line: |
    one fetch per row of an earlier fetch, where a join would have taken one trip
  what_to_look_for: |
    The N+1 pattern: one query returns N rows and each row then triggers another query for its related data, so the total is N+1 round trips where a join or a prefetch is one or two.  The cost is dominated by latency and per-query overhead rather than by volume, which is why N+1 queries returning one row each cost far more than one query returning N rows carrying the same bytes. It is the commonest expensive mistake in ORM code and it is invisible at the call site, because `order.customer` looks like an attribute read and is a network round trip -- so the difficulty is establishing that the inner access *is* a fetch, which means reading the model rather than the loop.  Confirm the inner fetches vary with the outer row; identical parameters mean the same data is being re-fetched, which is a caching problem instead.  Two things make the repair worse than the pattern.  A traversal guarded by a branch that fires for two of ten thousand rows costs two round trips where a prefetch fetches ten thousand.  And a join across two one-to-many relations multiplies rows and can return far more data than N+1 did, where the answer is separate prefetch queries rather than a single join.  An identity map or a local cache may also mean no round trip is happening at all.
  not_a_smell_when:
  - |
    the inner data is only needed for a few of the outer rows, so N+1 fetches fewer times than a join fetches rows
  - |
    the join would multiply rows across several one-to-many relations and return more data than the round trips cost
  - |
    the data layer offers no way to express it -- a fixed endpoint per entity
  - |
    the inner fetch is served from an identity map or a local cache, so the round trip is not happening
  - |
    N is reliably small and bounded
  counter_examples:
  - code: |
      for order in orders:
          if order.needs_review:
              notify(order.customer.email)
    why: |
      A relation traversal inside a loop, which is the N+1 shape -- and it fires only for orders needing review, which may be two out of ten thousand. `select_related("customer")` would fetch ten thousand customers to use two. The repair can be worse than the pattern, and the deciding fact is the branch's selectivity.
  - code: |
      for order in orders:
          total += order.customer.discount
    why: |
      Identical in shape to the positive example, and if `orders` all belong to the same customer, the ORM's identity map serves every traversal after the first from memory -- one query, not N. Whether a round trip happens depends on the session's state, which is why the card asks you to read the data layer.
  refactoring:
    summary: fetch the related data in one query, or in one query per relation
    examples:
    - title: the explicit form, with a keyed lookup
      before: |
        def before(connection, limit):
            """One query for the orders, then one more for each order's customer."""
            orders = connection.execute(
                "SELECT id, customer_id FROM orders ORDER BY id LIMIT ?", (limit,)
            ).fetchall()
            out = []
            for order_id, customer_id in orders:
                row = connection.execute(
                    "SELECT name FROM customers WHERE id = ?", (customer_id,)
                ).fetchone()
                out.append((order_id, row[0]))
            return out
      after: |
        def after(connection, limit):
            """One query, joined at the source."""
            return connection.execute(
                "SELECT o.id, c.name FROM orders o "
                "JOIN customers c ON c.id = o.customer_id "
                "ORDER BY o.id LIMIT ?",
                (limit,),
            ).fetchall()
      note: |
        2N round trips become one. The join is safe here because `customer_id` is many-to-one, so the row count does not multiply. Two things change: an order with a missing customer disappears instead of raising, and the result order now follows the database's rather than `order_ids`. Both have to be checked.

        Measured in `validation/taxonomy/C9S3_n_plus_one.py`.
    - title: the fetch hidden behind an attribute and a branch
      before: |
        def before(connection, orders):
            total = 0
            for order_id, customer_id, flagged in orders:
                if flagged:
                    row = connection.execute(
                        "SELECT email FROM customers WHERE id = ?", (customer_id,)).fetchone()
                    total += len(row[0])
            return total
      after: |
        def after(connection, orders):
            emails = dict(connection.execute("SELECT id, email FROM customers"))
            total = 0
            for order_id, customer_id, flagged in orders:
                if flagged:
                    total += len(emails[customer_id])
            return total
      note: |
        The relation is read for two rows in
        ten thousand.

        The card's first `NOT a smell when` clause: an N+1 traversal guarded by a
        branch that almost never fires costs two round trips, where prefetching fetches
        everything. `before` is the guarded N+1 and `after` is the prefetch, so a
        negative reading says the repair is worse than the pattern -- and the deciding
        fact is the branch's selectivity, not the shape.

        `most-need-it` flips that, so both sides of the card's claim are in one file.

        Measured in `validation/taxonomy/C9S3_traversal_behind_a_branch.py`.
    - title: separate queries where a join would multiply
      before: |
        def before(connection, limit):
            """One query per relation, joined in Python -- `prefetch_related` style."""
            items, notes = {}, {}
            for order_id, sku in connection.execute(
                    "SELECT order_id, sku FROM items WHERE order_id < ?", (limit,)):
                items.setdefault(order_id, []).append(sku)
            for order_id, body in connection.execute(
                    "SELECT order_id, body FROM notes WHERE order_id < ?", (limit,)):
                notes.setdefault(order_id, []).append(body)
            total = 0
            for (order_id,) in connection.execute(
                    "SELECT id FROM orders WHERE id < ?", (limit,)):
                total += len(items.get(order_id, ())) + len(notes.get(order_id, ()))
            return total
      after: |
        def after(connection, limit):
            """One join, which multiplies the two relations against each other."""
            seen_items, seen_notes = set(), set()
            for order_id, sku, body in connection.execute(
                "SELECT o.id, i.sku, n.body FROM orders o "
                "JOIN items i ON i.order_id = o.id "
                "JOIN notes n ON n.order_id = o.id WHERE o.id < ?", (limit,)
            ):
                seen_items.add((order_id, sku))
                seen_notes.add((order_id, body))
            return len(seen_items) + len(seen_notes)
      note: |
        Two one-to-many relations, so a single join would return items x notes rows per order -- potentially far more data than the N+1 version transferred. `prefetch_related` issues one query per relation and joins in Python. Included because the reflex repair here is the wrong one, and row multiplication across relations is what catches it.

        Measured in `validation/taxonomy/C9S3_join_multiplies_rows.py`.
  patch_shape: structural
  measurability: scales_with_input
  min_workload_hint: |
    the effect is N avoided round trips, so scale on N; the stub's per-call cost has to be defensible, since it is what the whole figure rests on
