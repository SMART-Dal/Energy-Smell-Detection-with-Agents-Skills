- id: C11.S1
  signals:
    - lock_in_loop
  in_one_line: |
    a lock held across work that shares nothing, serialising what could overlap
  look_for: |
    A lock acquired more often, or held longer, than the shared state needs: `with self._lock:` taken once per item inside a loop, an explicit `acquire` and `release` per element, or a critical section that also computes, formats or does I/O on values no other thread touches. Every thread that wants the lock waits while that work runs, so work that could overlap runs one thread at a time. Name the shared state the lock protects; whatever else the section does is what can move out.
  refactoring:
    summary: hold the lock only over the shared state, or remove the need for it
  repairs:
    - case: C11S1_lock_contention
    - case: C11S1_lock_removed
      note: |
        The counting happens without synchronisation at all. Per-thread accumulation merged once works because addition is associative.
    - case: C11S1_single_threaded
      note: |
        With one thread the lock is never contended, so narrowing the critical section has nothing to buy.
  not_this:
    - title: a read and a write that must stay together
      source: catalog
      code: |
        with self._lock:
            current = self._counter
            self._counter = current + 1
        return current
      tempting: |
        with self._lock:
            current = self._counter
        self._counter = current + 1
        return current
      why: |
        Read-then-write is exactly what must stay indivisible. With the write outside the lock, two threads can read the same value and one increment is lost.
    - title: a callee that reads the shared state
      source: catalog
      code: |
        with self._lock:
            self._pending.append(item)
            self._flush_if_full()
      tempting: |
        with self._lock:
            self._pending.append(item)
        self._flush_if_full()
      why: |
        `_flush_if_full` inspects `_pending` to decide, so outside the lock two threads can both see a full buffer and flush twice. Whether a call can move out depends on the callee, which has to be read.
  similar:
    - C11.S2
    - C11.S4
- id: C11.S2
  in_one_line: |
    concurrency paid for in full while one shared resource serialises all of it
  look_for: |
    Concurrent workers that all pass through one shared resource for most of their work: a pool of threads that each hold the same lock around their whole task, one connection every worker must take for every operation, a thread pool running CPU-bound Python that the interpreter lock lets run only one at a time. The program pays for the concurrency -- thread stacks, scheduling, lock handoffs -- while the work proceeds serially. Name the resource everything passes through and the share of each worker's time spent holding it.
  refactoring:
    summary: give each worker its own resource, shard the work, or stop pretending to parallelise
  repairs:
    - case: C11S2_pooled_resource
    - case: C11S2_drop_the_concurrency
      note: |
        Reporting "delete the parallelism" as the repair is a legitimate finding.
    - case: C11S2_serial_bottleneck
  not_this:
    - title: a writer that cannot be shared or duplicated
      source: catalog
      code: |
        writer_lock = threading.Lock()

        def append_row(row):
            with writer_lock:
                writer.writerow(row)
      tempting: |
        local = threading.local()

        def append_row(row):
            if not hasattr(local, "writer"):
                local.writer = csv.writer(open(path, "a", newline=""))
            local.writer.writerow(row)
      why: |
        Every worker serialises on one writer, and it has to: a CSV writer is not thread-safe, and writes from separate handles interleave and corrupt the file. A single-writer file cannot be duplicated without changing the output.
  similar:
    - C11.S1
    - C11.S4
    - C11.S5
- id: C11.S3
  signals: []
  in_one_line: |
    workers started and never stopped, accumulating for the life of the process
  look_for: |
    A thread, process or task started with nothing that stops it, or one started per unit of work: a `threading.Thread` created per request, background pollers that spin while the real work runs, a worker with no `join`, no shutdown event and no enclosing `with`. A live thread holds its stack, and if it does anything it takes the interpreter lock other threads are waiting for; a busy-wait keeps a core occupied. What the thread does while it lives, and how many are created per unit of load, decide the cost.
  refactoring:
    summary: give every worker a stopping condition, or reuse a bounded pool
  repairs:
    - case: C11S3_thread_per_request
    - case: C11S3_leaked_busy_wait
    - case: C11S3_leaked_thread
  not_this:
    - title: a daemon started once for the life of the process
      source: catalog
      code: |
        watcher = threading.Thread(target=_reload_config, daemon=True)
        watcher.start()
      tempting: |
        watcher = threading.Thread(target=_reload_config, daemon=True)
        watcher.start()
        watcher.join()
      why: |
        `daemon=True` at module scope says the thread's lifetime is the process by design, and it will not block shutdown. The watcher runs as long as the process does, so joining it blocks the importing thread forever.
  similar:
    - C6.S4
    - C6.S6
- id: C11.S4
  signals:
    - blocking_call_in_async
  in_one_line: |
    a synchronous blocking call inside a coroutine, stopping every other task
  look_for: |
    A synchronous call that blocks, made inside a coroutine running on the event loop: `time.sleep` in an `async def`, `requests.get` or another synchronous client, file or subprocess I/O, or a long CPU-bound loop with no `await` -- sometimes several helper calls below the coroutine itself. The loop switches tasks only at an `await`, so while the call runs every other task stands still, including tasks whose I/O has already completed. Establish first that the enclosing function is a coroutine on the loop.
  refactoring:
    summary: await the async equivalent, or move the blocking work off the loop
  repairs:
    - case: C11S4_blocking_async
      note: |
        `time.sleep` stalls the whole loop so nothing else progresses, while `asyncio.sleep` yields.
    - case: C11S4_cpu_bound_in_coroutine
      note: |
        Because the work is CPU-bound and holds the GIL, the executor improves responsiveness rather than throughput; if throughput is the problem, a process pool is the repair.
    - case: C11S4_blocking_two_calls_down
      note: |
        The blocking sits two calls down, in a helper whose name suggests a lookup, and is findable only by reading the call path. The repair moves the whole enrichment pass rather than the one call, because a per-record executor hop costs more than the lookup.
  not_this:
    - title: the blocking call already runs on its own thread
      source: rule:blocking_call_in_async/run_pipeline
      code: |
        async def run_pipeline():
            def worker():
                time.sleep(10)

            threading.Thread(target=worker).start()
      tempting: |
        async def run_pipeline():
            async def worker():
                await asyncio.sleep(10)

            threading.Thread(target=worker).start()
      why: |
        `worker` is a nested function handed to a thread, so its sleep never runs on the event loop. Made a coroutine, the thread calls it, gets a coroutine object back and never runs the body.
  similar:
    - C11.S1
    - C11.S2
    - C11.S5
- id: C11.S5
  in_one_line: |
    independent work run one item at a time when the waits could have overlapped
  look_for: |
    Independent pieces of work run one after another when they could overlap: blocking waits -- network calls, sleeps, I/O -- each started only after the previous one returns, or independent CPU-bound tasks run in a single process. Serial work takes the sum of its parts where concurrent work takes the longest. During an I/O wait the process sits idle, so overlapping the waits removes idle time; CPU-bound Python gains nothing from threads, because the interpreter lock runs one at a time, and a process pool pickles every argument and result.
  refactoring:
    summary: run the independent work concurrently, with the tool the work's nature requires
  repairs:
    - case: C11S5_missed_parallelism
      note: |
        The process is idle during every wait, so overlapping the waits removes idle time it was paying for. No GIL problem, since the wait releases it, and no pickling.
    - case: C11S5_cpu_bound_processes
      note: |
        Processes rather than threads, because the GIL would serialise threads. Expect wall time to fall and total energy to be flat or worse.
    - case: C11S5_threads_for_cpu_bound
      note: |
        Pure Python arithmetic does not release the GIL, so the workers take turns: the wall time is the serial time plus scheduling, and the energy adds thread stacks, the pool and the context switches. Where the work releases nothing, the parallelism that was missed is a `ProcessPoolExecutor`.
    - case: C11S5_transfer_dominates
      note: |
        The whole right-hand matrix is sent to every task, and every argument and result is pickled both ways, so a task that receives a large structure and computes briefly is dominated by transfer.
  not_this:
    - title: steps that must run in order
      source: catalog
      code: |
        for migration in migrations:
            apply(migration)
      tempting: |
        with ThreadPoolExecutor() as pool:
            list(pool.map(apply, migrations))
      why: |
        Migration N assumes N-1 has run, and nothing in the loop says so. Run concurrently, the migrations apply out of order against a half-migrated schema.
  similar:
    - C9.S1
    - C10.S3
    - C11.S2
    - C11.S4
