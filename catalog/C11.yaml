- id: C11.S5
  in_one_line: |
    independent work run one item at a time when the waits could have overlapped
  what_to_look_for: |
    Independent work run serially takes the sum of its parts where concurrency takes the maximum.  Whether that lowers *energy* rather than only time depends entirely on what the work waits for, and this is the one root cause where the two can move in opposite directions.  For I/O-bound work the process is idle during each wait, so overlapping the waits removes idle time the machine was paying for anyway and energy falls with time -- measured here at **+86.4%**.  For CPU-bound work there is no idle to reclaim: eight cores at load draw more than one core at load, so wall time falls while total energy is flat or worse.  Say which of the two you have before proposing anything, and say what you expect to happen to energy and to time separately; a repair that improves only time is still worth reporting, labelled honestly.  Two Python-specific costs cut against the repair. Threads do not parallelise CPU-bound Python work at all.  And a process pool pickles every argument and every result both ways, so a task that receives a large structure and computes for microseconds is dominated by transfer -- this project's own sample sent a 500x500 matrix to every task to do one row of work, and the pickling swamped everything.  Independence is the precondition: no shared mutable state, no ordering requirement, no dependency between one result and the next input.  And whatever you start needs a shutdown path, or the repair has created a leak.
  not_a_smell_when:
  - |
    the items are not independent -- shared state, required ordering, a dependency chain
  - |
    the work is CPU-bound and the proposal is threads, where the GIL means there is nothing to gain
  - |
    the per-task data transfer exceeds the per-task work, so pickling dominates
  - |
    there are few enough items that pool setup exceeds the saving
  - |
    the goal is total energy rather than latency and the work is CPU-bound, where parallelism does not help and may hurt
  counter_examples:
  - code: |
      def matmul(a, b):
          m, n, p = len(a), len(a[0]), len(b[0])
          out = [[0] * p for _ in range(m)]
          for i in range(m):
              for j in range(p):
                  total = 0
                  for k in range(n):
                      total += a[i][k] * b[k][j]
                  out[i][j] = total
          return out
    why: |
      Obviously parallel -- every output row is independent -- and the project's own sample tried it with a `ProcessPoolExecutor` submitting one task per row, passing the whole 500x500 matrix `b` to each. That pickles 250 000 floats per task to do 500 rows of work, and the transfer dominates completely. Parallelism whose data transfer exceeds its compute is a regression. (The actual repair here is numpy, which is C10.S3.)
  - code: |
      with ThreadPoolExecutor(8) as pool:
          checksums = list(pool.map(sha256_of, blocks))
    why: |
      Eight threads over CPU-bound hashing. The GIL serialises them, so this runs at single-thread speed plus contention and scheduling overhead. It looks like the repair and it is the shape the card warns against -- unless `sha256_of` releases the GIL, which `hashlib` does for large inputs. Which is precisely why the classification step comes before the tool.
  - code: |
      for migration in migrations:
          apply(migration)
    why: |
      Independent-looking and strictly ordered: migration N assumes N-1 has run. Nothing in the loop says so. Independence is a fact about the domain, and independence has to be established rather than observed.
  refactoring:
    summary: run the independent work concurrently, with the tool the work's nature requires
    examples:
    - title: I/O-bound work, where energy and time both fall
      before: |
        import time


        def _wait(d):
            time.sleep(d)
            return 1


        def before(n, delay):
            return sum(_wait(delay) for _ in range(n))
      after: |
        import time


        from concurrent.futures import ThreadPoolExecutor


        def _wait(d):
            time.sleep(d)
            return 1


        def after(n, delay):
            with ThreadPoolExecutor(max_workers=8) as pool:
                return sum(pool.map(_wait, [delay] * n))
      note: |
        Fifty sequential round trips become fifty overlapping ones: the total is the slowest rather than the sum. This is the case where concurrency genuinely lowers energy, because the process was idle during every wait and that idle time was being paid for. No GIL problem -- the loop yields during I/O -- and no pickling.

        Measured in `validation/taxonomy/C11S5_missed_parallelism.py`.
    - title: CPU-bound work, where only time falls
      before: |
        def _work(n):
            total = 0
            for i in range(n):
                total += (i * 7919) % 10_007
            return total


        def before(tasks, work):
            return sum(_work(work) for _ in range(tasks))
      after: |
        from concurrent.futures import ProcessPoolExecutor


        WORKERS = 4


        def _work(n):
            total = 0
            for i in range(n):
                total += (i * 7919) % 10_007
            return total


        def after(tasks, work):
            with ProcessPoolExecutor(WORKERS) as pool:
                return sum(pool.map(_work, [work] * tasks))
      note: |
        Processes rather than threads, because the GIL would serialise threads. `chunksize` is the load-bearing detail: at the default of 1 every record is pickled individually and the transfer can exceed the work. Expect wall time to fall by roughly the core count and total energy to be flat or slightly worse -- report both, and if energy rises, say so plainly. That is a real result about this taxonomy, not a failed repair.

        Measured in `validation/taxonomy/C11S5_cpu_bound_processes.py`.
    - title: threads for CPU-bound work, which the GIL serialises
      before: |
        def _work(n):
            total = 0
            for i in range(n):
                total += (i * 7919) % 10_007
            return total


        def before(tasks, work):
            return sum(_work(work) for _ in range(tasks))
      after: |
        from concurrent.futures import ThreadPoolExecutor


        WORKERS = 8


        def _work(n):
            total = 0
            for i in range(n):
                total += (i * 7919) % 10_007
            return total


        def after(tasks, work):
            with ThreadPoolExecutor(WORKERS) as pool:
                return sum(pool.map(_work, [work] * tasks))
      note: |
        Threads for
        CPU-bound work.

        The description names this outright -- "a common Python mistake is using threads
        for CPU-bound work and wondering why it is not faster" -- and
        `C11S5_missed_parallelism` measures a thread pool over `time.sleep` at +86.4%,
        because `sleep` releases the interpreter lock.

        Pure Python arithmetic does not. The eight workers here take turns holding the
        GIL, so the wall time is what it was serially plus the scheduling, and the
        energy is what it was plus eight thread stacks, the pool, and a context switch
        every few milliseconds. The code is now concurrent and does strictly more work.

        The question is what the work releases the GIL for: I/O, `time.sleep`, a numpy
        call, a C extension that unlocks. Where the answer is "nothing", the parallelism
        that was missed is a `ProcessPoolExecutor` -- and that one has to pay for
        pickling the arguments, which is `C11S5_transfer_dominates`.

        Measured in `validation/taxonomy/C11S5_threads_for_cpu_bound.py`.
    - title: the pool whose transfer costs more than the work
      before: |
        def _row_times_matrix(args):
            row, matrix = args
            width = len(matrix[0])
            out = [0] * width
            for k, value in enumerate(row):
                column = matrix[k]
                for j in range(width):
                    out[j] += value * column[j]
            return out


        def before(a, b):
            return [_row_times_matrix((row, b)) for row in a]
      after: |
        from concurrent.futures import ProcessPoolExecutor


        WORKERS = 4


        def _row_times_matrix(args):
            row, matrix = args
            width = len(matrix[0])
            out = [0] * width
            for k, value in enumerate(row):
                column = matrix[k]
                for j in range(width):
                    out[j] += value * column[j]
            return out


        def after(a, b):
            with ProcessPoolExecutor(WORKERS) as pool:
                return list(pool.map(_row_times_matrix, [(row, b) for row in a]))
      note: |
        The repair that is a regression.

        The card's own counter-example, from this project's sample set: a matrix
        multiply parallelised per row with the whole right-hand matrix sent to every
        task. Every argument and every result is pickled both ways, so a task that
        receives a large structure and computes briefly is dominated by transfer.

        This is the adversarial file for C11.S5 and it exists to be a loss. The card
        says two questions prevent the mistake -- is this CPU-bound or I/O-bound, and
        how many bytes move per unit of work -- and this puts a number on the second.

        Measured in `validation/taxonomy/C11S5_transfer_dominates.py`.
  patch_shape: structural
  measurability: scales_with_input
  min_workload_hint: |
    enough items for pool setup to amortise, and per-task work large enough to dominate the transfer. Report energy and time separately and state which you expected to move -- for CPU-bound work a time-only improvement is the correct outcome, not a refutation
  notes: |
    The card most likely to produce a *regression* if applied by reflex, and the sample corpus contains one: a matrix multiply parallelised per row with the whole right-hand matrix pickled to every task.  Two questions prevent it -- is this CPU-bound or I/O-bound, and how many bytes move per unit of work.
    Also note the honest reporting requirement.  For CPU-bound work the expected outcome is that wall time falls and energy does not, and reporting that faithfully is more valuable than finding a saving: it is direct evidence for the claim that energy is not time, which is one of the things this taxonomy exists to test.
