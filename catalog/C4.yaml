- id: C4.S1
  signals:
    - expensive_operand_first
  in_one_line: |
    a boolean chain that evaluates its expensive operand before the cheap one that usually decides
  look_for: |
    A boolean chain whose earlier operand does work -- a call, or a sub-expression that builds something -- while a later operand is a comparison, an attribute read, a `len` or a flag that could decide the result alone. `and` stops at the first false operand and `or` at the first true one, so with the cheap test second the expensive one runs on every evaluation, including those the cheap test would have settled. In a comprehension filter or a per-row condition, that is paid once per element.
  refactoring:
    summary: put the cheap, most-decisive test first so short-circuiting can skip the rest
  repairs:
    - case: C4S1_decisive_cheap_test
      note: |
        Where most rows are unpublished, the attribute read decides the result for them and `permitted` is never called. Reordering is only valid because neither operand depends on the other.
    - case: C4S1_expensive_subexpression
      note: |
        `retryable_statuses` builds a set per call. The expensive operand does not have to be a bare call for this to apply -- it has to be the operand that does work.
    - case: C4S1_short_circuit_order
  not_this:
    - source: lookalike:C4S1_lookalike
      why: |
        `r["profile"] is not None` is the guard that makes the expensive operand safe to evaluate; swapped, the profile lookup runs on rows that have no profile and raises.
    - title: "`or` returns the first truthy operand, not just a boolean"
      source: rule:expensive_operand_first/get_author
      code: |
        def get_author(post_id, fallback_user):
            return fetch_username(post_id) or fallback_user
      tempting: |
        def get_author(post_id, fallback_user):
            return fallback_user or fetch_username(post_id)
      why: |
        `or` returns the value of the first truthy operand, so reordered, a truthy fallback is returned every time and the username is never fetched.
  similar:
    - C4.S6
    - C4.S7
    - C4.S8
    - C7.S4
    - C12.S3
- id: C4.S2
  in_one_line: |
    a test whose answer was already settled before it ran
  look_for: |
    A condition whose answer is already fixed when it runs. Look for the same test nested inside itself, an `elif` restating the negation of the `if` above it, an operand that an earlier branch on the same path has settled, and a test made redundant by a fact about the values rather than by repeated text -- `math.floor(x) <= math.ceil(x)`, `abs(x) >= 0`. The costly form is a determined test standing in front of work: a per-element check that cannot reject anything makes the whole scan behind it unnecessary.
  refactoring:
    summary: delete the condition whose result is already determined
  repairs:
    - case: C4S2_implied_by_domain_fact
      note: |
        `floor <= ceiling` for every real number, so `ceiling < limit` implies `floor < limit` and the second test can never fail. The fact comes from the domain, not from the syntax.
    - case: C4S2_settled_by_prior_branch
      note: |
        Reaching the second `if` means `first_exists and last_exists` was false, so once `last_exists` holds there, `not first_exists` is already known. What separates this from two independent tests is a fact about the booleans, not the syntax.
    - case: C4S2_negated_elif
      note: |
        Reaching the `elif` means `x < 0` was false, so `x >= 0` is already known. The original returns `None` for a NaN input, because neither branch matches; check whether that implicit `None` was load-bearing.
    - case: C4S2_guard_skips_scan
      note: |
        `abs(x)` is never negative, so `abs(x) + k > 0` is true whenever `k > 0` and the per-element test cannot reject anything; what gets skipped is the whole scan, not a comparison. The repair adds a guard, which puts it on the boundary with C4.S7.
    - case: C4S2_redundant_condition
  not_this:
    - source: lookalike:C4S2_lookalike
      why: |
        The first branch decrements `depth` before the second test runs, so the two identical comparisons ask about different values; deleting the second keeps items the original rejected.
    - title: the lock was released between the two tests
      source: catalog
      code: |
        with self._lock:
            if key in self._cache:
                return self._cache[key]
        value = compute(key)
        with self._lock:
            if key in self._cache:      # another thread may have filled it
                return self._cache[key]
            self._cache[key] = value
            return value
      tempting: |
        with self._lock:
            if key in self._cache:
                return self._cache[key]
        value = compute(key)
        with self._lock:
            self._cache[key] = value
            return value
      why: |
        Another thread may fill the entry while the lock is released for `compute`; without the second test this thread overwrites it, which is the race the re-check exists to prevent.
  similar:
    - C1.S3
    - C4.S4
    - C4.S5
- id: C4.S3
  signals:
    - deep_conditional_nesting
  in_one_line: |
    a nest or chain of branches that tests more than it has to, where a lookup would test once
  look_for: |
    A deep nest of `if`s, or a long `if`/`elif` chain, that tests more than the decision needs. Look for a subject re-tested on the way down a nest after an outer level has settled it, nested `if`s that only gate one final operation, and a run of arms comparing one subject, or one expression recomputed in each arm, against different constants. That run is a linear search, where a dict or tuple index answers in one probe when the arms are exhaustive and keyed on distinct values.
  refactoring:
    summary: |
      flatten with guard clauses that return early, or replace a chain of equality arms with a lookup
  repairs:
    - case: C4S3_guard_clauses
      note: |
        The same three tests, evaluated the same number of times, so this is almost entirely a readability repair.
    - case: C4S3_dispatch_table
      note: |
        The original recomputes `number % 4` in each arm it tests; the repair computes it once and indexes. It needs the arms to be exhaustive and keyed on a dense integer -- otherwise use a dict.
    - case: C4S3_match_statement
      note: |
        `match` on literal patterns is not a jump table in CPython; it is a sequence of comparisons like the `elif` chain it replaces.
  not_this:
    - title: ordered range boundaries, not distinct keys
      source: rule:deep_conditional_nesting/classify_latency
      code: |
        def classify_latency(ms):
            if ms < 10:
                return "fast"
            elif ms < 50:
                return "brisk"
            elif ms < 200:
                return "average"
            elif ms < 1000:
                return "slow"
            elif ms < 5000:
                return "degraded"
            return "timeout"
      tempting: |
        _LATENCY = {10: "fast", 50: "brisk", 200: "average", 1000: "slow", 5000: "degraded"}


        def classify_latency(ms):
            return _LATENCY.get(ms, "timeout")
      why: |
        Each arm is a `<` comparison against an ordered boundary, so a dict keyed on the boundaries answers only for those exact values: `classify_latency(3)` returns `"timeout"` instead of `"fast"`.
  similar:
    - C4.S4
    - C5.S1
    - C12.S3
- id: C4.S4
  signals:
    - independent_exclusive_ifs
  in_one_line: |
    consecutive `if`s on one subject that are exclusive in fact but not in form
  look_for: |
    A run of separate `if` statements on one subject whose conditions cannot both hold, so every pass evaluates every test even after one has matched. Look for equality tests against distinct constants, tests on one derived value such as `x % 4`, attribute subjects like `self.mode`, and range tests made exclusive by a precondition such as an `assert`, with bodies that leave the subject unchanged. An `if`/`elif` chain stops at the first match, so the waste grows with the number of arms and with how late the matching one sits.
  refactoring:
    summary: chain the branches with `elif` so evaluation stops at the first match
  repairs:
    - case: C4S4_two_arms
      note: |
        The `assert` is what licenses the edit: with `upper > lower` no value can be both above and below. Delete the assert and the repair becomes a bug.
    - case: C4S4_many_arms_late_match
      note: |
        Exclusive by construction: one value cannot equal two distinct constants.
    - case: C4S4_missing_elif
  not_this:
    - source: lookalike:C4S4_lookalike
      why: |
        A row can be both stale and oversized, so more than one arm is meant to run; an `elif` chain applies the first surcharge and silently drops the rest.
    - title: the first arm changes what the second tests
      source: rule:independent_exclusive_ifs/advance_pipeline
      code: |
        def advance_pipeline(task):
            if task.state == "QUEUED":
                task.state = "RUNNING"
            if task.state == "RUNNING":
                task.execute()
      tempting: |
        def advance_pipeline(task):
            if task.state == "QUEUED":
                task.state = "RUNNING"
            elif task.state == "RUNNING":
                task.execute()
      why: |
        The first body sets `task.state` to the value the second test checks; chained, a queued task is moved to running but `task.execute()` never runs on this call.
    - title: constants that look distinct but compare equal
      source: rule:independent_exclusive_ifs/parse_flag
      code: |
        def parse_flag(val):
            if val == 1:
                handle_numeric_one()
            if val == True:
                handle_boolean_true()
      tempting: |
        def parse_flag(val):
            if val == 1:
                handle_numeric_one()
            elif val == True:
                handle_boolean_true()
      why: |
        `1 == True` in Python, so a value of `1` or `True` passes both tests and the original runs both handlers; the `elif` chain runs only the first.
  similar:
    - C1.S3
    - C4.S2
    - C4.S3
- id: C4.S5
  signals: []
  in_one_line: |
    a type check made per element where the answer never varies or the types could dispatch themselves
  look_for: |
    Runtime type introspection on the per-element path. Look for `isinstance`, `type(x) ==`, `hasattr` used as a type probe, or a comparison against `type(x).__name__` inside a loop, and ask what the check decides. When every element has the same type, the loop asks a question it could have settled once; when an `isinstance` chain picks per-type arithmetic on classes that could each carry a method, attribute lookup could do the dispatch. Each `isinstance` walks the class's MRO looking for a match, so a chain repeats that walk per element.
  refactoring:
    summary: hoist the type decision out of the loop, or dispatch polymorphically
  repairs:
    - case: C4S5_hoisted_type_decision
      note: |
        The hoisted version pays one extra pass to buy a branch-free loop.
    - case: C4S5_expensive_comparison
      note: |
        Moving the per-type arithmetic onto the classes replaces a chain of MRO walks with one attribute lookup per element. It only applies when you own the classes.
    - case: C4S5_heterogeneous_input
      note: |
        Neither repair is available: the branches do different things and the elements do not share an interface, so the only edit left is swapping `isinstance` for `type(x) is`, which changes behaviour for subclasses.
  not_this:
    - source: lookalike:C4S5_lookalike
      why: |
        `bool` is a subclass of `int`, so `isinstance` treats `True` and `False` as integers while `type(x) is int` drops them into the fallback; the identity check is only interchangeable when no subclass can reach it.
  similar:
    - C3.S2
    - C4.S2
    - C10.S2
- id: C4.S6
  signals:
    - try_except_in_loop
  in_one_line: |
    an exception used as ordinary control flow, on a path where it is raised often
  look_for: |
    A `try`/`except` inside a loop whose exception is the common outcome rather than the rare one. Entering the `try` costs next to nothing; each raise instantiates the exception, captures a traceback, unwinds and matches the handler, so the cost is the raise rate times the cost of a raise. Look for a subscript that raises `KeyError` on keys that are usually missing, and a converter such as `int()` that raises `ValueError` on most of its inputs, in a `for` or `while` body.
  refactoring:
    summary: replace the frequently-raised exception with an explicit check
  repairs:
    - case: C4S6_exception_control_flow
      note: |
        A repair only when the keys usually miss: with keys that are always present, the original is the faster of the two.
    - case: C4S6_exact_precheck
      note: |
        The pre-check has to be exact or this is not behaviour-preserving: `isdigit` rejects whitespace, underscores and a leading `+` where `int()` accepts some of them.
    - case: C4S6_no_cheap_precheck
      note: |
        Checking membership first does not remove the exception -- `load` can raise for a second reason the check cannot see -- so the `try` stays.
  not_this:
    - title: the pre-check races with the operation it guards
      source: catalog
      code: |
        for path in paths:
            try:
                data = load(path)
            except FileNotFoundError:
                continue
            process(data)
      tempting: |
        for path in paths:
            if not os.path.exists(path):
                continue
            data = load(path)
            process(data)
      why: |
        The file can vanish between `os.path.exists` and the open, and with the `try` gone that `FileNotFoundError` now escapes the loop instead of skipping the path.
    - title: the handler covers a failure no pre-check can predict
      source: catalog
      code: |
        for row in rows:
            try:
                total += int(row["amount"])
            except (KeyError, ValueError):
                skipped += 1
      tempting: |
        for row in rows:
            if "amount" not in row:
                skipped += 1
                continue
            total += int(row["amount"])
      why: |
        The handler catches two failures and only the missing key has a cheap test: a non-numeric `amount` now raises `ValueError` out of the loop instead of being counted in `skipped`.
  similar:
    - C4.S1
    - C4.S7
- id: C4.S7
  in_one_line: |
    a missing cheap test that would let a common trivial input skip the expensive path
  look_for: |
    A function that sends a common trivial input through its full machinery. Look for a class of input the general path does not need -- empty, one element, already sorted, or a value a cheap property settles, such as parity in front of a trial-division primality test -- with no test that returns early for it. A guard pays when that input is common, when the test is cheaper than the path it skips, and when the general path does not already make the same test internally.
  refactoring:
    summary: add a cheap guard that skips the expensive path for the trivial case
  repairs:
    - case: C4S7_algebraic_guard
      note: |
        The guard has to name the exception -- 2 is both even and prime -- and getting that wrong is the failure mode. When you own the callee, the better repair may be to fix `is_prime` itself, which is C7.S1.
    - case: C4S7_guard_before_short_circuit
      note: |
        Worth it only after checking that the callee does not make the same test first.
    - case: C4S7_edge_case_guard
  not_this:
    - title: the guard has to invent an answer the original raises on
      source: catalog
      code: |
        def median(values):
            ordered = sorted(values)
            return ordered[len(ordered) // 2]
      tempting: |
        def median(values):
            if len(values) < 2:
                return values[0] if values else None
            ordered = sorted(values)
            return ordered[len(ordered) // 2]
      why: |
        The original raises `IndexError` on an empty input, and the guard returns `None` instead. `len()` also raises `TypeError` on a generator, which `sorted()` accepted.
  similar:
    - C1.S6
    - C4.S1
    - C4.S6
- id: C4.S8
  signals:
    - ruff_SIM401
    - ruff_SIM118
  in_one_line: |
    a condition spelled the long way round, missing the interpreter's fast path
  look_for: |
    A condition spelled the long way round, where CPython has a fast path for the idiom. Look for `len(x) == 0` where the truth test `not x` asks the object directly, `key in d.keys()`, which builds a view before probing the table, a membership test followed by a second lookup of the same key where `.get()` hashes it once, and `a <= f(x) and f(x) <= b`, which evaluates the middle operand twice where `a <= f(x) <= b` evaluates it once. Each difference is a few bytecodes per evaluation.
  refactoring:
    summary: use the idiomatic form
  repairs:
    - case: C4S8_membership_and_get
      note: |
        Two changes in one: `key in mapping` skips building a view object, and `.get()` replaces a membership test followed by a second hash of the same key.
    - case: C4S8_chained_comparison
      note: |
        The chained form evaluates `_position(row)` once instead of twice.
    - case: C4S8_non_idiomatic
    - case: C4S8_len_versus_truthiness
      note: |
        `len()` is a global lookup, a call, and an integer comparison; the truth test asks the object for its boolean directly, and a list answers from its own size field.
  not_this:
    - source: lookalike:C4S8_lookalike
      why: |
        The values can be numbers, and `not 0` is true where the original skips only empty lists and strings; the explicit form was also asserting a type, so the idiom drops every zero.
    - title: the operand is a pandas DataFrame or a numpy array
      source: catalog
      code: |
        if len(frame) == 0:
            return empty_result()
      tempting: |
        if not frame:
            return empty_result()
      why: |
        A DataFrame raises `ValueError` when asked for its truth value, and so does a numpy array with more than one element; for them the explicit length test is the correct spelling.
  similar:
    - C4.S1
    - C10.S2
