- id: C4.S1
  signals:
  - expensive_operand_first
  in_one_line: |
    a boolean chain that evaluates its expensive operand before the cheap one that usually decides
  what_to_look_for: |
    `and` stops at the first false operand and `or` at the first true one, so every operand after the deciding one is never evaluated and the order of a chain decides what it costs on average.  Look for a chain where an earlier operand calls something and a later one does not -- a comparison, an attribute read, a `len`, an `isinstance` are all free by comparison.  The saving is the expensive operand's cost times how often the cheap test would have short-circuited, so an operand that is almost never decisive is worth nothing to move, and the report has to say which way the data usually goes. Independence is the check that matters: `if handle is not None and handle.is_open()` has to stay in that order, and swapping it is a bug rather than a repair.  Watch too for an operand with a side effect that has to happen on every evaluation.
  not_a_smell_when:
  - |
    the later operand depends on the earlier one succeeding, so the order is required for correctness rather than chosen for speed
  - |
    the "expensive" call is actually cheap -- `isinstance`, `len`, `type`, a plain attribute read
  - |
    the expensive operand is almost always the deciding one, so putting it later means evaluating both
  - |
    an operand has a side effect that must happen on every evaluation
  counter_examples:
  - code: |
      if handle is not None and handle.is_open():
          handle.write(payload)
    why: |
      The call is second already, and it has to be: `handle.is_open()` raises on `None`. Any rule that only compares "cheap" against "expensive" wants to reorder this. The ordering is a correctness constraint.
  - code: |
      if cache.get(key) is not None or expensive_default(key):
          use(key)
    why: |
      Both operands call something, so there is no cheap test to promote. The candidate needs an operand that costs nothing, not merely one that costs less.
  refactoring:
    summary: put the cheap, most-decisive test first so short-circuiting can skip the rest
    examples:
    - title: a call before a comparison that usually decides
      before: |
        def _permitted(viewer, row):
            return sum(ord(c) for c in row["owner"]) % 7 == viewer % 7


        def before(rows, viewer):
            return [r for r in rows if _permitted(viewer, r) and r["published"]]
      after: |
        def _permitted(viewer, row):
            return sum(ord(c) for c in row["owner"]) % 7 == viewer % 7


        def after(rows, viewer):
            return [r for r in rows if r["published"] and _permitted(viewer, r)]
      note: |
        Most rows in a typical dataset are unpublished, so the attribute read decides the result for most of them and `permitted` is never called. Reordering is only valid because neither operand depends on the other; verify that with an equivalence check that includes the inputs where the original order mattered.

        Measured in `validation/taxonomy/C4S1_decisive_cheap_test.py`.
    - title: the expensive operand is a whole sub-expression
      before: |
        def before(responses, policy):
            return sum(
                1 for status, host, attempt in responses
                if status in policy.retryable_statuses(host) and attempt < policy.max_attempts
            )
      after: |
        def after(responses, policy):
            return sum(
                1 for status, host, attempt in responses
                if attempt < policy.max_attempts and status in policy.retryable_statuses(host)
            )
      note: |
        `retryable_statuses` builds a set per call. On the last attempt the comparison alone settles the question, so the set is never built. The expensive operand does not have to be a bare call for this to apply -- it has to be the operand that does work.

        Measured in `validation/taxonomy/C4S1_expensive_subexpression.py`.
    - title: the order reversed, where the cheap test rejects nothing
      before: |
        def _expensive(x):
            return len(str(x * x * x)) > 3


        def before(xs, k):
            return [x for x in xs if _expensive(x) and x > k]
      after: |
        def _expensive(x):
            return len(str(x * x * x)) > 3


        def after(xs, k):
            return [x for x in xs if x > k and _expensive(x)]
      note: |
        Expensive test evaluated first.

        `and` stops at the first false, so putting the cheap decisive test first means
        the expensive one runs only on what survives.

        Measured in `validation/taxonomy/C4S1_short_circuit_order.py`.
  patch_shape: expression
  measurability: scales_with_input
  min_workload_hint: |
    the driver must supply inputs where the cheap test actually short-circuits; with data that always reaches the expensive operand the repair correctly measures as nothing
  similar:
  - C4.S6
  - C4.S7
  - C4.S8
  - C7.S4
  - C12.S3
- id: C4.S2
  in_one_line: |
    a test whose answer was already settled before it ran
  what_to_look_for: |
    A determined test still costs the full evaluation -- loading the operands, the comparison, the branch -- and on a straight-line path that is one bytecode and nothing more.  What makes this worth reporting is the case where the determined test *guards work*: the second half of an `and` that can never fail, an `elif` restating the negation of the `if` above it, or a check standing between the caller and a scan the code did not need to perform.  Then what the repair deletes is not the comparison but everything behind it, so say what the test is guarding before deciding whether there is a finding at all.  Three things determine an answer in advance, and the report should name which one applies: a prior test on the same path has settled it; a fact about the domain makes it unconditional (`math.floor(x) <= math.ceil(x)`, `abs(x) >= 0`, an `assert` at the top of the function); or the value was assigned a known constant with nothing able to change it in between.  That middle source is the interesting one and it has no syntactic signature at all -- it is found by knowing what the values mean.  Two things make the shape appear where the repair is wrong: concurrency, where an `await` or a released lock genuinely lets the answer change between two identical tests, and defensive re-checks that document an invariant for callers a maintainer cannot see.
  not_a_smell_when:
  - |
    the test is a defensive assertion documenting an assumption the function relies on, so deleting it removes the documentation along with the check
  - |
    concurrency means the value genuinely can change between the two checks -- another thread, an `await` point, a released lock, a signal handler
  - |
    the "already known" fact depends on an input invariant the function does not enforce, so it holds for today's callers rather than by construction
  - |
    the determined test guards one cheap statement, so the whole saving is a comparison and no workload will show it
  counter_examples:
  - code: |
      def withdraw(account, amount):
          if amount <= 0:
              raise ValueError(amount)
          if account.balance < amount:
              raise InsufficientFunds(account, amount)
          account.balance -= amount
    why: |
      Two tests on related subjects, neither implied by the other, both load-bearing. Anything that pattern-matches "two ifs about `amount`" reports this. Nothing here is determined, which is why the card asks you to *name* what determines an answer rather than to notice repetition.
  - code: |
      with self._lock:
          if key in self._cache:
              return self._cache[key]
      value = compute(key)
      with self._lock:
          if key in self._cache:      # another thread may have filled it
              return self._cache[key]
          self._cache[key] = value
          return value
    why: |
      The same test twice on the same subject, and the second one is the whole point of the pattern: the lock was released in between, so another thread may have populated the entry. Double-checked locking looks exactly like redundant evaluation, and deleting the second test is a race.
  refactoring:
    summary: delete the condition whose result is already determined
    examples:
    - title: the second half of an `and` cannot fail
      before: |
        import math


        def _classify_before(value, limit):
            floor = math.floor(value)
            ceiling = math.ceil(value)
            if ceiling < limit and floor < limit:
                return 2
            if floor < limit:
                return 1
            return 0


        def before(values, limit):
            return sum(_classify_before(v, limit) for v in values)
      after: |
        import math


        def _classify_after(value, limit):
            floor = math.floor(value)
            ceiling = math.ceil(value)
            if ceiling < limit:
                return 2
            if floor < limit:
                return 1
            return 0


        def after(values, limit):
            return sum(_classify_after(v, limit) for v in values)
      note: |
        `floor <= ceiling` for every real number, so `ceiling < limit` implies `floor < limit` and the second test can never fail. The fact comes from the domain, not from the syntax -- which is exactly why no static rule finds this and a reader does.

        Measured in `validation/taxonomy/C4S2_implied_by_domain_fact.py`.
    - title: a prior branch has already settled half the next condition
      before: |
        def _search_before(nums, target):
            first_exists = bool(nums) and nums[0] == target
            last_exists = bool(nums) and nums[-1] == target
            if first_exists and last_exists:
                return -1
            if last_exists and not first_exists:
                return nums[0]
            return 0


        def before(nums, target, repeats):
            total = 0
            for _ in range(repeats):
                total += _search_before(nums, target)
            return total
      after: |
        def _search_after(nums, target):
            first_exists = bool(nums) and nums[0] == target
            last_exists = bool(nums) and nums[-1] == target
            if first_exists and last_exists:
                return -1
            if last_exists:
                return nums[0]
            return 0


        def after(nums, target, repeats):
            total = 0
            for _ in range(repeats):
                total += _search_after(nums, target)
            return total
      note: |
        Reaching the second `if` means `first_exists and last_exists` was false, so once `last_exists` holds there, `not first_exists` is already known. The repair is one operand and worth a bytecode -- included because it is the shape the description is really about, and because nothing syntactic distinguishes it from the `withdraw` counter-example above. What separates them is a fact about the booleans, which is why this form is found by reading and not by a rule.

        Measured in `validation/taxonomy/C4S2_settled_by_prior_branch.py`.
    - title: an `elif` that restates the negation of its `if`
      before: |
        def _relu_before(x):
            if x < 0:
                return 0
            elif x >= 0:
                return x


        def before(values):
            return sum(_relu_before(v) for v in values)
      after: |
        def _relu_after(x):
            if x < 0:
                return 0
            return x


        def after(values):
            return sum(_relu_after(v) for v in values)
      note: |
        Reaching the `elif` means `x < 0` was false, so `x >= 0` is already known. Note what else changes: the original returns `None` for a NaN input, because neither branch matches. Check whether that implicit `None` was load-bearing before claiming the repair.

        Measured in `validation/taxonomy/C4S2_negated_elif.py`.
    - title: the determined test stands in front of a whole scan
      before: |
        def before(values, k):
            return len([1 for x in values if abs(x) + k > 0])
      after: |
        def after(values, k):
            if k > 0:
                return len(values)
            return len([1 for x in values if abs(x) + k > 0])
      note: |
        `abs(x)` is never negative, so `abs(x) + k > 0` is unconditionally true whenever `k > 0` and the per-element test cannot reject anything. This is the form worth reporting: what gets skipped is the whole scan, not a comparison. It is expressed by *adding* a guard, which puts it on the boundary with C4.S7 -- report whichever you can defend and say which you chose.

        Measured in `validation/taxonomy/C4S2_guard_skips_scan.py`.
    - title: the same test nested inside itself
      before: |
        def before(xs, k):
            out = []
            for x in xs:
                if x > k:
                    if x > k:              # already established
                        out.append(x)
            return out
      after: |
        def after(xs, k):
            out = []
            for x in xs:
                if x > k:
                    out.append(x)
            return out
      note: |
        Advisory; a test already known.

        Measured in `validation/taxonomy/C4S2_redundant_condition.py`.
  patch_shape: statement_local
  measurability: scales_with_input
  min_workload_hint: |
    only the guarding form is measurable; when the determined test stands in front of one cheap statement, report it as advisory rather than building a case file
  notes: |
    The published example for this root cause is `if items: if items:`, which nobody writes.  The interesting form, and the one the description's own wording points at, is a test made redundant by a *fact about the domain* rather than by textual duplication.  The project's sample set has four: `floor <= ceil`, `abs(x) >= 0`, an `elif` restating a negation, and four range branches collapsing to `low <= x <= high`.  None is findable syntactically, and every one is ordinary code somebody wrote on purpose.
  similar:
  - C1.S3
  - C4.S4
  - C4.S5
- id: C4.S3
  signals:
  - deep_conditional_nesting
  in_one_line: |
    a nest or chain of branches that tests more than it has to, where a lookup would test once
  what_to_look_for: |
    Nesting by itself costs nothing beyond the tests it contains -- reaching depth four evaluates four conditions whether they are nested or chained -- so depth alone is a readability matter and out of scope here.  Two things make it expensive.  The same subexpression re-evaluated on paths where an earlier branch already settled it.  And a run of arms comparing one subject against different constants, which is a linear search: N arms average about N/2 comparisons where a dict lookup or an index is one probe regardless of N. So find the actual waste before proposing anything, and check the arms are exhaustive and dense enough to index -- four arms keyed on `n % 4` become a tuple index, four arms on unrelated predicates do not, and ordered range boundaries have no key at all.  Guard clauses only help when they let you stop testing rather than restate the same tests in another order, which is why the flattening form of this repair usually measures as nothing and the dispatch-table form is the measurable one.
  not_a_smell_when:
  - |
    the nesting mirrors genuinely nested domain logic, so flattening would duplicate conditions rather than remove them
  - |
    the depth comes from `try`, `with` or `for` rather than from repeated tests
  - |
    the arms test unrelated predicates, so there is no key to dispatch on
  - |
    the chain is short and its first arm matches almost always, so the average number of comparisons is already close to one
  counter_examples:
  - code: |
      def classify(value):
          if value < 10:
              return "small"
          elif value < 100:
              return "medium"
          elif value < 1000:
              return "large"
          return "huge"
    why: |
      Four arms comparing one subject, which looks exactly like the dispatchable case and is not: these are ordered range boundaries rather than distinct keys, so there is nothing to index on -- a dict would need an entry per possible value. Ordered comparisons stay comparisons.
  - code: |
      def render(node, depth=0):
          if node.visible:
              if node.children:
                  for child in node.children:
                      render(child, depth + 1)
              else:
                  emit(node, depth)
    why: |
      Depth three, no repeated test, and each level asks a different question about a different thing. Flattening this changes the shape of the code and removes no work at all.
  refactoring:
    summary: |
      flatten with guard clauses that return early, or replace a chain of equality arms with a lookup
    examples:
    - title: guard clauses instead of nesting
      before: |
        def _work(request):
            return request["size"] * 2


        def before(requests):
            total = 0
            for request in requests:
                if request is not None:
                    if request["ready"]:
                        if request["size"] > 0:
                            total += _work(request)
            return total
      after: |
        def _work(request):
            return request["size"] * 2


        def after(requests):
            total = 0
            for request in requests:
                if request is None:
                    continue
                if not request["ready"]:
                    continue
                if request["size"] <= 0:
                    continue
                total += _work(request)
            return total
      note: |
        The same three tests, evaluated the same number of times, so this is almost entirely a readability repair. Report it and expect `advisory` unless the guarded work sits in a very hot loop.

        Measured in `validation/taxonomy/C4S3_guard_clauses.py`.
    - title: a comparison chain that is really a table
      before: |
        def before(numbers):
            out = []
            for number in numbers:
                if number % 4 == 0:
                    out.append("red")
                elif number % 4 == 1:
                    out.append("blue")
                elif number % 4 == 2:
                    out.append("green")
                else:
                    out.append("yellow")
            return out
      after: |
        _TYPES = ("red", "blue", "green", "yellow")


        def after(numbers):
            return [_TYPES[number % 4] for number in numbers]
      note: |
        The original computes `number % 4` up to four times and evaluates up to three comparisons; the repair computes it once and indexes. This is the measurable form of C4.S3, and it needs the arms to be exhaustive and keyed on a dense integer -- otherwise use a dict. Hoisting the tuple to module scope also removes a per-call build, which is C5.S3; if you notice both, they are one repair and one is subsumed.

        Measured in `validation/taxonomy/C4S3_dispatch_table.py`.
    - title: the same chain written as `match`
      before: |
        def before(codes):
            total = 0
            for code in codes:
                if code == "created":
                    total += 1
                elif code == "queued":
                    total += 2
                elif code == "running":
                    total += 3
                elif code == "retried":
                    total += 4
                elif code == "failed":
                    total += 5
                else:
                    total += 6
            return total
      after: |
        def after(codes):
            total = 0
            for code in codes:
                match code:
                    case "created":
                        total += 1
                    case "queued":
                        total += 2
                    case "running":
                        total += 3
                    case "retried":
                        total += 4
                    case "failed":
                        total += 5
                    case _:
                        total += 6
            return total
      note: |
        The same chain written as
        `match`/`case`.

        The description names three repairs for a monolithic conditional: guard
        clauses, dictionary dispatch, and `match`/`case`. The other two are measured --
        `C4S3_dispatch_table` at +53.6% and `C4S3_guard_clauses` at -0.1% -- and this is
        the third.

        The comparison is deliberately narrow. Same tests, same order, same arms, same
        bodies; only the construct differs. `match` on literal patterns is not a jump
        table in CPython, it is a sequence of comparisons like the `elif` chain it
        replaces, so the expectation is a reading near zero -- and if that is what comes
        back, the card can say that this repair is a readability change and that only
        the dispatch-table form carries an energy claim.

        `late-match` sits on the last arm, where any difference in how the arms are
        walked has the most room to show.

        Measured in `validation/taxonomy/C4S3_match_statement.py`.
  patch_shape: structural
  measurability: scales_with_calls
  min_workload_hint: |
    the effect is per evaluation, so the driver must call the branch many times over cheap inputs rather than once over an expensive one
  notes: |
    The guard-clause form of this repair usually measures as nothing, because it evaluates the same tests in the same number.  Report it, and expect advisory rather than verified unless the guarded work is in a hot loop.  The dispatch-table form is the measurable one.
  similar:
  - C4.S4
  - C5.S1
  - C12.S3
- id: C4.S4
  signals:
  - independent_exclusive_ifs
  in_one_line: |
    consecutive `if`s on one subject that are exclusive in fact but not in form
  what_to_look_for: |
    Separate `if` statements each evaluate their condition unconditionally, so N of them cost N tests on every pass; an `if`/`elif` chain stops at the first match, which is around N/2 on average.  The saving is the difference, paid per evaluation, so it is proportional to the number of arms and to how early the matching one usually sits -- two arms save half a comparison, a dozen arms in a per-element loop are worth measuring.  The repair lives or dies on exclusivity, and the report has to *name* what guarantees it rather than eyeball the conditions.  Equality tests against distinct constants are exclusive by construction.  Range tests are only exclusive when the ranges cannot overlap, which usually rests on a precondition -- an `assert`, a validated argument, a documented invariant -- and deleting that precondition later turns the repair into a bug.  Two other things end candidates: a branch body that reassigns the subject, which makes the later tests different questions, and branches that are genuinely both meant to run.
  not_a_smell_when:
  - |
    the branches are not mutually exclusive and more than one may legitimately run, so chaining them would drop behaviour
  - |
    a body mutates the subject, so the later tests are asking about a different value
  - |
    exclusivity holds for the inputs this program happens to pass rather than by construction, and nothing enforces it
  - |
    there are two arms in a function called a handful of times, where the whole saving is half a comparison
  counter_examples:
  - code: |
      def normalise(text):
          if text.startswith(" "):
              text = text.lstrip()
          if text.endswith(" "):
              text = text.rstrip()
          return text
    why: |
      Two `if`s on one subject and both may legitimately run -- a string can be padded at both ends. Worse, the first body reassigns `text`, so the second test is about a different value. Chaining these is a behaviour change on the commonest input.
  - code: |
      def bucket(value, low, high):
          if value > high:
              return "above"
          if value < low:
              return "below"
          return "within"
    why: |
      Already exclusive in effect, because each branch returns. Control never reaches the second test after the first matches, so an `elif` changes nothing but the punctuation.
  refactoring:
    summary: chain the branches with `elif` so evaluation stops at the first match
    examples:
    - title: the exclusivity is guaranteed by a precondition
      before: |
        def before(values, lower, upper):
            assert upper > lower
            below, above = 0, 0
            for x in values:
                if x > upper:
                    above += 1
                if x < lower:
                    below += 1
            return below, above
      after: |
        def after(values, lower, upper):
            assert upper > lower
            below, above = 0, 0
            for x in values:
                if x > upper:
                    above += 1
                elif x < lower:
                    below += 1
            return below, above
      note: |
        The `assert` is what licenses the edit: with `upper > lower` no value can be both above and below, so an element matching the first test cannot match the second. Delete the assert and the repair becomes a bug, which is why the guarantee has to be named in the finding rather than assumed from the shape of the conditions.

        Measured in `validation/taxonomy/C4S4_two_arms.py`.
    - title: equality arms against distinct constants
      before: |
        def before(grades):
            total = 0
            for grade in grades:
                bonus = 0
                if grade == "A": bonus = 12
                if grade == "B": bonus = 11
                if grade == "C": bonus = 10
                if grade == "D": bonus = 9
                if grade == "E": bonus = 8
                if grade == "F": bonus = 7
                if grade == "G": bonus = 6
                if grade == "H": bonus = 5
                if grade == "I": bonus = 4
                if grade == "J": bonus = 3
                if grade == "K": bonus = 2
                if grade == "L": bonus = 1
                total += bonus
            return total
      after: |
        def after(grades):
            total = 0
            for grade in grades:
                if grade == "A": total += 12
                elif grade == "B": total += 11
                elif grade == "C": total += 10
                elif grade == "D": total += 9
                elif grade == "E": total += 8
                elif grade == "F": total += 7
                elif grade == "G": total += 6
                elif grade == "H": total += 5
                elif grade == "I": total += 4
                elif grade == "J": total += 3
                elif grade == "K": total += 2
                elif grade == "L": total += 1
            return total
      note: |
        Exclusive by construction: one value cannot equal two distinct constants. Three tests on every call become one for an "A". At three arms this is close to advisory; the same shape with a dozen arms in a per-element loop is worth measuring, and beyond that consider a lookup instead, which is C4.S3.

        Measured in `validation/taxonomy/C4S4_many_arms_late_match.py`.
    - title: exhaustive arms on one derived value
      before: |
        def before(xs):
            out = 0
            for x in xs:
                r = x % 4
                if r == 0:
                    out += 1
                if r == 1:
                    out += 2
                if r == 2:
                    out += 3
                if r == 3:
                    out += 4
            return out
      after: |
        def after(xs):
            out = 0
            for x in xs:
                r = x % 4
                if r == 0:
                    out += 1
                elif r == 1:
                    out += 2
                elif r == 2:
                    out += 3
                else:
                    out += 4
            return out
      note: |
        Independent ifs where the cases are exclusive.

        Measured in `validation/taxonomy/C4S4_missing_elif.py`.
  patch_shape: statement_local
  measurability: scales_with_input
  min_workload_hint: |
    needs many evaluations and enough arms for the skipped tests to add up; the driver's data should sometimes match early and sometimes late
  similar:
  - C1.S3
  - C4.S2
  - C4.S3
- id: C4.S5
  signals: []
  in_one_line: |
    a type or identity check asked once per element when the answer never varies
  what_to_look_for: |
    A type check is cheap once and expensive per element.  `isinstance` walks the class's MRO looking for a match, `type(x) == C` is a pointer comparison, and `str(type(x)) == "..."` builds a string; none is slow in isolation and all are pure overhead when the answer is the same for every element of a collection.  Look for runtime introspection on the per-element path -- `isinstance`, `type(x) ==`, `hasattr` used as a type probe, a comparison against `type(x).__name__` -- and ask whether the loop is asking a question it could have settled once.  The repair either hoists the decision or lets attribute lookup dispatch instead, and both have preconditions: hoisting needs a cheap way to settle the type once, polymorphic dispatch needs the types to share a method name, and `functools.singledispatch` needs the dispatch to be on the first argument.  Check the replacement is not the more expensive one, since scanning the collection with `all(isinstance(...))` to hoist a decision costs a full extra pass that only pays when the loop body is heavier than the check.  A genuinely heterogeneous input whose branches do different things has no smell here -- the check is the algorithm.
  not_a_smell_when:
  - |
    the input is genuinely heterogeneous with no common interface, so the check is what selects the correct behaviour
  - |
    the check runs once per call rather than once per element
  - |
    the check guards against a type that would raise, making it a correctness guard rather than a dispatch mechanism
  - |
    hoisting would need a full extra pass over the data that costs more than the per-element checks it removes
  counter_examples:
  - code: |
      def flatten(items):
          for item in items:
              if isinstance(item, (list, tuple)):
                  yield from flatten(item)
              else:
                  yield item
    why: |
      The check is the algorithm. The input is heterogeneous by definition and the two branches do genuinely different things, so there is nothing to hoist and no shared interface to dispatch on.
  - code: |
      def normalise(value):
          if not isinstance(value, str):
              raise TypeError(value)
          return value.strip()
    why: |
      One check per call, and a correctness guard rather than dispatch. Removing it saves no per-element work; it removes an error message.
  refactoring:
    summary: hoist the type decision out of the loop, or dispatch polymorphically
    examples:
    - title: the answer is the same for every element
      before: |
        def before(values, work):
            out = []
            for value in values:
                if isinstance(value, str):
                    out.append(value.strip() * work)
                else:
                    out.append(str(value) * work)
            return out
      after: |
        def after(values, work):
            if values and all(type(v) is str for v in values):
                return [v.strip() * work for v in values]
            return [v.strip() * work if isinstance(v, str) else str(v) * work for v in values]
      note: |
        The hoisted version pays one extra pass to buy a branch-free loop, so it wins only when the loop body is heavier than a comparison. Measure it; if the extra pass dominates, the honest answer is that this is not a smell here.

        Measured in `validation/taxonomy/C4S5_hoisted_type_decision.py`.
    - title: the types already share a method
      before: |
        class Circle:
            __slots__ = ("radius",)

            def __init__(self, radius):
                self.radius = radius

            def area(self):
                return 3.14159 * self.radius ** 2


        class Square:
            __slots__ = ("side",)

            def __init__(self, side):
                self.side = side

            def area(self):
                return self.side ** 2


        class Triangle:
            __slots__ = ("base", "height")

            def __init__(self, base, height):
                self.base = base
                self.height = height

            def area(self):
                return 0.5 * self.base * self.height


        def before(shapes):
            total = 0.0
            for shape in shapes:
                if isinstance(shape, Circle):
                    total += 3.14159 * shape.radius ** 2
                elif isinstance(shape, Square):
                    total += shape.side ** 2
                elif isinstance(shape, Triangle):
                    total += 0.5 * shape.base * shape.height
            return total
      after: |
        def after(shapes):
            total = 0.0
            for shape in shapes:
                total += shape.area()
            return total
      note: |
        Moving the per-type arithmetic onto the classes replaces a chain of MRO walks with one attribute lookup per element. This is `cross_unit` in practice -- the classes gain a method -- so name every file you touched, and note it only applies when you own the classes.

        Measured in `validation/taxonomy/C4S5_expensive_comparison.py`.
    - title: input that is genuinely mixed, where the check has to stay
      before: |
        def before(values):
            out = []
            for value in values:
                if isinstance(value, str):
                    out.append(len(value))
                elif isinstance(value, (list, tuple)):
                    out.append(len(value) * 2)
                else:
                    out.append(0)
            return out
      after: |
        def after(values):
            out = []
            for value in values:
                kind = type(value)
                if kind is str:
                    out.append(len(value))
                elif kind is list or kind is tuple:
                    out.append(len(value) * 2)
                else:
                    out.append(0)
            return out
      note: |
        Genuinely mixed input, where the check is the
        algorithm.

        The card's first `NOT a smell when` clause, measured. Neither repair is
        available: the branches do different things and the elements do not share an
        interface, so the only edit left is swapping `isinstance` for `type(x) is`,
        which changes behaviour for subclasses. The expected reading is a small loss or
        nothing, and either says the same thing.

        Measured in `validation/taxonomy/C4S5_heterogeneous_input.py`.
  patch_shape: structural
  measurability: scales_with_input
  min_workload_hint: |
    the loop must be long; the effect is per element and each check is worth tens of nanoseconds
  notes: |
    Related and measured: the project's own sample set compared `type(x) == AB` against `isinstance(x, AB)` over a million elements, and `isinstance` came out **5.4% slower** because it walks the MRO where the equality test is a pointer compare.  The style preference for `isinstance` is about *semantics* -- it accepts subclasses -- and it is not an energy improvement.  Do not report a change from `type(x) ==` to `isinstance` as a saving.
  similar:
  - C3.S2
  - C4.S2
  - C10.S2
- id: C4.S6
  signals:
  - try_except_in_loop
  in_one_line: |
    an exception used as ordinary control flow, on a path where it is raised often
  what_to_look_for: |
    Entering a `try` costs nothing measurable in modern CPython, because the handler is recorded in a table rather than pushed at run time.  Raising is what costs: instantiating the exception, capturing a traceback frame by frame, unwinding, and matching the handler.  So the price is the raise rate times the cost of a raise, which makes `try`/`except` idiomatic and fast when the exception is rare and waste only when it is the common case.  The smell is therefore not the syntax -- it is a property of the *data*, so a finding here needs a defensible statement of how often the exception actually fires, and a case file that never raises is measuring the wrong thing rather than refuting the claim.  Check the `try` is inside the loop rather than around it, and that the replacement check is both cheaper and exact: `except (KeyError, ValueError)` covers two failures where `.get()` covers one, and a repair that silently changes which failures are tolerated is not behaviour-preserving.  Some raises have no cheap pre-check at all -- a file that can vanish between the test and the open, an `int()` on arbitrary text -- and those stay as they are.
  not_a_smell_when:
  - |
    the exception is genuinely rare, where EAFP is both idiomatic and faster than testing first
  - |
    the check needed to avoid the raise costs as much as the raise, or opens a race between the check and the use
  - |
    the `try` wraps the whole loop rather than sitting inside it
  - |
    the handler catches something no pre-check can predict, such as an I/O failure or a decoding error
  counter_examples:
  - code: |
      for path in paths:
          try:
              data = load(path)
          except FileNotFoundError:
              continue
          process(data)
    why: |
      Checking `os.path.exists(path)` first does not remove the exception -- the file can vanish between the check and the open -- so the `try` stays regardless, and the check adds a second filesystem call per path. The raise rate would have to be very high before this loses.
  - code: |
      for row in rows:
          try:
              total += int(row["amount"])
          except (KeyError, ValueError):
              skipped += 1
    why: |
      Two failure modes, and one of them -- `int()` on a non-numeric string -- has no cheap pre-check. Replacing this with `.get()` handles the missing key and silently changes what happens to a malformed value. Whether it is a smell still depends on the raise rate; whether the obvious repair is *correct* does not.
  refactoring:
    summary: replace the frequently-raised exception with an explicit check
    examples:
    - title: a lookup that usually misses
      before: |
        def before(keys, table):
            out = []
            for k in keys:
                try:
                    out.append(table[k])
                except KeyError:
                    out.append(0)
            return out
      after: |
        def after(keys, table):
            out = []
            for k in keys:
                if k in table:
                    out.append(table[k])
                else:
                    out.append(0)
            return out
      note: |
        A repair only when the keys usually miss. Drive it with data that actually raises -- with keys that are always present the original is the faster of the two and the candidate is correctly refuted.

        Measured in `validation/taxonomy/C4S6_exception_control_flow.py`.
    - title: the raise comes from a converter called per element
      before: |
        def before(values):
            out = []
            for value in values:
                try:
                    out.append(int(value))
                except ValueError:
                    out.append(0)
            return out
      after: |
        def _int_or_zero(value):
            text = value.strip()
            if text[:1] in "+-":
                text = text[1:]
            if "_" in text:
                # `int` allows underscores between digits: "1_0" is 10, "_1" and "1__0"
                # are errors. Splitting reproduces that rule exactly.
                if not all(part.isdecimal() for part in text.split("_")):
                    return 0
            elif not text.isdecimal():
                # `isdecimal` rather than `isdigit`: "²".isdigit() is True and int("²")
                # raises, so `isdigit` would change behaviour on it.
                return 0
            return int(value)


        def after(values):
            return [_int_or_zero(value) for value in values]
      note: |
        The pre-check has to be exact or this is not behaviour-preserving: `isdigit` rejects whitespace, underscores and a leading `+` where `int()` accepts some of them. Getting that boundary right is most of the work, and it is why this repair is often not worth making even when the raise rate is high.

        Measured in `validation/taxonomy/C4S6_exact_precheck.py`.
    - title: the pre-check that duplicates the callee's own work
      before: |
        def before(registry, keys):
            out = []
            for key in keys:
                try:
                    out.append(registry.load(key))
                except KeyError:
                    out.append(None)
            return out
      after: |
        def after(registry, keys):
            out = []
            for key in keys:
                if key in registry._data:
                    try:
                        out.append(registry.load(key))
                    except KeyError:
                        out.append(None)
                else:
                    out.append(None)
            return out
      note: |
        A raise with no cheap pre-check.

        The card's first `NOT a smell when` clause. Checking membership first does not
        remove the exception -- the key can be absent for a second reason the check
        cannot see -- so the `try` stays and the check is pure extra cost. Expected to
        read as a loss whatever the raise rate, which is what makes it the useful
        adversarial case for this root cause.

        Measured in `validation/taxonomy/C4S6_no_cheap_precheck.py`.
  patch_shape: statement_local
  measurability: scales_with_input
  min_workload_hint: |
    drive it with inputs that actually raise, at a rate you can defend as representative; with no raises the repair shows nothing and the claim is correctly rejected
  notes: |
    The smell is not `try`/`except` -- it is `try`/`except` where the exception is the common case.  Whether that holds is a property of the *data*, so this root cause cannot be confirmed without a driver whose inputs raise at a realistic rate.  A case file that never raises is measuring the wrong thing rather than refuting the claim.
  similar:
  - C4.S1
  - C4.S7
- id: C4.S7
  in_one_line: |
    a missing cheap test that would let a common trivial input skip the expensive path
  what_to_look_for: |
    A guard is worth the cost of the path it skips times how often the degenerate input arrives, minus the test charged to every other call.  So look for a class of input that reaches the full machinery without needing it -- empty, one element, already sorted, already normalised, a value the arithmetic makes irrelevant -- and then say how often it actually arrives. A guard is a bet on the input distribution, and a distribution you cannot describe is a candidate you cannot defend.  Most candidates die on the other half of the ledger: the general path may already short-circuit.  `sorted()` on an empty list is close to free, `re.compile` on a fixed string is cached, and many library functions make the same test internally, so a guard in front of one buys nothing.  The guard also has to be cheap -- one that scans the collection to decide whether to scan the collection has saved nothing -- and it has to return exactly what the general path would have, including the type, the identity of the container, and what it raises.  The strongest form of this root cause comes from an algebraic fact rather than a size check, and that form needs a reader rather than a rule.
  not_a_smell_when:
  - |
    the degenerate case is rare, so the guard costs more across all calls than it saves on the few
  - |
    the general algorithm already short-circuits internally, so the guard duplicates a check that has already been made
  - |
    the guard would have to do as much work as the path it skips in order to decide
  - |
    the fast path returns something subtly different -- another type, a shared rather than a fresh container, a different error
  counter_examples:
  - code: |
      def median(values):
          ordered = sorted(values)
          return ordered[len(ordered) // 2]
    why: |
      The obvious guard is `if len(values) < 2: return ...`. But `sorted()` on a zero- or one-element list is already close to free, so the guard adds a test to every call to save almost nothing -- and it has to invent an answer for the empty case, which the original raises on. The pattern matches and the repair is not worth making.
  - code: |
      def dedupe(items):
          if not items:
              return []
          return list(dict.fromkeys(items))
    why: |
      The guard is already there. Reporting this as a missing guard is the commonest way to get this root cause wrong: read the function's opening lines before claiming one is absent.
  refactoring:
    summary: add a cheap guard that skips the expensive path for the trivial case
    examples:
    - title: an algebraic fact makes the whole scan unnecessary
      before: |
        def before(values, k):
            return len([1 for x in values if abs(x) + k > 0])
      after: |
        def after(values, k):
            if k > 0:
                return len(values)
            return len([1 for x in values if abs(x) + k > 0])
      note: |
        `abs(x)` is never negative, so with `k > 0` the per-element test cannot reject anything and the answer is `len(values)`. One comparison replaces a full pass plus an `abs` per element. The guard is a fact about the arithmetic, which is why it needs a reader rather than a rule, and why it is the strongest form of this root cause.

        Measured in `validation/taxonomy/C4S2_guard_skips_scan.py`.
    - title: a cheap property rules out the expensive check
      before: |
        def _is_prime(n):
            if n < 2:
                return False
            d = 2
            while d * d <= n:
                if n % d == 0:
                    return False
                d += 1
            return True


        def before(values):
            return [n for n in values if _is_prime(n)]
      after: |
        def _is_prime(n):
            if n < 2:
                return False
            d = 2
            while d * d <= n:
                if n % d == 0:
                    return False
                d += 1
            return True


        def after(values):
            return [n for n in values if n == 2 or (n % 2 == 1 and _is_prime(n))]
      note: |
        `is_prime` trial-divides up to n; parity settles half the inputs in one modulo. The guard has to name the exception -- 2 is both even and prime -- and getting that wrong is the failure mode. Note that the better repair may be to fix `is_prime` itself, which is C7.S1; prefer that when you own the callee.

        Measured in `validation/taxonomy/C4S7_algebraic_guard.py`.
    - title: the fast path is in the callee and only needs asking for
      before: |
        def before(batches):
            return [sorted(b) for b in batches]
      after: |
        def after(batches):
            out = []
            for b in batches:
                if len(b) < 2:
                    out.append(list(b))
                else:
                    out.append(sorted(b))
            return out
      note: |
        Worth it only if already-minimal output is common, and only after checking that `minify` does not make the same test first. Both are things you have to go and read, and if you cannot establish them the honest answer is to reject the candidate.

        Measured in `validation/taxonomy/C4S7_guard_before_short_circuit.py`.
    - title: the trivial input that skips everything
      before: |
        def before(xs, ys):
            result = []
            for x in xs:
                for y in ys:
                    result.append(x * y)
            return result
      after: |
        def after(xs, ys):
            if not xs or not ys:
                return []
            result = []
            for x in xs:
                for y in ys:
                    result.append(x * y)
            return result
      note: |
        No early return for the trivial input.

        Measured in `validation/taxonomy/C4S7_edge_case_guard.py`.
  patch_shape: statement_local
  measurability: scales_with_calls
  min_workload_hint: |
    the driver must supply the degenerate inputs at a rate you can defend, and the normal inputs too, so that the test the guard adds to every call is charged against the saving
  similar:
  - C1.S6
  - C4.S1
  - C4.S6
- id: C4.S8
  signals:
  - ruff_SIM401
  - ruff_SIM118
  in_one_line: |
    a condition spelled the long way round, missing the interpreter's fast path
  what_to_look_for: |
    CPython's compiler and its built-in types have fast paths for the idiomatic spellings and the verbose equivalents miss them.  `if not x` asks the object for its truth value directly where `if len(x) == 0` calls `len`, builds an int and compares two objects.  `key in mapping` probes the hash table where `key in mapping.keys()` first builds a view.  `a < b < c` evaluates `b` once where `a < b and b < c` evaluates it twice.  Each difference is a handful of bytecodes, so this is a finding only inside something very hot and is honestly advisory almost everywhere else.  The whole difficulty is equivalence *for this data*: `len(x) == 0` and `not x` differ for an object with a custom `__bool__` or `__len__`, and on a numpy array or a pandas frame the idiom raises rather than answering.  The explicit form is also sometimes deliberately exact -- float equality occasionally is precisely what was meant -- so establish the type before rewriting the test.
  not_a_smell_when:
  - |
    the explicit form distinguishes cases the idiom conflates, which is the usual situation for anything with a custom `__bool__` or `__len__`
  - |
    the comparison is deliberately exact, as float equality sometimes is
  - |
    the operand may be a numpy array or a pandas object, where the truthiness idiom raises rather than answering
  - |
    it runs once on a cold path, where the whole saving is a few bytecodes
  counter_examples:
  - code: |
      if len(frame) == 0:
          return empty_result()
    why: |
      If `frame` is a pandas DataFrame, `if not frame` raises `ValueError` -- the idiom is not available and the explicit form is the correct way to write this. The same applies to a numpy array with more than one element. You have to know the type before applying this repair.
  - code: |
      if value == 0.0:
          return "exact zero"
    why: |
      Exact float comparison, deliberately. `math.isclose` would report `1e-300` as zero. The idiom is not always the intent.
  refactoring:
    summary: use the idiomatic form
    examples:
    - title: a membership test followed by a second lookup
      before: |
        def before(mapping, keys):
            out = []
            for key in keys:
                if key in mapping.keys():
                    out.append(mapping[key])
                else:
                    out.append(None)
            return out
      after: |
        def after(mapping, keys):
            return [mapping.get(key) for key in keys]
      note: |
        `key in mapping.keys()` then a second
        lookup.

        Two changes the card separates: `key in mapping` skips building a view object,
        and `.get()` replaces a membership test followed by a second hash of the same
        key. The card says the third is the only one worth much, and this measures
        both together because that is how the code is actually written.

        Measured in `validation/taxonomy/C4S8_membership_and_get.py`.
    - title: a chained comparison, and the branches it makes redundant
      before: |
        def _position(row):
            return (row * 7919) % 1000


        def before(rows, low, high):
            hits = 0
            for row in rows:
                if low <= _position(row) and _position(row) <= high:
                    hits += 1
            return hits
      after: |
        def _position(row):
            return (row * 7919) % 1000


        def after(rows, low, high):
            hits = 0
            for row in rows:
                if low <= _position(row) <= high:
                    hits += 1
            return hits
      note: |
        The chained form evaluates `x` once instead of twice, and -- more importantly here -- the whole four-branch structure collapses, because the first test and the `elif` are both implied by the range comparison. That part is C4.S2, and the two together are one repair: report whichever describes the edit better and list the other as subsumed.

        Measured in `validation/taxonomy/C4S8_chained_comparison.py`.
    - title: a view built only to be searched
      before: |
        def before(keys, table):
            return sum(1 for k in keys if k in table.keys())
      after: |
        def after(keys, table):
            return sum(1 for k in keys if k in table)
      note: |
        `in dict.keys()` instead of `in dict`.

        Measured in `validation/taxonomy/C4S8_non_idiomatic.py`.
    - title: a length compared to zero where truthiness would do
      before: |
        def before(batches):
            empty = 0
            for batch in batches:
                if len(batch) == 0:
                    empty += 1
            return empty
      after: |
        def after(batches):
            empty = 0
            for batch in batches:
                if not batch:
                    empty += 1
            return empty
      note: |
        `len(x) == 0` where truthiness would do.

        The taxonomy's own first example for this root cause, which had no
        implementation: `if len(my_list) == 0` against `if not my_list`.

        `len()` is a global lookup, a call, and an integer comparison; the truth test
        asks the object for its boolean directly and a list answers from its own size
        field. The measured file for this root cause compares `in d.keys()` against
        `in d`, which is a different mechanism -- building a view object rather than
        resolving a builtin.

        `mixed` is the case the repair is for. `always-empty` is here because the two
        forms disagree about nothing and the saving is the same either way, which is
        what makes this a pure idiom finding rather than a data-dependent one.

        Measured in `validation/taxonomy/C4S8_len_versus_truthiness.py`.
  patch_shape: expression
  measurability: scales_with_input
  min_workload_hint: |
    needs a very hot path; each instance is worth a few bytecodes, so only a case that calls the unit millions of times over trivial input will show it
  notes: |
    Most instances of this root cause are honestly advisory.  Report them, and do not manufacture a case file that measures a difference nobody will ever observe -- a claim measured badly is worse than a claim reported as unmeasured.
  similar:
  - C4.S1
  - C10.S2
