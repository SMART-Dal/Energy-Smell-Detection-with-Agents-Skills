- id: C1.S5
  signals:
    - discarded_pure_result
  in_one_line: |
    a computation run in full whose result nothing downstream actually needs
  look_for: |
    A computation that runs in full while nothing downstream needs its result. The plain form is a pure call used as a statement, such as `sorted(rows)` or `", ".join(parts)`, whose value is dropped. The larger forms leave no trace on any one line: a stage the next stage is invariant under, like a softmax before an argmax or a sort before a sum, and a loop that overwrites a variable on every pass when only the last pass is read. Find them by asking what the answer actually depends on.
  refactoring:
    summary: delete the computation whose result nothing consumes
  repairs:
    - case: C1S5_invariant_stage
      note: |
        Softmax is strictly monotonic, so it preserves the position of the maximum, and the function returns only that position. The starting value must be `-inf`, because logits can be negative where probabilities cannot.
    - case: C1S5_last_iteration_only
      note: |
        Only valid because `_score` is pure: if it recorded anything, every call mattered. The empty case is handled explicitly, because the original raises `UnboundLocalError`.
    - case: C1S5_resultless
  not_this:
    - source: lookalike:C1S5_lookalike
      why: |
        `Scorer.score` keeps a rolling checksum, so the last call's result depends on every call before it, and calling it once on the last candidate returns a different number. Whether only the last iteration matters depends on the callee being pure, which means reading the callee rather than the loop.
    - title: a call kept for the exception it raises
      source: rule:discarded_pure_result/validate
      code: |
        def validate(record, schema):
            schema.validate(record)
            return record
      tempting: |
        def validate(record, schema):
            return record
      why: |
        The call is there to raise on a malformed record; deleting it passes invalid records through instead of raising.
    - title: an in-place method whose `None` is dropped
      source: rule:discarded_pure_result/order_in_place
      code: |
        def order_in_place(rows):
            rows.sort(key=lambda r: r.score)
            return rows
      tempting: |
        def order_in_place(rows):
            return rows
      why: |
        `list.sort` reorders the list in place and returns `None`; the dropped `None` is not the result, the reordering is, and deleting the call returns the rows unsorted.
    - title: a `join` that waits for a thread
      source: rule:discarded_pure_result/wait_for
      code: |
        def wait_for(worker):
            worker.start()
            worker.join()
      tempting: |
        def wait_for(worker):
            worker.start()
      why: |
        `Thread.join` shares its name with `str.join` but blocks until the thread finishes; deleting it returns while the worker is still running.
  similar:
    - C1.S1
    - C1.S6
    - C1.S8
    - C3.S6
- id: C1.S6
  signals:
    - dead_initialization
  in_one_line: |
    setup done unconditionally that only one path actually needs
  look_for: |
    Setup paid on every execution for a result that only some paths use. It runs before the check that decides whether it is wanted -- defaults loaded before a cache lookup that usually hits, a buffer sized to the input for a flag that is rarely set, a fallback rebuilt on each pass of a loop -- or it builds an initial value that the next assignment replaces unread. Moving the setup into the branch that uses it means paying for it only when that branch runs.
  refactoring:
    summary: move the setup inside the branch that needs it
  repairs:
    - case: C1S6_setup_before_cache_check
      note: |
        On a warm cache the setup ran on every call and was thrown away. The saving is set by the cache hit rate: on a cold cache this repair is worth nothing.
    - case: C1S6_buffer_for_rare_branch
      note: |
        An N-element list allocated on every call for a flag that is almost never set, where the conditional allocation costs one comparison. The return simplifies too, because `trace` is already `None`, which is the tell that the original was carrying the condition twice.
    - case: C1S6_unnecessary_init
  not_this:
    - title: a first value that comes from `open`
      source: rule:dead_initialization/impure_first_value
      code: |
        def impure_first_value(path):
            handle = open(path)
            handle = None
            return handle
      tempting: |
        def impure_first_value(path):
            handle = None
            return handle
      why: |
        `open(path)` raises when the path is missing or unreadable; without the first assignment the function returns `None` for any path, including one that does not exist.
  similar:
    - C1.S5
    - C4.S7
    - C6.S5
- id: C1.S7
  signals:
    - single_use_temporary
  in_one_line: |
    a name bound, read exactly once, and never needed again
  look_for: |
    A name bound to a value and read exactly once, usually on the next line: `result = template.format(**row)` followed by `return result`, or a temporary assigned inside a loop only to be added to an accumulator. Each binding is a store and a reference-count adjustment, and the read is a load; inlining the expression at its one use removes them. Inside a loop, a single-use temporary is often the symptom of a larger repair, such as an `append` loop that wants to be a comprehension.
  refactoring:
    summary: inline the single-use temporary
  repairs:
    - case: C1S7_single_use_temp
    - case: C1S7_return_through_name
  not_this:
    - title: a value captured before the line that changes it
      source: known
      code: |
        def replace_state(self, new):
            previous = self.state
            self.state = new
            return previous
      tempting: |
        def replace_state(self, new):
            self.state = new
            return self.state
      why: |
        Python evaluates the right-hand side when the name is bound, so `previous` holds the old state; inlining moves the read after the assignment, and the function returns the new state instead.
  similar:
    - C1.S1
    - C1.S2
- id: C1.S8
  signals:
    - runtime_management_in_loop
  in_one_line: |
    runtime housekeeping invoked far more often than anything needs it
  look_for: |
    Work that manages the runtime rather than computing the answer, run once per iteration where once or never would do. `gc.collect()` inside a loop, or inside a comprehension, walks every tracked object in the process on each pass, while CPython's collector already runs on allocation thresholds. Logging has the quieter form: a log call's arguments are evaluated before the logger checks the level, so an f-string or a `json.dumps` passed to `debug()` is built in full and thrown away when debug output is off.
  refactoring:
    summary: remove the housekeeping call, or defer the work until it is known to be needed
  repairs:
    - case: C1S8_collect_with_live_heap
      note: |
        Each `gc.collect()` walks every tracked object, so the loop costs iterations times heap size. If the loop needs bounded memory, release the batch's references rather than forcing a full collection per pass.
    - case: C1S8_log_argument
      note: |
        With DEBUG off, every record is serialised and the string thrown away. The guard makes that conditional on the level, and the `%s` form defers the formatting as well.
    - case: C1S8_runtime_management
    - case: C1S8_guard_with_nothing_to_guard
      note: |
        The arguments are a literal and an integer that already exists, so there is nothing for the guard to defer; with the level on, the check is done twice.
  not_this:
    - title: a collection just before the heap is frozen for a fork
      source: rule:runtime_management_in_loop/before_fork
      code: |
        def before_fork(command):
            gc.collect()
            gc.freeze()
            return spawn(command)
      tempting: |
        def before_fork(command):
            gc.freeze()
            return spawn(command)
      why: |
        `gc.freeze()` moves every object the collector tracks into a permanent generation that later collections ignore, so the collection just before it is what keeps unreachable cycles from being frozen in with the live heap.
  similar:
    - C1.S5
    - C3.S3
