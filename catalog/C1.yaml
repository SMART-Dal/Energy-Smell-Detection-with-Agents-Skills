    - C1.S3
    - C1.S5
    - C1.S7
- id: C1.S2
  signals:
    - ruff_PLW2901
  in_one_line: |
    a store that leaves the program's state exactly as it already was
  look_for: |
    A store that leaves the program's state as it already was: a name assigned its own value, a value overwritten before anything reads it, or a loop variable rebound to a conversion that cannot change it, such as `int()` on a value that is already an `int` or `.strip()` on text that is already stripped. A bare store costs a few instructions each time it runs; an idempotent call costs more, because the call still runs on every element.
  refactoring:
    summary: delete the assignment that leaves state unchanged
  repairs:
    - case: C1S2_redundant_assignment
    - case: C1S2_idempotent_conversion
      note: |
        `int()` on a value that is already an `int` returns the same object, so the call is a global lookup and a type check per element, which scales with input where the bare store does not.
    - case: C1S2_redundant_strip
  not_this:
    - source: lookalike:C1S2_lookalike
      why: |
        Almost every element is already an `int`, but the strings among them are converted only by this `int()`; deleting it makes `total += value` raise on a string, and passes every test built from all-numeric input. The question is whether any element is not already an `int`.
    - title: an assignment that runs a property setter
      source: catalog
      code: |
        class Panel:
            @property
            def size(self):
                return self._size

            @size.setter
            def size(self, value):
                self._size = value
                self._relayout()

            def refresh(self):
                self.size = self.size
      tempting: |
        class Panel:
            # property and setter unchanged

            def refresh(self):
                pass
      why: |
        Assigning to a property runs its setter, so `self.size = self.size` is the call to `_relayout`; deleting it leaves `refresh` doing nothing.
  similar:
