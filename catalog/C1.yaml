- id: C1.S4
  signals:
    - repeated_pure_call
  in_one_line: |
    the same value computed twice in one scope, where one local would serve both
  look_for: |
    The same value computed more than once in one scope while nothing it depends on changes: a pure call repeated with the same arguments, an attribute chain re-derived on a second line, or a derivation evaluated in a test and again in the body the test guards. Each repeat pays for the whole expression again; the repair evaluates it once and reads a local. Count the evaluations that run on one path rather than the occurrences in the text, and note that separate `if` statements can all run.
  refactoring:
    summary: compute the value once, bind it, and read the binding
  repairs:
    - case: C1S4_expensive_call_twice
      note: |
        Two parses become one, so the saving is the whole of the second `_parse_manifest` call, provided the parse is pure.
    - case: C1S4_operand_chain
    - case: C1S4_repeated_computation
  not_this:
    - source: lookalike:C1S4_lookalike
      why: |
        `pending.append` runs between the two `len(pending)` reads, so binding the first read freezes a length the loop then changes, and every later `budget` is computed from a stale number. The repair needs nothing between the two evaluations to touch the receiver or the arguments.
    - title: a call that consumes what it returns
      source: rule:repeated_pure_call/poll_twice
      code: |
        def poll_twice(queue):
            return queue.get(), queue.get(), queue.get()
      tempting: |
        def poll_twice(queue):
            item = queue.get()
            return item, item, item
      why: |
        `Queue.get` removes the item it returns, so the three calls return three different items; one call returns the first item three times and leaves two in the queue.
  similar:
