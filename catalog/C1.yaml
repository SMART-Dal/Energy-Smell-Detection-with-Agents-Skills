- id: C1.S1
  signals:
    - ruff_F841
  in_one_line: |
    a value computed and bound to a name that nothing ever reads
  look_for: |
    A name bound to a value that nothing ever reads. The binding itself is one store; the waste is everything on its right-hand side, which still runs in full: a sort of the input, a scratch value rebuilt on every iteration, or a whole loop that fills a list the function never returns. Look past the unread name to what was computed for it, and delete the computation along with the binding.
  refactoring:
    summary: delete the computation whose result nothing reads
  repairs:
    - case: C1S1_dead_expensive_result
      note: |
        The binding is a bytecode. This is the form worth reporting, and the reason to size the right-hand side before deciding anything.
    - case: C1S1_dead_loop
      note: |
        A full pass, a list of N objects and N appends, for a value the function already had. Check first that `checksums` is not read through a closure or returned by a wrapper.
    - case: C1S1_dead_code
  not_this:
    - source: lookalike:C1S1_lookalike
      why: |
        `record.pop(0)` returns the header and removes it, so the binding is dead and the call is not; deleting the statement leaves the header in the record and every sum is wrong. Before deleting, ask whether the discarded expression does anything besides produce a value.
    - title: a name read through `locals()`
      source: catalog
      code: |
        def greet(user):
            name = user.display_name
            return "Hello, {name}".format(**locals())
      tempting: |
        def greet(user):
            return "Hello, {name}".format(**locals())
      why: |
        `locals()` hands every local to `format`, so the template reads `name`; without the binding, `format` raises `KeyError`.
  similar:
