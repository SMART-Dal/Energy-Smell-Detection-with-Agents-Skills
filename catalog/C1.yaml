- id: C1.S3
  signals:
    - redundant_bool_branch
  in_one_line: |
    a branch whose outcome is the same whichever way it goes
  look_for: |
    A branch that cannot change what the program does, yet still evaluates its condition and jumps: an `if` whose body is empty, arms that compute the same answer, a `match` whose cases behave identically, a `try` whose body cannot raise what it catches, or a branch that only rebuilds its condition's truth value, such as `if c: return True else: return False` or `True if c else False`. That last form collapses to the condition, wrapped in `bool()` when the condition is not already a bool.
  refactoring:
    summary: delete the control flow that cannot change the outcome
  repairs:
    - case: C1S3_identical_arms
    - case: C1S3_empty_guard
      note: |
        An attribute read and a jump per element. Check the version history first, because an empty arm under a flag is often a removal that lost its comment rather than something nobody meant.
    - case: C1S3_bool_branch
  not_this:
    - source: lookalike:C1S3_lookalike
      why: |
        The condition is the list `dict.get` returns, not a bool, so the branch is normalising it and `return condition` hands the caller the list instead. Collapse the branch only when the condition is already a bool; otherwise write `return bool(condition)`.
    - title: a fall-through path that does more than return False
      source: rule:redundant_bool_branch/guard
      code: |
        def guard(value, limit):
            if value > limit:
                return True
            log(value)
            return False
      tempting: |
        def guard(value, limit):
            return value > limit
      why: |
        The `False` path calls `log(value)` before it returns; collapsing the branch to the comparison drops that call.
    - title: a handler that catches a subclass the callee raises
      source: catalog
      code: |
        try:
            return json.loads(text)
        except ValueError:
            return None
      tempting: |
        return json.loads(text)
      why: |
        `json.loads` raises `json.JSONDecodeError`, which is a subclass of `ValueError`, so the handler is reachable; without it, malformed input raises instead of returning `None`.
