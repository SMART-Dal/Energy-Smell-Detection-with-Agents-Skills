- id: C2.S1
  signals:
    - trivial_delegation
  in_one_line: |
    a wrapper or property that forwards, adds nothing, and sits on a hot path
  look_for: |
    A wrapper that only forwards: a method or function whose whole body calls one other callable with the arguments it received, unchanged -- one argument, none, or `*args, **kwargs` -- or a `@property` whose body is `return self._x`. Each access pays a call frame, and a property also runs the descriptor protocol, to do what a direct call or attribute read does. The repair calls the target or reads the attribute directly at the hot call sites, or deletes a private wrapper that nothing outside the class can reach.
  refactoring:
    summary: call the target directly at the hot call sites, or read the attribute directly
  repairs:
    - case: C2S1_private_accessors
      note: |
        The accessor is name-mangled and private, so nothing outside the class can be calling it, which is what makes deleting it safe.
    - case: C2S1_property_per_element
      note: |
        The property stays, because callers outside this module use it; only the hot comprehension reads the attribute directly. That is deliberately the smaller repair: it changes one call site rather than the class's surface.
    - case: C2S1_method_delegation
  not_this:
    - source: lookalike:C2S1_lookalike
      why: |
        `size` computes and stores its value on first access, so reading `_size` directly gets `None` until something has read `size`; the bypass removes the only code that fills the field. A property may be bypassed only when its body is `return self._x`.
    - title: a wrapper that translates the failure
      source: rule:trivial_delegation/read
      code: |
        class Store:
            def read(self, key):
                try:
                    return self._backend.fetch(key)
                except KeyError:
                    return None
      tempting: |
        value = store._backend.fetch(key)       # was store.read(key)
      why: |
        `read` turns a missing key into `None`; the direct call raises `KeyError` where the wrapper returned `None`.
    - title: a forwarding method that is the public interface
      source: catalog
      code: |
        class Session:
            def get(self, url, **kwargs):
                return self.request("GET", url, **kwargs)
      tempting: |
        class Session:
            ...                                  # `get` deleted


        response = session.request("GET", url)   # was session.get(url)
      why: |
        Callers outside the library use `get` rather than `request("GET", ...)`, and deleting it breaks every one of them. Only a bypass at a hot call site inside the library leaves them working.
  similar:
    - C2.S2
    - C2.S3
- id: C2.S2
  signals:
    - method_ignores_self
  in_one_line: |
    a method that never touches `self` and still pays to be bound to an instance
  look_for: |
    A method whose body never mentions `self`, including inside nested functions and comprehensions, so it depends on no instance state. Reaching it through an instance still binds `self` to a function that never uses it. The repair declares it `@staticmethod`, or moves it to module scope, which also skips the class namespace lookup. A private helper that formats or cleans up its argument is the clearest case.
  refactoring:
    summary: declare the method `@staticmethod`, or move it to module scope
  repairs:
    - case: C2S2_static_method
      note: |
        It has no subclasses, which is what makes it safe.
    - case: C2S2_module_function
      note: |
        This removes the class namespace lookup as well as the binding, and every call site inside the class loses its `self.`.
    - case: C2S2_declaration_only
      note: |
        Both variants are called the same way, through `self.`, so the only difference is the decorator.
  not_this:
    - source: lookalike:C2S2_lookalike
      why: |
        `Base.fee` ignores `self`, but `Premium` overrides it, so the call site rewritten to `Base.fee(...)` skips the override and charges every premium account the base rate. Look for overrides before declaring a method static.
    - title: a method that calls zero-argument `super()`
      source: rule:method_ignores_self/Saver
      code: |
        class Saver:
            def save(self):
                return super().save()
      tempting: |
        class Saver:
            @staticmethod
            def save():
                return super().save()
      why: |
        Zero-argument `super()` takes the instance from the method's first argument, so the static `save` raises `RuntimeError: super(): no arguments` when called.
  similar:
    - C2.S1
    - C2.S3
- id: C2.S3
  signals:
    - self_delegation_chain
  in_one_line: |
    a chain of thin layers whose frames cost more than the work at the bottom
  look_for: |
    A chain of thin layers between a hot loop and the work it reaches: methods whose whole body is one call to another method on `self`, sometimes passing an argument through, stacked so that every iteration pays one frame per layer. Each layer looks reasonable on its own, so the chain shows only when the path is traced from the loop down to the work and the frames are counted. The repair merges the layers on that path, or keeps every layer and bypasses them on the bulk path.
  refactoring:
    summary: |
      merge the thin layers on the hot path into one function, keeping the layers for any other caller
  repairs:
    - case: C2S3_modularization
      note: |
        Three frames per call become one. `_fetch` and `_get` are private and called from nowhere else, which is what makes deletion available; if either were public, the repair would inline the body into `label` and leave them in place.
    - case: C2S3_bypass_on_bulk_path
      note: |
        Every method survives, so nothing that calls them breaks; only the bulk path skips them. Three frames per key become none.
    - case: C2S3_heavy_bottom
  not_this:
    - title: a template method whose hook a subclass overrides
      source: rule:self_delegation_chain/BaseProcessor
      code: |
        class BaseProcessor:
            def process(self, data):
                return self._do_process(data)

            def _do_process(self, data):
                raise NotImplementedError


        class BatchProcessor(BaseProcessor):
            def _do_process(self, data):
                return [x for x in data]
      tempting: |
        class BaseProcessor:
            def process(self, data):
                raise NotImplementedError


        class BatchProcessor(BaseProcessor):
            def _do_process(self, data):
                return [x for x in data]
      why: |
        `_do_process` is the hook `BatchProcessor` overrides; with the base hook inlined into `process`, `BatchProcessor().process(data)` raises `NotImplementedError` instead of returning the list.
  similar:
    - C2.S1
    - C2.S2
    - C7.S3
