- id: C10.S1
  signals:
    - manual_builtin_loop
    - ruff_SIM110
    - ruff_PLR1730
  in_one_line: |
    a hand-written loop doing bulk work a C-level primitive already does
  look_for: |
    A Python loop that does, element by element, what a C-implemented built-in does in one call: a running total, a running minimum or maximum, a tally of occurrences, a best element tracked by hand, a substring search that slices the text at every position. The interpreter pays dispatch and reference counting on every element; the built-in makes the same traversal in C. The built-in has to stop where the loop would: a loop that returns at the first mismatch can finish before a primitive that materialises everything.
  refactoring:
    summary: replace the hand-written loop with the primitive that already does it
  repairs:
    - case: C10S1_manual_extremes
      note: |
        Two C traversals beat one interpreted traversal: the interpreted one pays dispatch and reference counting per element, and the built-ins pay neither. The loop uses two independent `if`s; with `elif` a new minimum could not also update the maximum, and the two forms would disagree.
    - case: C10S1_manual_sum
    - case: C10S1_counter
      note: |
        Every element is wanted, so `Counter` does not do extra work.
    - case: C10S1_substring_scan
      note: |
        The repair keeps a Python loop: what mattered was moving the per-element work into C, not eliminating the loop.
    - case: C10S1_two_argument_builtin
      note: |
        Here the loop stays, and `max(best, running)` replaces one comparison and a conditional store with a global lookup, an argument tuple, a call and a return per element. A built-in that consumes the iterable replaces the loop; one called inside it on two scalars only adds a call.
    - case: C10S1_builtin_counts_everything
    - case: C10S1_primitive_loses_early_exit
      note: |
        Here `before` is the primitive and `after` the loop: `''.join(a) == ''.join(b)` materialises both sequences, and the element-wise loop returns at the first mismatch.
  not_this:
    - title: a running total of strings
      source: rule:manual_builtin_loop/join_messages
      code: |
        def join_messages(messages):
            out = ""
            for msg in messages:
                out += msg
            return out
      tempting: |
        def join_messages(messages):
            return sum(messages, "")
      why: |
        `sum` refuses strings: `sum(messages, "")` raises `TypeError` and its message says to use `''.join(seq)` instead. What an accumulator is comes from where it starts, not from what is added to it.
    - title: two accumulations in one pass
      source: catalog
      code: |
        total = 0
        largest = float("-inf")
        for value in values:
            total += value
            if value > largest:
                largest = value
        return total, largest
      tempting: |
        return sum(values), max(values)
      why: |
        Two primitives make two passes where the loop made one. If `values` is a generator, `sum` consumes it and `max` then raises `ValueError` on an empty sequence.
  similar:
    - C3.S1
    - C10.S2
    - C10.S3
    - C10.S6
- id: C10.S2
  signals:
    - ruff_C417
    - ruff_SIM118
    - ruff_SIM401
  in_one_line: |
    one primitive used where a cheaper primitive computes the same answer
  look_for: |
    One built-in or construct used where another computes the same answer with less work: `re.match` on a pattern that is only a literal prefix, where `str.startswith` compares bytes; `map` with a lambda, which pays a Python call per element where a comprehension runs the expression inline; a comprehension calling a C built-in such as `float`, which `map(float, xs)` drives in C; `key in d.keys()` where `key in d` probes directly. Name both constructs and what the cheaper one stops doing, and confirm the two give the same answer on this data.
  refactoring:
    summary: use the cheaper construct that computes the same answer
  repairs:
    - case: C10S2_regex_versus_startswith
      note: |
        Even a precompiled pattern still enters the matcher and allocates a match object, where `startswith` compares bytes and returns a bool. Only valid because the pattern has no metacharacters beyond the anchor.
    - case: C10S2_map_builtin
      note: |
        `float` is a C built-in, so `map` drives the whole traversal in C with no per-element frame. Make the callable a lambda and the verdict reverses.
    - case: C10S2_map_lambda
      note: |
        This goes the other way from the `map(float, ...)` sample; the deciding factor is whether the mapped callable is a C built-in or a Python-level lambda.
    - case: C10S2_counter_versus_sorted
      note: |
        Here `before` is `sorted` and `after` is `Counter`. `Counter` is one pass against a sort, but it builds and hashes two dicts where two sorts are comparisons in C.
    - case: C10S2_default_always_evaluated
      note: |
        Python evaluates arguments before it enters `get`, so `_default_profile()` is built on every lookup, including the hits; the branch form built it only on a miss. `.get(k, 0)` and `.get(k, None)` are free, `.get(k, expensive())` is not, and `dict.setdefault` has the same problem.
  not_this:
    - title: '`isinstance`, where subclasses must match'
      source: catalog
      code: |
        for item in items:
            if isinstance(item, Widget):
                render(item)
      tempting: |
        for item in items:
            if type(item) == Widget:
                render(item)
      why: |
        `type(item) == Widget` is a pointer comparison and rejects the subclasses `isinstance` accepts, so instances of a `Widget` subclass stop being rendered.
    - title: parity on operands that may not be integers
      source: catalog
      code: |
        if n % 2:
            handle_odd(n)
      tempting: |
        if n & 1:
            handle_odd(n)
      why: |
        `&` is defined only for integers: if `n` can be a float, `n & 1` raises `TypeError`, and for a type with its own `__mod__` the mask does not apply at all. The swap needs integer operands.
  similar:
    - C4.S5
    - C4.S8
    - C7.S5
    - C10.S1
    - C10.S6
- id: C10.S3
  signals:
    - append_only_loop
    - ruff_PERF401
    - ruff_PERF402
  in_one_line: |
    a per-element call inside a loop that a single batched call would replace
  look_for: |
    A loop whose whole body moves one element into a container -- `out.append(f(x))`, an `append` behind one or more `if`s, `target.append(item)` copying one list into another -- or that indexes a sequence element by element where a slice would copy it, or walks a NumPy array in Python to compute what one vectorised call would. Every iteration resolves the method and makes a call, and for an array unboxes a C double into a Python float; `extend`, a comprehension, a slice or a NumPy operation does the same transfer in C.
  refactoring:
    summary: replace the per-element operation with the batched primitive
  repairs:
    - case: C10S3_append_to_extend
      note: |
        One attribute lookup and one call replace N of each, and the copy itself happens in C. Rebinding to `target + source` would also allocate once, but it stops mutating `target` -- check the call sites before choosing it.
    - case: C10S3_slice_instead_of_index
      note: |
        The slice computes the result size once and copies pointers in C. It returns the input's own type where the comprehension always returns a list, so for a tuple or a str input the result type changes.
    - case: C10S3_vectorised
      note: |
        Every subscript unboxes a C double into a Python float object, which is then added and discarded; the vectorised form stays in C. Its result is a NumPy scalar, hence the cast -- without it the return type changes.
    - case: C10S3_bulk_primitive
  not_this:
    - title: a body that also logs
      source: catalog
      code: |
        kept = []
        for row in rows:
            if not row.valid:
                log.warning("dropping %s", row.id)
                continue
            kept.append(row)
        return kept
      tempting: |
        return [row for row in rows if row.valid]
      why: |
        The loop body also logs every row it drops. The comprehension keeps the same rows and loses the warnings.
    - title: an early exit
      source: catalog
      code: |
        seen = []
        for line in stream:
            seen.append(parse(line))
            if len(seen) >= limit:
                break
        return seen
      tempting: |
        return [parse(line) for line in stream][:limit]
      why: |
        The loop stops reading at `limit`. The comprehension parses and consumes the whole stream before slicing, so a long stream is read to the end and an endless one never returns.
    - title: a list the caller passed in
      source: rule:append_only_loop/populate_queue
      code: |
        def populate_queue(shared_queue, new_items):
            for item in new_items:
                shared_queue.append(item.data)
      tempting: |
        def populate_queue(shared_queue, new_items):
            shared_queue = [item.data for item in new_items]
      why: |
        The comprehension builds a fresh local list and rebinds the parameter, so the caller's list, which the loop was filling, stays empty. `shared_queue.extend(...)` keeps filling it.
    - title: a filter that reads the list being built
      source: rule:append_only_loop/reads_the_list_it_builds
      code: |
        def reads_the_list_it_builds(xs):
            out = []
            for x in xs:
                if x not in out:
                    out.append(x)
            return out
      tempting: |
        def reads_the_list_it_builds(xs):
            out = []
            out = [x for x in xs if x not in out]
            return out
      why: |
        The loop's filter consults the list it is building. Inside the comprehension `out` is still the empty list, so every duplicate is kept.
  similar:
    - C3.S1
    - C9.S1
    - C10.S1
    - C10.S4
    - C11.S5
- id: C10.S4
  signals:
    - string_concat_in_loop
  in_one_line: |
    a string grown with `+=` in a loop, where the target is aliased or the parts are many
  look_for: |
    A string or bytes value grown once per iteration with `+=` or `s = s + part`: `self.buf += render_row(row)`, `grouped[key] += text`, `out += chunk` on a local. Each concatenation can allocate a new object and copy everything accumulated so far. CPython resizes a plain local in place when nothing else refers to it, but an attribute, a dict entry, a global, or a local the loop also reads holds a second reference and forces the full copy. The number of parts per accumulator decides how much there is to save.
  refactoring:
    summary: |
      collect the parts in a local list and join once, so the value that grows is never the aliased one
  repairs:
    - case: C10S4_aliased
      note: |
        The growing value becomes an unaliased local list, and the single aliased assignment happens once at the end. `join` computes the total length in one pass and allocates once.
    - case: C10S4_dict_entry_accumulator
      note: |
        A subscript target is aliased through the container, so the same copying happens per key. The dict is rebuilt rather than mutated, so check anything that relied on `out` being changed in place.
    - case: C10S4_plain_local
      note: |
        The shape the published taxonomy uses as its example. CPython resizes this string in place, since its reference count is one.
    - case: C10S4_three_parts
      note: |
        With three parts per string, a list, three appends and a `join` cost more than two `+=` on an unaliased local, whose quadratic term never starts. A fixed handful of pieces is an f-string at most.
  not_this:
    - title: the partial result is read inside the loop
      source: catalog
      code: |
        def render(self, rows):
            self.buf = ""
            for row in rows:
                self.buf += render_row(row)
                if len(self.buf) > self.limit:
                    self.flush()
      tempting: |
        def render(self, rows):
            parts = []
            for row in rows:
                parts.append(render_row(row))
                if len(self.buf) > self.limit:
                    self.flush()
            self.buf = "".join(parts)
      why: |
        The partial result is read on every pass to decide when to flush. After a deferred join `self.buf` stays empty inside the loop and the flush never fires; a repair has to keep a buffer of parts flushed on a running length.
  similar:
    - C6.S1
    - C10.S3
- id: C10.S5
  in_one_line: |
    a global or builtin re-resolved through the module namespace on every iteration
  look_for: |
    A module-level name whose value does not change during the loop -- a constant such as `MAX_RETRIES` or `SCALE`, a helper function such as `format_cell`, a builtin -- read inside a loop, a comprehension or a generator expression, often several times per iteration. A local read is an index into the frame's array of locals; a global read is a dictionary probe in the module namespace, with a second probe into builtins when that misses. Binding the name to a local before the loop turns every later read into an index.
  refactoring:
    summary: alias the global or builtin to a local before the loop
  repairs:
    - case: C10S5_global_hoist
    - case: C10S5_three_globals_per_iteration
    - case: C10S5_body_does_real_work
  not_this:
    - source: lookalike:C10S5_lookalike
      why: |
        `_recalibrate` rebinds `THRESHOLD` inside the loop, so a local bound before it freezes the value at entry and the classification is wrong from the first recalibration on. Check whether anything the loop reaches can write the name.
  similar:
    - C3.S2
    - C8.S3
- id: C10.S6
  in_one_line: |
    an operator on a user-defined type dispatching and allocating once per element
  look_for: |
    An operator applied inside a loop to instances of a class defined in this codebase: `total = total + amount` where `Money.__add__` builds a new `Money` every time, `event < best` where `Event.__lt__` is a Python method, `+` on a wrapper whose `__add__` forwards to NumPy. On a built-in type the operator is one bytecode; on a user type it is a dunder lookup, a bound method, a Python frame and, for arithmetic, a new instance the next iteration discards. Read the dunder to see what each call does.
  refactoring:
    summary: do the arithmetic on primitives inside the loop and wrap once at the end
  repairs:
    - case: C10S6_overload_accumulation
      note: |
        Available only because every amount is known to share the same units; if not, this changes behaviour from raising to silently wrong.
    - case: C10S6_comparison_dunder
      note: |
        `min` with a key does one attribute read and one primitive comparison per element instead of a Python `__lt__` call. It also drops the original's `events[1:]`, which copies the whole list: two savings in one edit.
    - case: C10S6_operator_overload
    - case: C10S6_thin_delegating_dunder
      note: |
        When the dunder is a thin wrapper over compiled code, the cost the repair removes is the call rather than the body.
  not_this:
    - source: lookalike:C10S6_lookalike
      why: |
        `Money.__add__` refuses to add euros to dollars; summing `.cents` skips that check, so a mixed batch returns a total in no currency. Read the dunder first: one that validates, normalises units, rounds or raises is doing work the loop would then have to do itself.
  similar:
    - C6.S1
    - C10.S1
    - C10.S2
