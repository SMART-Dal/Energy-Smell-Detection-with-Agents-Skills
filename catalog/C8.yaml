- id: C8.S1
  signals:
    - recursion_without_memo
    - ruff_B019
  in_one_line: |
    a deterministic computation repeated across calls that a cache would answer
  look_for: |
    A deterministic function called again with arguments it has already seen, recomputing a result it could look up: a predicate such as `_is_prime(x)` applied to a list in which the same values recur, or a self-recursive function such as `fib(n - 1) + fib(n - 2)` whose calls solve the same subproblems again. The function reads nothing but its arguments -- no clock, random source, file or mutable global -- and has no side effect. For a symmetric function, `(x, y)` and `(y, x)` are the same question under two keys.
  refactoring:
    summary: cache the result, keyed on the arguments, with a lifetime you have chosen
  repairs:
    - case: C8S1_memoization
      note: |
        The ratio of distinct inputs to calls is what decides it.
    - case: C8S1_normalised_cache_key
      note: |
        `_expensive` is symmetric, so `(3, 7)` and `(7, 3)` are the same question and would otherwise occupy two entries and miss each other. Sorting the pair makes them one key.
    - case: C8S1_open_key_space
  not_this:
    - source: lookalike:C8S1_lookalike
      why: |
        `_rate` reads a table the loop itself updates, so a memo keyed on the currency keeps returning the first rate it saw. Check every name the body reads, not only its parameters: a global, an attribute, the clock or a file rules out caching on the arguments alone.
    - title: recursion that sorts its argument in place
      source: rule:recursion_without_memo/quicksort
      code: |
        def quicksort(arr, low, high):
            if low < high:
                p = partition(arr, low, high)
                quicksort(arr, low, p - 1)
                quicksort(arr, p + 1, high)
      tempting: |
        @functools.lru_cache(maxsize=None)
        def quicksort(arr, low, high):
            if low < high:
                p = partition(arr, low, high)
                quicksort(arr, low, p - 1)
                quicksort(arr, p + 1, high)
      why: |
        `arr` is a list, so the cache raises `TypeError: unhashable type: 'list'` on the first call. The function's work is the in-place sort, a side effect a cache hit would skip, and its two branches never cross the pivot, so nothing is recomputed.
    - title: a method, where a decorator cache keys on `self`
      source: catalog
      code: |
        def config_for(self, name):
            return self._parse(self._files[name])
      tempting: |
        @functools.cache
        def config_for(self, name):
            return self._parse(self._files[name])
      why: |
        `functools.cache` on a method keys on `self`, so its module-level table holds a strong reference to every instance the method was called on, for the life of the process. Cache per instance instead.
  similar:
    - C1.S4
    - C5.S2
    - C7.S2
    - C8.S2
    - C8.S4
- id: C8.S2
  signals:
    - regex_in_loop
  in_one_line: |
    an expensive artefact derived again on every use instead of once for the process
  look_for: |
    An artefact derived from inputs that do not change between uses, rebuilt on every use: `re.search(r"id=(\d+)", line)` or `re.compile(pattern)` inside a loop over lines, `json.loads` of the same document for every key looked up, `struct.Struct(fmt)` constructed per record. Each use pays the compilation or the parse again, where deriving it once and binding it at module or instance scope pays once. The `re` functions consult a module cache of compiled patterns, so there the repeated cost is the cache probe and the call rather than a full compile.
  refactoring:
    summary: derive the artefact once and bind it where it survives the calls that use it
  repairs:
    - case: C8S2_derived_value_reuse
      note: |
        `re.match` hashes the pattern string and probes the module cache on every call before matching; the compiled object goes straight to the matcher.
    - case: C8S2_parsed_config_reused
    - case: C8S2_struct_reused
      note: |
        A `Struct` object holds the compiled layout. It is immutable and thread-safe, so module scope is right here.
  not_this:
    - source: lookalike:C8S2_lookalike
      why: |
        The caller adds request-scoped keys to the config it is given, so one shared parsed dict accumulates every request's overrides and the totals drift. A parsed document is safe to reuse only if nobody writes to it; otherwise hand out a copy.
  similar:
    - C1.S4
    - C3.S3
    - C8.S1
- id: C8.S3
  signals:
    - repeated_lookup_in_loop
  in_one_line: |
    a name or attribute chain re-resolved every iteration for a value that never moves
  look_for: |
    An attribute chain whose value does not change during a loop, resolved again on every iteration: `self.limits.window.low` or `config.limits.maximum` in a comparison, `sink.writer.write(...)` as the receiver of a call, or a bound method such as `out.append` read per element. Each dot is a dictionary lookup on the instance and then its type, plus a descriptor call when a link is a property, and reading a bound method allocates a new object every time. A local bound before the loop turns every later read into an array index.
  refactoring:
    summary: bind the resolved value to a local before the hot region
  repairs:
    - case: C8S3_local_lookup_caching
      note: |
        Valid only because nothing in the loop can rebind a link in the chain; here nothing is called at all. When the loop calls out, read the callee.
    - case: C8S3_bound_method_alias
      note: |
        Two attribute lookups and two bound-method allocations per element become two array indexes. A comprehension would remove the `append` resolution entirely; the alias form is for the cases where a comprehension is not available.
    - case: C8S3_property_in_the_chain
      note: |
        A property in the chain computes on every read. Here nothing rebinds it during the loop, so hoisting is safe; a property re-evaluated on purpose would not be.
    - case: C8S3_body_dominates
  not_this:
    - source: lookalike:C8S3_lookalike
      why: |
        The loop calls `tighten()`, which lowers `limiter.threshold`, so a local bound before the loop is a snapshot of the first iteration and every later comparison uses a limit that has moved. Check whether anything in the body can write a link in the chain, including a method call, a callback or a property setter.
    - title: a flag read every pass so the loop can be stopped
      source: rule:repeated_lookup_in_loop/consume
      code: |
        def consume(queue, worker):
            for item in queue:
                if worker.state.cancelled:
                    break
                worker.handle(item)
      tempting: |
        def consume(queue, worker):
            cancelled = worker.state.cancelled
            for item in queue:
                if cancelled:
                    break
                worker.handle(item)
      why: |
        `cancelled` is read every pass because something outside the loop may set it, and that read is how the loop notices. Bound to a local before the loop it never changes, and the loop can no longer be cancelled.
  similar:
    - C3.S2
    - C10.S5
- id: C8.S4
  signals:
    - io_call_in_loop
  in_one_line: |
    the same external data fetched again when the copy in memory was still good
  look_for: |
    An external read -- a file, a database query, a network call -- repeated for data that has not changed: a settings file opened and parsed once per row, the same file read on every pass, a store asked again for a key it has already answered. Each repeat pays the syscall, the parse or the round trip again for a value already in memory. The repair depends on how often the source changes and on whether a layer below already caches the read, and the code says neither.
  refactoring:
    summary: fetch once and reuse, with a lifetime and an invalidation rule you have stated
  repairs:
    - case: C8S4_same_file_reread
      note: |
        The lifetime is the whole decision: this is right when settings change on restart and wrong when they are edited live. Say which assumption the finding rests on.
    - case: C8S4_redundant_fetching
      note: |
        Stands in for a network fetch: the point is a repeated external read whose answer does not change.
    - case: C8S4_already_cached_below
      note: |
        The store already memoises internally, so the outer cache is a second dict in front of a dict. An ORM identity map, an HTTP cache header or the operating system's page cache may likewise mean no round trip is happening.
  not_this:
    - source: lookalike:C8S4_lookalike
      why: |
        The file is a job queue another process appends to, so re-reading it on each pass is how new jobs are seen; one read before the loop turns the poll into a snapshot and reports less work than there was. Caching an external read is a claim about how often the source changes, and the finding has to state it.
  similar:
    - C8.S1
    - C9.S1
    - C9.S3
