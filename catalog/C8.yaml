# C8 -- Missing Reuse
#
# The taxonomy's own dividing line: C8 spans *across calls or access sites*,
# while C1 stays within a single scope. The practical test is what the repair
# introduces -- a local binding fixes a C1 problem; something that outlives the
# call fixes a C8 one.
#
# All four share a shape and therefore share a hazard: the repair stores
# something, and anything stored has a lifetime. A cache that fixes the cost and
# grows without bound has traded a measurable saving for an unmeasurable leak,
# which is why every card here says what bounds the thing it adds.
#
# The four split by what is being reused:
#
#     S1  the result of a computation, across calls
#     S2  a derived artefact -- a compiled pattern, a parsed config
#     S3  the resolution of a name or an attribute chain, within a hot region
#     S4  data fetched from outside the process

- id: C8.S1
  signals: [recursion_without_memo, ruff_B019]
  in_one_line: >
    a deterministic computation repeated across calls that a cache would answer
  what_to_look_for: >
    Memoisation replaces a computation with a dict probe, and whether that is a
    saving depends on one ratio: how many distinct inputs there are against how
    many calls.  A million calls over five hundred distinct values runs the
    function five hundred times and turns the other 999 500 into hash lookups,
    which is where this project's 95% measurements come from.  A million calls
    over a million distinct values is a million computations *plus* a million
    dict insertions, which is strictly worse, plus a table holding every result
    for the rest of the process.  So the key space against the call count is the
    whole finding, it is a fact about the data rather than the code, and it has
    to be stated.  Two preconditions: the function must be deterministic -- no
    clock, no random source, no file, no mutable global -- and free of side
    effects, because a memoised function that writes, logs or increments
    something stops doing so on a hit.  Think about the key as well as the
    ratio: `(x, y)` and `(y, x)` are different keys for a symmetric function,
    and normalising to `(min, max)` can double the hit rate for nothing.  Then
    bound the cache.  `functools.cache` is unbounded, which is correct on a
    small integer key space and a leak on user-supplied strings; use
    `lru_cache(maxsize=...)` when the key space is open, and never `@cache` on a
    method, since it keys on `self` and keeps every instance alive.
  not_a_smell_when:
    - >
      the function is not deterministic -- it reads a clock, a random source, a
      file, or mutable state
    - >
      it has a side effect that must happen on every call
    - >
      the arguments are almost all distinct, so the cache stores everything and
      hits nothing
    - >
      the arguments are unhashable, or hashing them costs as much as the call
    - >
      the key space is unbounded and the process is long-lived, so the fix is a
      slow leak
    - >
      the function is already cheap, where a dict probe is comparable to running it
  counter_examples:
    - code: |
        @functools.cache
        def config_for(self, name):
            return self._parse(self._files[name])
      why: >
        `cache` on a method keys on `self`, so the module-level table holds a
        strong reference to every instance the method was ever called on, for the
        life of the process. The cost is fixed and the leak is not. The repair is a
        per-instance cache or `cached_property`, never a decorator on a method.
    - code: |
        def render(template, context):
            return template.format(**context)
      why: >
        Deterministic and pure, so it passes the first two steps -- and `context`
        is a dict, which is unhashable, and even frozen the key space is
        effectively every distinct context the program builds. The cache would
        store everything and hit almost nothing.
    - code: |
        def parse_timestamp(text):
            return datetime.fromisoformat(text)
      why: >
        Deterministic, pure, hashable -- and already cheap. A dict probe and a
        hash of the string is not obviously less work than the parse, so the
        cache buys little and costs a table. Cheapness is a rejection reason in
        its own right.
  refactoring:
    summary: cache the result, keyed on the arguments, with a lifetime you have chosen
    examples:
      - title: a small key space behind a large call count
        before: |
          def is_prime(n):
              if n < 2:
                  return False
              for i in range(2, int(n ** 0.5) + 1):
                  if n % i == 0:
                      return False
              return True

          def primes_in(values):
              return [is_prime(v) for v in values]
        after: |
          import functools

          @functools.cache
          def is_prime(n):
              if n < 2:
                  return False
              for i in range(2, int(n ** 0.5) + 1):
                  if n % i == 0:
                      return False
              return True

          def primes_in(values):
              return [is_prime(v) for v in values]
        note: >
          Measured **+95%** on a million values drawn from 0-500. The ratio is the
          reason: five hundred computations serve a million calls. `cache` is
          unbounded and that is correct here, because the key space is a bounded
          range of small integers -- on arbitrary input it would be a leak.
      - title: normalising the key to double the hit rate
        before: |
          def coprime(x, y):
              return math.gcd(x, y) == 1
        after: |
          @functools.lru_cache(maxsize=100_000)
          def _coprime(low, high):
              return math.gcd(low, high) == 1

          def coprime(x, y):
              return _coprime(x, y) if x <= y else _coprime(y, x)
        note: >
          `gcd` is symmetric, so `(3, 7)` and `(7, 3)` are the same question and
          would otherwise occupy two entries and miss each other. Sorting the pair
          at the boundary makes them one key. The wrapper exists so the public
          signature is unchanged -- and `maxsize` is bounded because the key space
          here is open.
      - title: a cache that belongs to the instance
        before: |
          class Loader:
              def config(self, name):
                  return self._parse(self._files[name])
        after: |
          class Loader:
              def __init__(self, files):
                  self._files = files
                  self._parsed = {}

              def config(self, name):
                  if name not in self._parsed:
                      self._parsed[name] = self._parse(self._files[name])
                  return self._parsed[name]
        note: >
          The cache dies with the instance, which is what a decorator on a method
          cannot give you. Note the obligation this creates: if `_files` is ever
          mutated, `_parsed` is stale, so either document that it is immutable or
          invalidate on write.
  patch_shape: signature
  measurability: scales_with_calls
  min_workload_hint: >
    the driver must call the unit many times with *repeating* arguments at a ratio
    you can defend; a driver with all-distinct arguments measures the regression
    rather than the saving, and is measuring the wrong thing
  similar: [C1.S4, C5.S2, C7.S2, C8.S2, C8.S4]

- id: C8.S2
  signals: [regex_in_loop]
  in_one_line: >
    an expensive artefact derived again on every use instead of once for the
    process
  what_to_look_for: >
    Some artefacts are expensive to derive and cheap to reuse: a compiled
    regular expression, a parsed configuration file, a prepared SQL statement, a
    loaded template, a `struct.Struct`.  Deriving one per use pays the
    compilation or the parse every time; deriving it once and binding it at
    module or instance scope pays once for the process.  Unlike memoisation
    there is no key space to worry about because there is exactly one artefact,
    which makes this the safest repair in the category and the one with the
    fewest exceptions.  The precondition is that the derivation's inputs are
    constant -- a pattern built from a literal hoists, one built from an
    argument does not.  Then check the artefact is safe to share: a compiled
    pattern is immutable and thread-safe, a database cursor is not, and a parsed
    config that callers mutate becomes shared mutable state.  Where it goes
    matters and should be justified, since module scope pays the derivation at
    import time, which is wrong when the path may never run and wrong again when
    the source can change under the process.  Check the library is not already
    doing this: `re` caches compiled patterns internally, so the saving there is
    the cache probe and the call rather than the compilation, which is smaller
    than it looks.
  not_a_smell_when:
    - >
      the derivation depends on runtime values, so there is nothing constant to
      hoist
    - >
      the artefact is mutable and sharing it would create shared state -- a
      cursor, a parsed document callers modify
    - >
      the library already caches it, so the saving is the lookup rather than the
      derivation
    - >
      hoisting to module scope would do expensive work at import on a path that may
      never be reached
    - >
      the artefact must be re-derived because its source can change -- a config
      file watched for edits
  counter_examples:
    - code: |
        def find_all(patterns, text):
            return [re.findall(p, text) for p in patterns]
      why: >
        A regex used per iteration, which is the shape -- and the pattern is the
        loop variable. There is nothing constant to hoist. If the same patterns
        recur across calls, the repair is a cache keyed on the pattern, which is
        C8.S1.
    - code: |
        def load(path):
            with open(path) as handle:
                return yaml.safe_load(handle)
      why: >
        An expensive parse, and hoisting it to module scope reads the file at
        import -- before the process knows whether it needs it, and freezing the
        contents for the run. Whether that is right depends on whether the file
        can change, which is a deployment fact rather than a code one.
  refactoring:
    summary: derive the artefact once and bind it where it survives the calls that use it
    examples:
      - title: a compiled pattern at module scope
        before: |
          def extract_ids(lines):
              return [m.group(1) for line in lines
                      if (m := re.search(r"id=(\d+)", line))]
        after: |
          _ID = re.compile(r"id=(\d+)")

          def extract_ids(lines):
              return [m.group(1) for line in lines if (m := _ID.search(line))]
        note: >
          `re.search` hashes the pattern string and probes the module cache on
          every call before doing the match; the compiled object goes straight to
          the matcher. Smaller than the "compile once" framing suggests, because
          `re` already caches -- but real, and it removes the cache as a shared
          resource under concurrency.
      - title: configuration parsed once per process
        before: |
          class Router:
              def route(self, request):
                  table = json.loads(ROUTES_PATH.read_text())
                  return table.get(request.path)
        after: |
          class Router:
              def __init__(self):
                  self._table = json.loads(ROUTES_PATH.read_text())

              def route(self, request):
                  return self._table.get(request.path)
        note: >
          A syscall and a parse per request become one per instance. The instance
          attribute rather than module scope is deliberate: the read now happens
          when a `Router` is built, not at import, so a process that never routes
          never pays it. It also creates an obligation -- the file's contents are
          frozen for the instance's life, which has to be acceptable.
      - title: a prepared struct for a hot binary format
        before: |
          def unpack_all(buffer, count):
              return [struct.unpack_from("<IHH", buffer, i * 8)
                      for i in range(count)]
        after: |
          _HEADER = struct.Struct("<IHH")

          def unpack_all(buffer, count):
              return [_HEADER.unpack_from(buffer, i * 8) for i in range(count)]
        note: >
          `struct.unpack_from` parses the format string on every call, with a
          smaller internal cache than `re` has. A `Struct` object holds the
          compiled layout. Immutable and thread-safe, so module scope is
          unambiguously right here.
  patch_shape: statement_local
  measurability: scales_with_calls
  min_workload_hint: >
    many calls over small inputs; the saving is one derivation per call avoided,
    so a case that calls the unit once measures nothing whatever the input size
  similar: [C1.S4, C3.S3, C8.S1]

- id: C8.S3
  signals: [repeated_lookup_in_loop]
  in_one_line: >
    a name or attribute chain re-resolved every iteration for a value that never
    moves
  what_to_look_for: >
    Resolving a name is not free, and the cost depends on where it lives.  A
    local is an array index.  A global is a dict probe in the module namespace,
    with a second probe into builtins on a miss.  Each dot in an attribute chain
    is a `__dict__` lookup on the instance, then on the type and its bases, and
    possibly a descriptor invocation on top.  So `self.config.limits.batch`
    inside a loop is three lookups per iteration plus whatever the descriptors
    do, for a value that never changes, where a local bound before the loop
    makes every later read a single array index.  Count the resolutions -- one
    per dot, plus one for the base -- and multiply by the iterations, because
    each saved lookup is a few tens of nanoseconds and this needs a genuinely
    hot region.  The precondition is that nothing in the loop can rebind any
    link in the chain, including through a function the loop calls.  Look for a
    property or a descriptor in the chain: if a link computes, the saving is
    much larger than a dict lookup, and the semantics may differ because the
    recomputation was deliberate.  Weigh the readability, too -- one clearly
    named alias is fine, and aliasing four things into cryptic names to save a
    loop is a net loss outside genuinely critical code.
  not_a_smell_when:
    - >
      a link in the chain can be rebound during the loop, directly or by a callee
    - >
      a link is a property whose recomputation is deliberate
    - >
      the loop is short, where the whole saving is under a microsecond
    - >
      the aliases would obscure what the code is reading
    - >
      the chain is resolved once per call already, outside any loop
  counter_examples:
    - code: |
        for item in queue:
            if self.state.cancelled:
                break
            process(item)
      why: >
        An attribute chain read per iteration, which is the shape -- and it is read
        every time *because* something else may set it. Hoisting `cancelled` into
        a local makes the loop uncancellable. Mutability of the chain is the
        rejection reason, and here it is the entire purpose.
    - code: |
        total = 0
        for row in rows:
            total += row.amount
      why: >
        `row.amount` is one attribute lookup per iteration and cannot be hoisted:
        `row` changes every pass. The chain has to be invariant, not merely
        repeated. Any rule counting attribute reads in loops reports this.
  refactoring:
    summary: bind the resolved value to a local before the hot region
    examples:
      - title: an attribute chain in a hot loop
        before: |
          def accept_all(self, rows):
              kept = []
              for row in rows:
                  if row.score >= self.config.limits.minimum:
                      kept.append(row)
              return kept
        after: |
          def accept_all(self, rows):
              minimum = self.config.limits.minimum
              kept = []
              for row in rows:
                  if row.score >= minimum:
                      kept.append(row)
              return kept
        note: >
          Three lookups per row become one array index. Valid only if nothing in
          the loop can rebind `self.config` or `limits` -- and here nothing is
          called at all, which is the easiest version of that check. When the loop
          calls out, you have to read the callee.
      - title: a bound method resolved per iteration
        before: |
          def collect(self, values):
              out = []
              for value in values:
                  out.append(self._transform(value))
              return out
        after: |
          def collect(self, values):
              out = []
              append = out.append
              transform = self._transform
              for value in values:
                  append(transform(value))
              return out
        note: >
          Two attribute lookups and two bound-method allocations per element
          become two array indexes. This is also the point at which the loop
          should probably be a comprehension, which removes the `append`
          resolution entirely and reads better -- so report C3.S1 and subsume
          this. The explicit-alias form is for the cases where a comprehension is
          not available.
  patch_shape: statement_local
  measurability: scales_with_input
  min_workload_hint: >
    hundreds of thousands of iterations at least; each saved lookup is tens of
    nanoseconds, so below that report it as advisory
  similar: [C3.S2, C10.S5]

- id: C8.S4
  signals: [io_call_in_loop]
  in_one_line: >
    the same external data fetched again when the copy in memory was still good
  what_to_look_for: >
    An external fetch costs orders of magnitude more than anything inside the
    process: a filesystem read is a syscall and possibly a seek, a database
    query adds parsing, planning and a round trip, and a network call adds
    latency measured in milliseconds.  Repeating one for data that has not
    changed pays all of it again for a value already in memory, and the energy
    is spent in three places at once -- the local CPU serialising and waiting,
    the network interface, and the remote system doing the work again -- which
    gives this the largest per-instance effects in the taxonomy and the least
    need for a large input to show them.  Establishing the repetition is the
    easy half.  The load-bearing half is how often the source actually changes,
    which is not a fact about the code: a config that changes on restart can be
    cached for the process, one that changes per minute needs a TTL, one that
    changes per write cannot be cached without invalidation.  So caching is a
    correctness decision as much as a performance one, and "cache it" is not a
    repair where "cache it for the life of the request" is.  Check the fetch is
    not already cached a layer down -- an ORM identity map, an HTTP cache
    header, the operating system's page cache -- because if it is, the saving is
    much smaller than the round trip suggests.
  not_a_smell_when:
    - >
      the data changes between the fetches, so reuse would serve something stale
    - >
      staleness is unacceptable for correctness -- a balance, a lock state, a
      permission check
    - >
      a lower layer already caches it, so the apparent round trip is not one
    - >
      the cache would need invalidation nobody can implement reliably
    - >
      the fetch happens once per process already
  counter_examples:
    - code: |
        def process(job_ids):
            for job_id in job_ids:
                job = database.query("SELECT state FROM jobs WHERE id = ?", job_id)
                if job.state == "ready":
                    run(job_id)
      why: >
        A query per iteration, which is the shape -- and every one asks about a
        *different* row, so there is nothing being re-fetched. The finding here is
        C9.S3: one query for all the ids instead of one per id. Repetition of the
        call is not repetition of the data.
    - code: |
        def current_leader(cluster):
            return cluster.fetch("/leader")
      why: >
        A fetch that looks obviously cacheable and must not be: which node leads
        is exactly the thing that changes, and a stale answer sends writes to a
        node that no longer accepts them. The step about what staleness costs is
        what rejects this.
  refactoring:
    summary: fetch once and reuse, with a lifetime and an invalidation rule you have stated
    examples:
      - title: a config file read per request
        before: |
          def handle(request):
              settings = json.loads(SETTINGS_PATH.read_text())
              return render(request, settings)
        after: |
          @functools.lru_cache(maxsize=1)
          def _settings():
              return json.loads(SETTINGS_PATH.read_text())

          def handle(request):
              return render(request, _settings())
        note: >
          A syscall and a parse per request become one per process. The lifetime
          is deliberate and it is the whole decision: this is right when settings
          change on restart and wrong when they are edited live. Say which
          assumption the finding rests on. Note also that the returned dict is now
          shared, so any caller that mutates it corrupts every later request --
          return a copy if that is possible.
      - title: the same row fetched inside a loop
        before: |
          def price_all(order_ids, connection):
              totals = {}
              for order_id in order_ids:
                  rate = connection.execute(
                      "SELECT rate FROM tax WHERE region = 'EU'"
                  ).fetchone()[0]
                  totals[order_id] = subtotal(order_id) * rate
              return totals
        after: |
          def price_all(order_ids, connection):
              rate = connection.execute(
                  "SELECT rate FROM tax WHERE region = 'EU'"
              ).fetchone()[0]
              return {oid: subtotal(oid) * rate for oid in order_ids}
        note: >
          The query is identical every iteration, so N round trips become one.
          This is the simplest and commonest form, and it is a hoist rather than a
          cache -- the value lives for one call, so there is no lifetime question
          to answer. Also reportable as C3.S2; the reason to prefer C8.S4 is that
          what was hoisted crossed a process boundary, which is where the cost
          was.
  patch_shape: structural
  measurability: scales_with_calls
  min_workload_hint: >
    the effect is per avoided round trip and does not need a large input; the case
    file must stub the external call at roughly its real cost, and say so if it
    could not
  notes: >
    Measuring this one honestly is harder than measuring the saving.  A case file
    cannot make a network call, so the external cost has to be stubbed -- and a
    stub that returns instantly makes the repair look worthless, while a stub with
    an arbitrary `sleep` makes the number meaningless.  The defensible approach is
    to stub at a cost you can justify from an observed latency and to state that
    figure in the finding, or to report the round trips avoided as a count rather
    than as an energy figure.
  similar: [C8.S1, C9.S1, C9.S3]
