# C7 -- Suboptimal Algorithmic
# The category that absorbs its neighbours if the discriminators are not
# enforced: in the published LeetCode labelling C7 accounts for 43% of all
# assignments and C7.S1 alone for 27%.  Check C3.S4, C5.S1, C5.S2 and C10.S1
# before landing here.

- id: C7.S1
  signals: [nested_loops, ruff_RUF017]
  how_to_tell:
    - a named algorithm with better complexity or constant factors exists for the
      same problem
    - the replacement is a recognisably *different* algorithm, not the same one
      with an added index
  not_a_smell_when:
    - the input is small enough that the asymptotically worse algorithm wins
    - the current algorithm has properties the faster one lacks (stability,
      streaming, bounded memory)
    - the apparent complexity comes from a bounded constant, not the input size
  refactoring:
    summary: replace the algorithm with the better-known one
    before: |
      for i in range(len(values)):
          for j in range(len(values) - 1):
              if values[j] > values[j + 1]:
                  values[j], values[j + 1] = values[j + 1], values[j]
    after: |
      values.sort()
  patch_shape: structural
  measurability: scales_with_input
  min_workload_hint: >
    measure at two or more input sizes; a complexity repair is nearly invisible
    at small n
  discriminators:
    - vs: C3.S4
      rule: >
        Ask what the patch changes.  C3.S4 removes a loop level, usually by
        introducing a hash lookup, while the strategy stays the same.  C7.S1
        swaps in a differently-named algorithm.
    - vs: C7.S2
      rule: >
        C7.S1 changes *which algorithm* runs.  C7.S2 keeps the algorithm and
        changes *how it explores* -- adding pruning, memoisation or a better
        visit order.
    - vs: C10.S1
      rule: >
        If the replacement is simply a builtin doing the same algorithm in C
        (`sorted`, `max`), prefer C10.S1.  C7.S1 is for a genuine change of
        algorithm, not a change of implementation language.

- id: C7.S2
  signals: [recursion_without_memo]
  how_to_tell:
    - the search explores states that cannot affect the result, or re-solves
      overlapping subproblems within one top-level call
  not_a_smell_when:
    - every branch genuinely contributes to the answer
    - subproblems do not overlap, so caching would only add bookkeeping
    - pruning would change which valid solution is returned
  refactoring:
    summary: prune, memoise or reorder the exploration
    before: |
      def ways(n):
          if n < 2:
              return n
          return ways(n - 1) + ways(n - 2)
    after: |
      @functools.cache
      def ways(n):
          if n < 2:
              return n
          return ways(n - 1) + ways(n - 2)
  patch_shape: structural
  measurability: scales_with_input
  discriminators:
    - vs: C8.S1
      rule: >
        Both may add a cache; the difference is scope.  C7.S2 covers overlapping
        subproblems *inside one top-level call's recursion tree*.  C8.S1 covers
        repeated work *across separate invocations*.  A memoised Fibonacci
        called once is C7.S2; a `parse()` cache reused across requests is C8.S1.
    - vs: C3.S6
      rule: >
        The taxonomy's example for C7.S2 mentions sorting to find a maximum, but
        that repair is really "process fewer items" (C3.S6) or "use the builtin"
        (C10.S1).  Reserve C7.S2 for changes to subproblem exploration.

- id: C7.S3
  signals: [linear_recursion]
  how_to_tell:
    - recursion is linear and an iterative form is straightforward
    - depth can grow with the input
  not_a_smell_when:
    - recursion mirrors a recursive data structure and the iterative form needs
      an explicit stack that is no cheaper
    - depth is bounded and small
    - clarity strongly favours the recursive form
  refactoring:
    summary: convert the recursion to a loop with an accumulator
    before: |
      def total(values, index=0):
          if index == len(values):
              return 0
          return values[index] + total(values, index + 1)
    after: |
      def total(values):
          running = 0
          for value in values:
              running += value
          return running
  patch_shape: structural
  measurability: scales_with_input
  discriminators:
    - vs: C7.S2
      rule: >
        C7.S3 is about *frame overhead* in linear recursion.  C7.S2 is about
        *redundant exploration* in branching recursion.  One self-call per
        invocation is C7.S3; two or more is C7.S2.

- id: C7.S4
  signals:
    - sort_then_slice
    - filter_after_transform
  how_to_tell:
    - two operations commute, and the more expensive one runs first
    - reordering shrinks the input to the expensive step
  not_a_smell_when:
    - the operations do not commute, so the order is required
    - the cheap step does not reduce the input meaningfully
  refactoring:
    summary: run the cheap, reducing step first
    before: |
      ordered = sorted(records)
      recent = [r for r in ordered if r.year > 2020]
    after: |
      recent = sorted(r for r in records if r.year > 2020)
  patch_shape: statement_local
  measurability: scales_with_input
  min_workload_hint: the filter must be selective; a filter that keeps 99% shows nothing

- id: C7.S5
  how_to_tell:
    - an expensive operation runs on input that could be reduced or short-circuited first
  not_a_smell_when:
    - the simplification only holds for inputs that do not actually occur
    - the pre-check costs about as much as the operation it guards
  refactoring:
    summary: simplify or pre-check the input before the expensive step
    before: |
      if re.fullmatch(r"[A-Z]{3}-\d{4}", code):
          register(code)
    after: |
      if len(code) == 8 and code[3] == "-" and re.fullmatch(r"[A-Z]{3}-\d{4}", code):
          register(code)
  patch_shape: expression
  measurability: scales_with_input
  discriminators:
    - vs: C4.S7
      rule: >
        C7.S5 reduces the *input* to an operation that still runs.  C4.S7 adds a
        guard that lets the operation be *skipped entirely* for degenerate cases.
