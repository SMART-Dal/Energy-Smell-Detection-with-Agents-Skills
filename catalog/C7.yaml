- id: C7.S1
  signals:
    - ruff_RUF017
  in_one_line: |
    an algorithm of worse complexity than the problem requires
  look_for: |
    A hand-written procedure whose complexity is worse than a known alternative for the same problem: a linear scan for each target over data that is already sorted, where a binary search halves the range at every step; a bubble or insertion sort, where merge sort or the Timsort behind `sorted` is O(n log n); a substring search that restarts at the next character after every mismatch, where KMP reuses what the failed comparison proved. Name both algorithms and both complexities.
  refactoring:
    summary: replace the algorithm with one whose complexity fits the input size
  repairs:
    - case: C7S1_binary_search
      note: |
        n comparisons become log2(n). The input's sortedness is the precondition and it was already established; if the function had to sort first, the sort would dominate and the repair would be worthless for a single lookup.
    - case: C7S1_algorithm_choice
      note: |
        Both variants are hand-written Python: same language, same interpreter, same data, and only the exponent differs.
    - case: C7S1_hand_written_sort
      note: |
        `before` restarts the comparison at the next character after a mismatch, which is quadratic on text with long repeated runs; `after` reuses what the failed comparison already proved, which is linear.
    - case: C7S1_constants_beat_complexity
      note: |
        Insertion sort allocates nothing, touches one list, and its inner `while` usually exits immediately, where merge sort slices, recurses and builds a new list at every level.
    - case: C7S1_bubble_versus_builtin
      note: |
        `sorted()` is Timsort in C, so the repair changes both the complexity and the language the inner loop runs in.
  similar:
    - C3.S4
    - C5.S1
    - C7.S2
    - C7.S5
    - C9.S4
- id: C7.S2
  signals:
    - recursion_without_memo
  in_one_line: |
    a search exploring subproblems it could have pruned, reordered or reused
  look_for: |
    A walk over a space of subproblems that visits more of them than the answer needs: a recursion with two self-calls whose branches reach the same arguments, as `fib(n - 1) + fib(n - 2)` and a grid path count do, re-solving every shared subproblem from scratch; nested loops that test every combination where a bound on sorted, non-negative values could end a loop early; a table sweep that re-decides states nothing can have reached yet. Say which subproblems repeat, or which bound is sound.
  refactoring:
    summary: memoise overlapping subproblems, prune what cannot contribute, or reorder to prune sooner
  repairs:
    - case: C7S2_memoised_recursion
    - case: C7S2_reachable_states_only
    - case: C7S2_bounded_enumeration
      note: |
        The pruning is sound only because the values are non-negative; an unsound bound gives a wrong answer rather than a faster one.
  not_this:
    - title: a tree walk written as a generator
      source: catalog
      code: |
        def walk(node, depth=0):
            yield node, depth
            for child in node.children:
                yield from walk(child, depth + 1)
      tempting: |
        @functools.cache
        def walk(node, depth=0):
            yield node, depth
            for child in node.children:
                yield from walk(child, depth + 1)
      why: |
        `functools.cache` stores the generator object, so a second `walk(root)` gets back the one the first call already exhausted and yields nothing; a tree has no shared subproblems for the cache to reuse.
    - title: a recursion that sorts a list in place
      source: rule:recursion_without_memo/quicksort
      code: |
        def quicksort(arr, low, high):
            if low < high:
                p = partition(arr, low, high)
                quicksort(arr, low, p - 1)
                quicksort(arr, p + 1, high)
      tempting: |
        @functools.lru_cache(maxsize=None)
        def quicksort(arr, low, high):
            if low < high:
                p = partition(arr, low, high)
                quicksort(arr, low, p - 1)
                quicksort(arr, p + 1, high)
      why: |
        `lru_cache` hashes its arguments and a list is unhashable, so the first call raises `TypeError`; the two calls cover disjoint ranges either side of the pivot, so nothing is ever recomputed.
    - title: the first answer found is the one returned
      source: catalog
      code: |
        def first_fit(items, capacity):
            for combo in itertools.combinations(items, 3):
                if sum(item.size for item in combo) <= capacity:
                    return combo
            return None
      tempting: |
        def first_fit(items, capacity):
            ordered = sorted(items, key=lambda item: item.size)
            for combo in itertools.combinations(ordered, 3):
                if sum(item.size for item in combo) <= capacity:
                    return combo
            return None
      why: |
        The function returns the first fitting triple in the caller's order; exploring the smallest items first returns a different triple whenever more than one fits.
  similar:
    - C3.S5
    - C7.S1
    - C7.S3
    - C8.S1
- id: C7.S3
  signals:
    - linear_recursion
  in_one_line: |
    a recursion paying a frame per level where a loop would use one
  look_for: |
    A function that calls itself where a loop would do the same work in one frame: a linear recursion such as `n * factorial(n - 1)`, with one self-call on each path and an accumulator it could carry instead, or a tree walk that recurses into each child, where an explicit stack can do the walking. Every call allocates a frame and binds its arguments; CPython does no tail-call elimination, so every frame stays alive until the base case returns, and a deep enough recursion raises `RecursionError`.
  refactoring:
    summary: convert the recursion to a loop, with an accumulator or an explicit stack
  repairs:
    - case: C7S3_iterative_factorial
      note: |
        One self-call per level, so the recursion is pure sequencing and the loop carries the same accumulator in one frame. It also removes the recursion limit as a ceiling: the original raises once the depth passes the default limit.
    - case: C7S3_branching_recursion
    - case: C7S3_recursion_to_loop
  similar:
    - C2.S3
    - C7.S2
- id: C7.S4
  signals:
    - sort_then_slice
    - filter_after_transform
  in_one_line: |
    two commuting operations in the order that makes the expensive one see more data
  look_for: |
    Two steps that could run in either order, run so that the expensive one sees more data than it needs: `sorted(values)[:k]`, `[0]` or `[-1]`, sorting everything to keep a few elements; a transform such as parsing applied to every element before a filter that tests only what the input already had; an expensive mapping applied to every value before the duplicates are removed. Running the cheap, reducing step first means the expensive one sees only what survives it.
  refactoring:
    summary: run the cheap, reducing operation before the expensive one
  repairs:
    - case: C7S4_sort_then_slice
      note: |
        n log n becomes n log k.
    - case: C7S4_filter_before_transform
      note: |
        The predicate only reads `r`, not `_expensive(r)`, which is what makes the move legal.
    - case: C7S4_deduplicate_before_mapping
      note: |
        Both operations are already bulk steps and the repair swaps two statements, which is what separates this from C3.S6.
  not_this:
    - title: the filter tests the transform's output
      source: catalog
      code: |
        scores = [expensive(x) for x in items]
        best = [s for s in scores if s > threshold]
      tempting: |
        best = [expensive(x) for x in items if x > threshold]
      why: |
        The predicate reads the score, which does not exist until the transform has run; moved first, it tests the input instead and keeps different elements.
    - title: a slice that drops only the last element
      source: rule:sort_then_slice/all_but_the_last
      code: |
        def all_but_the_last(data):
            return sorted(data)[:-1]
      tempting: |
        import heapq

        def all_but_the_last(data):
            return heapq.nsmallest(-1, data)
      why: |
        `[:-1]` keeps every element but the largest, so the sort is not thrown away; `heapq.nsmallest` with a count below one returns an empty list.
  similar:
    - C3.S6
    - C4.S1
    - C7.S5
- id: C7.S5
  in_one_line: |
    an operation doing more work than an algebraic fact about its inputs requires
  look_for: |
    An operation doing work that a fact about its inputs makes unnecessary: `abs` on a difference that cannot be negative because one side is the `max` of the two; `math.sqrt` applied to both sides of a comparison, when it is strictly increasing on the values compared; a constant factor multiplied into every term of a sum instead of once into the total; a whole string reversed to compare it with itself. Write the fact out and check it holds for every input the function accepts.
  refactoring:
    summary: simplify the input or the operation using a fact about the values
  repairs:
    - case: C7S5_abs_never_negative
      note: |
        `k` is the maximum of `a` and `b`, so `k - b` is non-negative by construction and `abs` can only ever return its argument; the fact holds for every input, including negatives and equal values.
    - case: C7S5_monotonic_comparison
      note: |
        `math.sqrt` is strictly increasing on non-negative reals, so `sqrt(a) > sqrt(b)` and `a > b` agree wherever both are defined; `after` keeps the calls on the path where the values may be negative.
    - case: C7S5_only_half_is_needed
      note: |
        `text == text[::-1]` examines each pair of characters twice, once from each end; comparing the first half against the reversed second half examines each pair once, at the price of three slices instead of one copy. The `+ (len(text) % 2)` skips the middle character of an odd-length string, without which every odd-length string reports as not a palindrome.
    - case: C7S5_unsimplified
      note: |
        `sum(x * 2 for x in xs)` is `2 * sum(xs)`: one multiply instead of n.
  not_this:
    - source: lookalike:C7S5_lookalike
      why: |
        `x * 0 + x * 1 == x` holds over the integers but not over IEEE floats: `inf * 0` is `nan`, so the simplified form turns a reading the caller's NaN check was meant to catch into a clean number. An identity has to hold for the type the values actually have.
    - title: monotonicity keeps the position of the maximum, not its value
      source: catalog
      code: |
        def score(logits):
            probabilities = softmax(logits)
            return max(probabilities)
      tempting: |
        def score(logits):
            return max(logits)
      why: |
        `argmax(softmax(x)) == argmax(x)`, but `max(softmax(x))` is a probability and `max(x)` is a logit, so the function returns a different number.
    - title: nothing makes the values non-negative
      source: catalog
      code: |
        def normalise(values):
            total = sum(abs(v) for v in values)
            return [v / total for v in values]
      tempting: |
        def normalise(values):
            total = sum(values)
            return [v / total for v in values]
      why: |
        The sum is taken over magnitudes on purpose; with negative values the plain sum gives a different total, or zero and a `ZeroDivisionError`.
  similar:
    - C7.S1
    - C7.S4
    - C10.S2
