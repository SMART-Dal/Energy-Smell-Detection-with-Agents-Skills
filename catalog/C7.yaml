# C7 -- Suboptimal Algorithmic
#
# The category that absorbs its neighbours if the discriminators are not
# enforced: in the published LeetCode labelling C7 accounts for 43% of all
# assignments and C7.S1 alone for 27%. That is what a label with an appealing
# name does to a classifier, and it is the thing every card here is written to
# resist. Check C3.S4, C5.S1, C5.S2 and C10.S1 before settling on one of these.
#
# The discipline that works: name the algorithm you are replacing and the
# algorithm you are replacing it with. If you cannot name both, you have noticed
# that something is slow, which is not the same as knowing it is algorithmic.
#
# The five split by what the repair changes:
#
#     S1  the algorithm, for one with better complexity or constants
#     S2  the decomposition -- what subproblems get explored, in what order
#     S3  recursion into iteration
#     S4  the order two commuting operations run in
#     S5  the operation itself, using an algebraic fact

- id: C7.S1
  signals: [nested_loops, ruff_RUF017]
  mechanism: >
    Complexity is the only thing in this taxonomy that changes the *shape* of the
    cost curve rather than its constant factor.  Every other root cause makes each
    element cheaper; this one changes how many element-operations there are.  A
    linear scan over a sorted list is n comparisons where a binary search is
    log2(n) -- twenty against a million -- and a quadratic pairwise scan is n^2
    where a hash-based pass is n.  That means the saving grows without bound as
    the input grows, and equally that it is negligible at small n, where the
    better algorithm's constant factor and setup cost can lose outright.
  how_to_tell:
    - >
      Name the algorithm the code implements and the algorithm you would replace
      it with. Both, by name. "A linear scan over sorted data" and
      "`bisect.bisect_left`"; "a hand-written insertion sort" and "Timsort via
      `sorted`". If you cannot name both, this is not the root cause -- you have
      noticed slowness, which is not the same thing.
    - >
      State both complexities and where they cross. The better algorithm has a
      larger constant almost always, so there is an n below which the original
      wins, and you should know roughly where it is.
    - >
      Establish that the replacement computes the same thing, including at the
      edges: ties, duplicates, empty input, the order of equal elements, and
      floating-point accumulation order.
    - >
      Establish the input reaches the size where it matters, and say how you
      know. This is where most candidates fail: the code is quadratic and n is
      always eight.
    - >
      Check the precondition the better algorithm needs. Binary search needs
      sorted input; a hash approach needs hashable keys; a sieve needs a bounded
      range. If the precondition has to be established first, its cost counts
      against the repair.
  not_a_smell_when:
    - >
      the input is always small, so the asymptotically worse algorithm wins on
      constants
    - >
      the better algorithm needs a precondition -- sorted, hashable, bounded --
      that would cost more to establish than it saves
    - >
      the replacement changes the result at the edges, and something depends on
      the current behaviour
    - >
      the current approach is required for a reason outside performance:
      numerical stability, determinism, a documented ordering
    - >
      the two are the same algorithm and only the implementation differs, which
      is C10.S1
  counter_examples:
    - code: |
        def find(needles, haystack):
            return [n for n in needles if n in haystack]
      why: >
        A linear membership test inside a loop, which is the classic quadratic
        shape -- and whether it is a smell depends entirely on sizes nobody has
        stated. With eight needles against a twelve-element list, building a set
        is more work than the scans. The repair also belongs to C5.S1 rather than
        here: the algorithm is unchanged, only the container is.
    - code: |
        def nearest(points, target):
            best = None
            for p in points:
                if best is None or distance(p, target) < distance(best, target):
                    best = p
            return best
      why: >
        Linear and cannot be better without preprocessing: finding a nearest
        neighbour in unstructured data is Omega(n). A k-d tree is asymptotically
        better only across *many* queries, so proposing it for one query is a
        regression. The real finding here is that `distance(best, target)` is
        recomputed every iteration, which is C3.S2.
    - code: |
        def merge_sort(values):
            if len(values) <= 1:
                return values
            middle = len(values) // 2
            left = merge_sort(values[:middle])
            right = merge_sort(values[middle:])
            return _merge(left, right)
      why: >
        Recursive and O(n log n), which is optimal for a comparison sort. It looks
        like a candidate because it is hand-written where `sorted` exists, and
        replacing it with `sorted` is C10.S1 -- the same complexity implemented in
        C -- not an algorithmic improvement. The distinction matters because the
        expected saving is a constant factor, not a curve.
  refactoring:
    summary: replace the algorithm with one whose complexity fits the input size
    examples:
      - title: a linear scan over data that is already sorted
        before: |
          def index_of(sorted_values, target):
              for position, value in enumerate(sorted_values):
                  if value == target:
                      return position
                  if value > target:
                      return -1
              return -1
        after: |
          import bisect

          def index_of(sorted_values, target):
              position = bisect.bisect_left(sorted_values, target)
              if position < len(sorted_values) and sorted_values[position] == target:
                  return position
              return -1
        note: >
          n comparisons become log2(n): twenty against a million. The input's
          sortedness is the precondition and it was already established -- if the
          function had to sort first, the sort would dominate and the repair
          would be worthless for a single lookup.
      - title: quadratic pairwise search made linear by hashing
        before: |
          def has_pair_summing_to(values, target):
              for i in range(len(values)):
                  for j in range(i + 1, len(values)):
                      if values[i] + values[j] == target:
                          return True
              return False
        after: |
          def has_pair_summing_to(values, target):
              seen = set()
              for value in values:
                  if target - value in seen:
                      return True
                  seen.add(value)
              return False
        note: >
          n^2/2 additions become n hashes. Note the repair is not merely faster:
          it also changes which pair is found first, so a version returning the
          pair rather than a boolean would not be equivalent. This is also
          reportable as C3.S4, since a loop level disappears -- pick one.
      - title: quadratic accumulation hidden in a loop
        before: |
          def flatten(groups):
              out = []
              for group in groups:
                  out = out + group      # allocates and copies everything so far
              return out
        after: |
          def flatten(groups):
              out = []
              for group in groups:
                  out.extend(group)
              return out
        note: >
          `out + group` builds a new list containing everything accumulated so
          far, so the total copying is quadratic in the output length; `extend`
          appends in place. The complexity is hidden in an operator rather than in
          a nested loop, which is the form that gets missed. `itertools.chain`
          expresses it better still.
  patch_shape: structural
  measurability: scales_with_input
  min_workload_hint: >
    the input must be large enough that the complexity difference dominates the
    constant factors, and the case file should include a small case too, to show
    where the crossover is
  notes: >
    The single most over-applied label in the taxonomy.  The discipline that
    prevents it is `how_to_tell` step 1: name both algorithms.  "It has nested
    loops" is not this root cause; "it is a linear scan where binary search
    applies" is.
  discriminators:
    - vs: C10.S1
      rule: >
        The distinction that matters most here.  C7.S1 changes the *algorithm*:
        different complexity, different approach.  C10.S1 keeps the algorithm and
        runs it in C instead of in the interpreter.  A hand-written bubble sort
        replaced by `sorted()` is C7.S1 -- Timsort is a different algorithm.  A
        summing loop replaced by `sum()` is C10.S1 -- it is the same algorithm.
    - vs: C3.S4
      rule: >
        C3.S4 removes a level of loop nesting while keeping the approach.  C7.S1
        replaces the approach.  They co-occur often; report C3.S4 when the repair
        is recognisably "index the inner scan" and C7.S1 when the new code has a
        different name.
    - vs: C5.S1
      rule: >
        If the whole repair is a container type at its construction site, it is
        C5.S1 even though the complexity changed.  C7.S1 requires the *logic* to
        change, not only what holds the data.
    - vs: C7.S2
      rule: >
        C7.S1 swaps a known algorithm for a better-known one.  C7.S2 keeps the
        approach and stops it exploring subproblems it did not need -- pruning,
        ordering, reusing overlapping results.

- id: C7.S2
  signals: [recursion_without_memo]
  mechanism: >
    A search explores a space of subproblems, and its cost is how many of them it
    visits.  Three things make that number larger than necessary and all three
    are decomposition failures rather than algorithm failures.  Overlapping
    subproblems get re-solved from scratch, which is what turns naive Fibonacci
    from linear into exponential.  Branches that cannot contain a solution get
    explored anyway, because no bound is checked before descending.  And the
    exploration order delays the discovery that would have pruned the rest.  The
    repair keeps the algorithm's shape and changes which parts of the space it
    touches -- which is why the saving can be an entire exponent while the code
    changes by three lines.
  how_to_tell:
    - >
      Say what the subproblem space is and how the code walks it: recursion,
      an explicit stack, nested loops over combinations.
    - >
      Name which of the three failures applies. Are the same subproblems reached
      by more than one path (memoise)? Can a branch be ruled out before
      descending (prune)? Would a different order find the pruning bound sooner
      (reorder)?
    - >
      For the overlapping case, establish that subproblems really do repeat, by
      describing two paths that reach the same one. A tree with no shared
      subproblems gains nothing from memoisation but pays for the table.
    - >
      For pruning, name the bound and confirm it is sound -- that no pruned
      branch could have contained a better answer. An unsound bound is a wrong
      answer, not a faster one.
    - >
      Establish the space is large enough to matter. Exhaustive search over
      twelve combinations does not need pruning.
  not_a_smell_when:
    - >
      the subproblems do not overlap, so a memo table is pure overhead
    - >
      no sound bound exists, so pruning would change the answer
    - >
      the search space is small enough that exhaustive exploration is the simplest
      correct thing
    - >
      the memo would grow without bound over a long-lived process, trading a leak
      for the speed-up
    - >
      the exploration order is fixed by a requirement -- a stable result, a
      deterministic tie-break
  counter_examples:
    - code: |
        def walk(node, depth=0):
            yield node, depth
            for child in node.children:
                yield from walk(child, depth + 1)
      why: >
        Recursive descent over a tree, and every node is visited exactly once
        because a tree has no shared subproblems. Memoising this adds a dict and
        saves nothing. The rule fires on "recursion with no cache"; the reader has
        to establish that anything repeats.
    - code: |
        @functools.cache
        def render(self, template):
            return template.format(**self.fields)
      why: >
        Memoisation applied to a method, which caches `self` in a module-level
        table and keeps every instance alive for the process lifetime. The
        decomposition was fine; the fix introduced a leak. When the memo's
        lifetime is the problem, the finding is C6.S4 and the direction is the
        opposite one.
  refactoring:
    summary: memoise overlapping subproblems, prune what cannot contribute, or reorder to prune sooner
    examples:
      - title: overlapping subproblems re-solved
        before: |
          def ways(n):
              if n <= 1:
                  return 1
              return ways(n - 1) + ways(n - 2)
        after: |
          import functools

          @functools.cache
          def ways(n):
              if n <= 1:
                  return 1
              return ways(n - 1) + ways(n - 2)
        note: >
          Exponential to linear from one decorator, because `ways(n - 2)` is
          reached by two different paths at every level. The cache is unbounded,
          which is correct for a pure function of a small integer and would be a
          leak for one keyed on arbitrary objects -- check what the key space is
          before using `cache` rather than `lru_cache(maxsize=...)`.
      - title: a state the search forgot to record
        before: |
          def has_cycle(graph):
              visiting = set()

              def descend(node):
                  if node in visiting:
                      return True
                  visiting.add(node)
                  for neighbour in graph[node]:
                      if descend(neighbour):
                          return True
                  visiting.discard(node)
                  return False

              return any(descend(n) for n in graph)
        after: |
          def has_cycle(graph):
              visiting, done = set(), set()

              def descend(node):
                  if node in visiting:
                      return True
                  if node in done:
                      return False
                  visiting.add(node)
                  for neighbour in graph[node]:
                      if descend(neighbour):
                          return True
                  visiting.discard(node)
                  done.add(node)
                  return False

              return any(descend(n) for n in graph)
        note: >
          The original forgets which subtrees it has already cleared, so a node
          reachable by many paths is re-explored once per path -- exponential on a
          diamond-shaped graph. Adding a second state makes each node's subtree
          visited once. Same algorithm, same traversal, one set: the saving is in
          what gets revisited.
      - title: pruning a branch that cannot improve the answer
        before: |
          def best_subset(items, budget):
              best = 0
              for chosen in itertools.chain.from_iterable(
                  itertools.combinations(items, k) for k in range(len(items) + 1)
              ):
                  if sum(i.cost for i in chosen) <= budget:
                      best = max(best, sum(i.value for i in chosen))
              return best
        after: |
          def best_subset(items, budget):
              ordered = sorted(items, key=lambda i: i.value / i.cost, reverse=True)
              best = 0

              def descend(index, cost, value):
                  nonlocal best
                  best = max(best, value)
                  for j in range(index, len(ordered)):
                      item = ordered[j]
                      if cost + item.cost > budget:
                          continue                    # sound: costs are positive
                      descend(j + 1, cost + item.cost, value + item.value)

              descend(0, 0, 0)
              return best
        note: >
          The original enumerates all 2^n subsets and tests each; the repair never
          descends into a branch already over budget, and visits the
          highest-value-density items first so the bound bites early. The pruning
          is sound only because costs are non-negative -- state that, because an
          unsound bound gives a wrong answer rather than a faster one.
  patch_shape: structural
  measurability: scales_with_input
  min_workload_hint: >
    the input must be large enough for the exponent to show; for a memoisation
    case that usually means an input where the naive version is visibly slow
  discriminators:
    - vs: C8.S1
      rule: >
        Both add a cache and the split is what is being reused.  C7.S2 reuses
        *subproblem results within one search*, and the memo usually dies with
        the call.  C8.S1 caches *a function's results across calls* made by
        unrelated callers.  Ask whether the cache would still help if the
        function were called only once.
    - vs: C7.S1
      rule: >
        C7.S2 keeps the approach and visits less of the space.  C7.S1 replaces the
        approach.  If the code's name changes, it is C7.S1.
    - vs: C3.S6
      rule: >
        C3.S6 is about a loop touching elements it did not need.  C7.S2 is about a
        *search* exploring states it did not need.  If there is no subproblem
        structure, it is C3.S6.

- id: C7.S3
  signals: [linear_recursion]
  mechanism: >
    A Python call is expensive relative to a loop iteration: a frame object of
    two to four hundred bytes is allocated, arguments are bound into it, and it
    is torn down on return.  CPython does no tail-call elimination, so a
    self-recursive function pays that per level and holds every frame alive until
    the base case returns.  A loop with an accumulator does the same arithmetic in
    one frame.  The saving is therefore the frame cost times the depth -- and
    there is a correctness dimension too, since the default recursion limit is
    1000 and a linear recursion over a large input raises rather than running
    slowly.
  how_to_tell:
    - >
      Establish the recursion is *linear* -- exactly one self-call on each path
      -- so the recursion is only sequencing, not branching. That is the case an
      accumulator loop replaces directly.
    - >
      If it branches -- two or more self-calls, a tree, divide and conquer -- say
      so and reject. An explicit stack there is a reimplementation of the call
      stack in slower Python, and usually a regression.
    - >
      Say what the accumulator is and confirm the loop can carry it: a running
      total, a product, a built list, a pair of values.
    - >
      Establish the depth is worth it. A recursion three levels deep saves three
      frames; one a thousand deep is also a `RecursionError` waiting to happen,
      and that is worth reporting even where the energy saving is not.
    - >
      Check the recursion is not the clearer expression of something genuinely
      recursive, on a path where depth is bounded and small.
  not_a_smell_when:
    - >
      the recursion branches -- a tree walk, divide and conquer -- where an
      explicit stack reimplements the call stack in Python and is slower
    - >
      the depth is small and bounded, so a handful of frames is the whole cost
    - >
      the recursive form is substantially clearer and the path is not hot
    - >
      the recursion is the algorithm's definition and rewriting it would obscure
      why it is correct
  counter_examples:
    - code: |
        def merge_sort(values):
            if len(values) <= 1:
                return values
            middle = len(values) // 2
            return _merge(merge_sort(values[:middle]), merge_sort(values[middle:]))
      why: >
        Two self-calls per level, so this is branching recursion. An iterative
        version needs an explicit stack of pending ranges, which allocates list
        objects instead of frames and is generally *slower* in CPython. The
        project's own sample keeps the recursion in both variants and changes only
        the merge loop -- which is the right call.
    - code: |
        def depth(node):
            if node is None:
                return 0
            return 1 + max(depth(node.left), depth(node.right))
      why: >
        Branching, and bounded by the tree's height -- around twenty for a
        balanced million-node tree. Twenty frames is nothing, and the iterative
        form needs its own stack. Depth being logarithmic is what makes tree
        recursion safe.
  refactoring:
    summary: convert linear recursion to a loop with an explicit accumulator
    examples:
      - title: an accumulating recursion
        before: |
          def factorial(n):
              if n == 0:
                  return 1
              return n * factorial(n - 1)
        after: |
          def factorial(n):
              result = 1
              for i in range(2, n + 1):
                  result *= i
              return result
        note: >
          Measured **+39.5%** at n = 800. One self-call per level, so the
          recursion is pure sequencing and the loop carries the same accumulator
          in one frame. It also removes the recursion limit as a ceiling: the
          original raises above n = 1000 by default.
      - title: two carried values instead of one
        before: |
          def fib(n):
              if n == 0:
                  return 0
              if n == 1:
                  return 1
              return fib(n - 1) + fib(n - 2)
        after: |
          def fib(n):
              a, b = 0, 1
              for _ in range(n):
                  a, b = b, a + b
              return a
        note: >
          Worth including because it is *not* the same repair as the first: this
          recursion branches, so the win is not frame cost but the exponential
          re-solving of overlapping subproblems -- which makes the honest label
          C7.S2, with C7.S3 subsumed. Note that memoising it instead would also
          fix it linearly while keeping the recursion; the iterative form
          additionally uses constant space.
  patch_shape: structural
  measurability: scales_with_calls
  min_workload_hint: >
    the depth is the effect, so the case needs a large n rather than many calls
    with a small one -- and keep it under the recursion limit or `before` raises
  discriminators:
    - vs: C7.S2
      rule: >
        C7.S3 is about the *cost of the frames* in a recursion that visits each
        subproblem once.  C7.S2 is about a recursion that visits the same
        subproblem repeatedly.  If the saving is a complexity class rather than a
        constant factor, it is C7.S2.
    - vs: C2.S3
      rule: >
        Both are about call overhead.  C7.S3 is a function calling *itself*;
        C2.S3 is a chain of different functions.

- id: C7.S4
  signals:
    - sort_then_slice
    - filter_after_transform
  mechanism: >
    When two operations commute, the order decides how much data the expensive
    one sees.  Filtering before transforming means the transform runs on the
    survivors; sorting after taking the top k means the sort sees k elements
    rather than n.  The saving is the expensive operation's per-element cost
    multiplied by the elements the cheap one removed -- so it scales with
    selectivity, and it is nothing when the cheap step removes nothing.  This is
    the same principle as short-circuit ordering in a boolean expression (C4.S1),
    applied to statements instead of operands.
  how_to_tell:
    - >
      Name the two operations, say which is more expensive per element, and say
      which currently runs first.
    - >
      Prove they commute -- that running them in the other order gives the same
      answer. This is where the repair usually fails: a filter whose predicate
      reads the transform's output cannot move before it.
    - >
      Say what fraction the cheap operation removes. High selectivity is the
      whole effect; a filter that keeps 95% of the rows is not worth reordering
      for.
    - >
      Check the reorder does not change ties, ordering or numerical results. A
      sort applied to a filtered list can order equal elements differently, and
      floating-point sums change with order.
    - >
      Check the cheap operation is actually cheap after the move. Deduplicating a
      million unique values to shrink a scan costs more than the scan.
  not_a_smell_when:
    - >
      the operations do not commute -- the second reads what the first produced
    - >
      the cheap operation removes little, so the expensive one sees nearly the
      same data either way
    - >
      the reorder changes the result: tie order, floating-point accumulation, the
      identity of a chosen element
    - >
      the full intermediate result is needed by something else as well
    - >
      the "cheap" step is only cheap on the reduced data and expensive on the
      full input
  counter_examples:
    - code: |
        scores = [expensive(x) for x in items]
        best = [s for s in scores if s > threshold]
      why: >
        Transform then filter, which is exactly the shape -- and irrepairable,
        because the predicate tests the transform's *output*. You cannot filter
        first on something you have not computed. Read what the predicate reads
        before proposing the swap.
    - code: |
        rows = sorted(records, key=lambda r: r.at)
        recent = [r for r in rows if r.at >= cutoff]
      why: >
        Sort then filter, and the operations do commute here, so it looks like a
        clean win -- but the sort is by the same key the filter tests, so the
        genuine repair is neither reorder nor filter: it is `bisect` on the sorted
        list, which is C7.S1. When a reorder is available and something better
        also is, say so.
  refactoring:
    summary: run the cheap, reducing operation before the expensive one
    examples:
      - title: sort after taking, not before
        before: |
          def top_scores(records, k):
              ordered = sorted(records, key=lambda r: r.score, reverse=True)
              return [r.name for r in ordered[:k]]
        after: |
          import heapq

          def top_scores(records, k):
              best = heapq.nlargest(k, records, key=lambda r: r.score)
              return [r.name for r in best]
        note: >
          n log n becomes n log k. Note the tie behaviour differs: `sorted` is
          stable and `nlargest` is not guaranteed to be, so if two records share
          a score the chosen one may change. Check whether the caller cares.
      - title: filter before the expensive transform
        before: |
          def summarise(paths):
              parsed = [parse_document(p) for p in paths]
              return [d.title for d in parsed if d.path.suffix == ".md"]
        after: |
          def summarise(paths):
              wanted = [p for p in paths if p.suffix == ".md"]
              return [parse_document(p).title for p in wanted]
        note: >
          The predicate only reads the path, not the parsed document, which is
          what makes the move legal -- and it means `parse_document` runs on the
          markdown files instead of on everything. The saving is
          `parse_document`'s cost times the files excluded.
      - title: early exit beats bulk work
        before: |
          def equal(list_a, list_b):
              return "".join(list_a) == "".join(list_b)
        after: |
          def equal(list_a, list_b):
              if len(list_a) != len(list_b):
                  return False
              for a, b in zip(list_a, list_b):
                  if a != b:
                      return False
              return True
        note: >
          The "cheap first" operation here is the comparison itself: the loop
          returns at the first mismatch where the joins materialise both
          sequences in full -- roughly a gigabyte in the project's sample -- before
          comparing anything. A C-level primitive that must see all the data
          loses to an interpreted loop that usually does not. This is the C7.S4
          case people miss, because the expensive operation looks like the fast
          one.
  patch_shape: statement_local
  measurability: scales_with_input
  min_workload_hint: >
    the cheap step must remove most of the data; state the selectivity in the case
    file and make it representative rather than convenient
  discriminators:
    - vs: C3.S6
      rule: >
        Nearly the same idea and the split is scope.  C7.S4 reorders *two
        operations* that are both already bulk steps -- two statements swapped.
        C3.S6 is about a *loop or comprehension* touching more elements than it
        needs -- a filter moved inside.
    - vs: C4.S1
      rule: >
        The same principle at different granularity.  C4.S1 orders *operands* in
        one boolean expression; C7.S4 orders *statements* in a pipeline.
    - vs: C7.S5
      rule: >
        C7.S4 keeps both operations and swaps them.  C7.S5 makes one of them
        cheaper, or removes it, using an algebraic fact.

- id: C7.S5
  mechanism: >
    An expensive operation applied to an input that could have been reduced first
    does more work than the answer requires.  The reduction is algebraic rather
    than structural: a term that is provably zero or an identity, a wrapper that
    cannot change its argument, a general procedure whose result is determined by
    a cheap property of the input, a transformation the following step is
    invariant under.  The saving ranges from one operation per element to the
    entire computation, and unlike everything else in this category it needs
    knowledge of *what the values mean* rather than of the control flow -- which
    is why it is the root cause a reading agent can find and no tool can.
  how_to_tell:
    - >
      Point at the expensive operation and state the algebraic fact that makes
      part or all of it unnecessary. Write it out: "`k = max(a, b)` so `k - a >=
      0`, so `abs` cannot change it"; "softmax is monotonic, so `argmax` does not
      need it".
    - >
      Establish the fact holds for every input the function accepts, not only for
      the ones it usually gets. This is the step that decides correctness, and
      "it has always been positive so far" is not the same as "it cannot be
      negative".
    - >
      Say what the simplified form is and check it agrees with the original
      everywhere -- including at the edges the fact is silent about: NaN, empty
      input, zero, negative zero, overflow.
    - >
      Say what the saving is per execution: one call per element, one pass, or
      the whole operation.
    - >
      Distinguish this from adding a guard. If the simplification applies to
      *all* inputs, it is this root cause; if it applies only to some and needs a
      branch, it is C4.S7.
  not_a_smell_when:
    - >
      the algebraic fact does not hold for every input the function accepts
    - >
      the general form is defensive against inputs the caller could supply, even
      if today's callers do not
    - >
      the simplification changes floating-point results, NaN handling, or overflow
      behaviour in ways something depends on
    - >
      the general form is required by an interface -- the same code path must
      handle a wider set of inputs elsewhere
    - >
      the saving is one cheap operation on a cold path
  counter_examples:
    - code: |
        def normalise(values):
            total = sum(abs(v) for v in values)
            return [v / total for v in values]
      why: >
        `abs` looks removable, and it is not: `values` may contain negatives, and
        that is the whole reason the sum is taken over magnitudes. The fact has to
        hold for every accepted input, and here it does not hold for any
        interesting one.
    - code: |
        def score(logits):
            probabilities = softmax(logits)
            return max(probabilities)
      why: >
        Nearly identical to the positive example below and not the same:
        `argmax(softmax(x)) == argmax(x)`, but `max(softmax(x))` is a probability
        and `max(x)` is a logit. Monotonicity preserves the *position* of the
        maximum, not its value. This is the near-miss that makes the difference
        between a repair and a wrong answer.
  refactoring:
    summary: simplify the input or the operation using a fact about the values
    examples:
      - title: a wrapper that cannot change its argument
        before: |
          def gaps(first, second):
              highs = [max(a, b) for a, b in zip(first, second)]
              return ([abs(h - a) for h, a in zip(highs, first)],
                      [abs(h - b) for h, b in zip(highs, second)])
        after: |
          def gaps(first, second):
              highs = [max(a, b) for a, b in zip(first, second)]
              return ([h - a for h, a in zip(highs, first)],
                      [h - b for h, b in zip(highs, second)])
        note: >
          `h` is the maximum of `a` and `b`, so `h - a` and `h - b` are both
          non-negative by construction and `abs` can only ever return its
          argument. Two calls per element removed, and the fact holds for every
          input including negatives and equal values. This is the cleanest form
          of the root cause: nothing about the control flow changes.
      - title: the expensive step does not affect the answer at all
        before: |
          def classify(logits):
              probabilities = softmax(logits)
              best, index = 0, 0
              for i, p in enumerate(probabilities):
                  if p > best:
                      best, index = p, i
              return index
        after: |
          def classify(logits):
              best, index = float("-inf"), 0
              for i, value in enumerate(logits):
                  if value > best:
                      best, index = value, i
              return index
        note: >
          Softmax is strictly monotonic, so it preserves order and the position of
          the maximum -- the whole exponentiation and normalisation is dead work
          for a function that returns only an index. An entire helper and a full
          pass over a million elements disappear. Note the initial value has to
          change from `0` to `-inf`, because logits can be negative where
          probabilities cannot: the simplification is only correct with that
          adjustment, and getting it wrong makes the repair silently wrong on
          all-negative input.
      - title: a cheap pre-check settles the common case
        before: |
          def looks_numeric(text):
              return re.fullmatch(r"-?\d+(\.\d+)?", text) is not None
        after: |
          def looks_numeric(text):
              stripped = text[1:] if text[:1] == "-" else text
              if not stripped or not stripped[0].isdigit():
                  return False
              return re.fullmatch(r"-?\d+(\.\d+)?", text) is not None
        note: >
          The regex still decides every accepted string; the pre-check only
          rejects the ones that cannot possibly match, and it costs two
          comparisons where entering the matcher costs far more. Included because
          it sits exactly on the boundary with C4.S7 -- it *is* a guard -- and the
          reason it is arguably C7.S5 is that the general operation is left intact
          for everything it can still decide. Either label is defensible; say
          which you chose.
  patch_shape: expression
  measurability: scales_with_input
  min_workload_hint: >
    when the simplification removes per-element work, size on the element count;
    when it removes a whole stage, almost any realistic input shows it
  discriminators:
    - vs: C4.S7
      rule: >
        C7.S5 makes the operation cheaper for *every* input, with no branch added.
        C4.S7 adds a *guard* that skips the operation for some inputs.  Branch
        added: C4.S7.  Operation changed: C7.S5.  When one edit does both, say
        which you picked.
    - vs: C1.S5
      rule: >
        The closest neighbour, and the softmax example sits between them.  C1.S5
        is work whose *result is never consumed at all*.  C7.S5 is work whose
        result is consumed but whose cost was not needed to produce the answer.
        If deleting the statement leaves the code correct with no other change,
        it is C1.S5.
    - vs: C4.S2
      rule: >
        C4.S2 deletes a *test* whose answer was determined.  C7.S5 changes an
        *operation* using a fact about the values.  No branch is removed here.
    - vs: C7.S4
      rule: >
        C7.S4 keeps both operations and reorders them.  C7.S5 makes one cheaper or
        removes it outright.
