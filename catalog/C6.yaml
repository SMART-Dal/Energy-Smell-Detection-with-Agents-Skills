- id: C6.S1
  signals:
    - expensive_comparison
    - ruff_C408
    - ruff_RUF005
  in_one_line: |
    objects created and thrown away that never needed to exist
  look_for: |
    Objects created on a per-iteration or per-element path whose only use is to be read once and dropped: a `dict(host=..., port=i)` constructor call where a `{...}` literal builds the same dict without the global lookup and the call; a scratch list created afresh on every pass that one list, cleared each pass, could serve; two sorted copies, two sets or two joined strings built only to answer one `==`. Each costs an allocation, reference counting and the collector's attention, so the cost follows their number, not their size.
  refactoring:
    summary: create fewer objects -- reuse one, or use a literal, or do not create it at all
  repairs:
    - case: C6S1_constructor_versus_literal
      note: |
        `dict(...)` is a global lookup plus a call plus keyword packing; the literal is a single bytecode.
    - case: C6S1_intermediate_container
      note: |
        One list of N integers is never built. For a short pipeline the list can cost less than the generator, because resuming the generator costs more per element than the allocation saves.
    - case: C6S1_list_cleared_not_rebuilt
      note: |
        The precondition is what makes reuse legal: the scratch list never escapes the iteration that filled it.
    - case: C6S1_unnecessary_object
  not_this:
    - source: lookalike:C6S1_lookalike
      why: |
        Each per-iteration list is appended to `groups`, so the caller keeps every one; a single reused buffer makes all the entries the same object, and `.clear()` empties them all at once. Reuse is safe only when nothing stores, returns, yields or closes over the object.
  similar:
    - C3.S3
    - C5.S4
    - C6.S2
    - C10.S4
    - C10.S6
- id: C6.S2
  signals:
    - copy_in_loop
  in_one_line: |
    data duplicated when the original could have been used or changed in place
  look_for: |
    Data duplicated where the original would serve: `sorted(values)` where `values.sort()` would do; `out = out + group`, which builds a new list of everything accumulated so far on every pass, where `out.extend(group)` grows the one list; a `list(r)` copy before a read-only access; `.copy()` or `copy.deepcopy` of the same template on every iteration; a temporary name to swap two values. A container copy walks the source and allocates one of the same size. Whether a copy is needed depends on who reads the original afterwards.
  refactoring:
    summary: use a reference, a view, a slice or an in-place operation instead of copying
  repairs:
    - case: C6S2_concat_versus_extend
    - case: C6S2_sorted_versus_sort
      note: |
        Available only if `values` is this object's own list and no caller depends on its order. The return value is identical and the argument's state is not, so set `"equivalence": "returns_only"` in the submission with the reason.
    - case: C6S2_unnecessary_copy
      note: |
        Read-only traversal, no mutation anywhere, so the copy is a full pass and an allocation buying nothing.
    - case: C6S2_tuple_swap
      note: |
        CPython special-cases the tuple form into a stack rotation with no tuple at all; the three-statement form is three stores and a name that exists only to hold a reference for one bytecode.
  not_this:
    - source: lookalike:C6S2_lookalike
      why: |
        The function sorts a copy to answer one question and then reads `batch` in the caller's order to answer another; sorting in place silently changes the second answer. A copy is unnecessary only when nothing reads the original afterwards.
    - title: the copy is updated and kept
      source: rule:copy_in_loop/refresh_scratch
      code: |
        def refresh_scratch(rows, defaults):
            out = []
            for row in rows:
                current = defaults.copy()
                current.update(row)
                out.append(current)
            return out
      tempting: |
        def refresh_scratch(rows, defaults):
            out = []
            for row in rows:
                current = defaults
                current.update(row)
                out.append(current)
            return out
      why: |
        `update` then writes every row into the caller's `defaults`, and every entry of `out` is that one dict, holding whatever the rows left in it.
    - title: the copy snapshots a value that keeps changing
      source: catalog
      code: |
        def prefixes(items):
            current = []
            out = []
            for item in items:
                current.append(item)
                out.append(current[:])
            return out
      tempting: |
        def prefixes(items):
            current = []
            out = []
            for item in items:
                current.append(item)
                out.append(current)
            return out
      why: |
        `current` is mutated after it is stored, so without the copy every entry of `out` is the same list and all of them end up holding every item.
  similar:
    - C3.S7
    - C5.S4
    - C6.S1
    - C6.S3
- id: C6.S3
  signals:
    - eager_comprehension
    - redundant_materialisation
    - whole_file_read
    - ruff_C400
    - ruff_C401
    - ruff_C402
    - ruff_C419
    - ruff_RUF015
  in_one_line: |
    a whole sequence built in memory when the consumer wanted it one element at a time
  look_for: |
    A whole sequence built in memory for a consumer that takes one element at a time: a list comprehension handed straight to `sum`, `any` or `zip`; a file loaded with `.read().splitlines()`, `.read().split("\n")` or `.readlines()` and then walked line by line. The eager form allocates a container holding every element, so peak memory grows with the input, which for a file is its whole size; when the consumer can stop early, as `any` does, it also computes every element after the stopping point.
  refactoring:
    summary: produce the sequence lazily when it is consumed once and never indexed
  repairs:
    - case: C6S3_stream_a_file
      note: |
        The eager version's peak memory is the file size and the lazy version's is one line, and streaming also removes the `splitlines` pass and its list of every line.
    - case: C6S3_consumer_stops_early
      note: |
        Two savings at once: nothing is allocated, and `any` returns at the first match instead of scanning everything.
    - case: C6S3_genexp_to_list
      note: |
        A generator expression resumes a frame per element, in exchange for the allocation it saves.
  not_this:
    - source: lookalike:C6S3_lookalike
      why: |
        The consumer sums the weights and then needs their count; a generator has no length, and the second pass finds it exhausted and reports zero. Anything that reads the result twice -- `len`, a second reduction, indexing, a second loop -- needs the list.
    - title: two lists compared by `min`
      source: rule:eager_comprehension/shorter_boundary
      code: |
        def shorter_boundary(polygon_a, polygon_b):
            return min([p.x for p in polygon_a], [p.x for p in polygon_b])
      tempting: |
        def shorter_boundary(polygon_a, polygon_b):
            return min((p.x for p in polygon_a), [p.x for p in polygon_b])
      why: |
        With two arguments `min` compares the two lists as values; a generator cannot be ordered against a list, so the call raises `TypeError`.
    - title: the split is on paragraphs, not lines
      source: rule:whole_file_read/parse_paragraphs
      code: |
        def parse_paragraphs(doc_handle):
            return doc_handle.read().split("\n\n")
      tempting: |
        def parse_paragraphs(doc_handle):
            return [line for line in doc_handle]
      why: |
        Iterating a file yields single lines, so the result changes from a list of paragraphs to a list of lines.
    - title: the rows are read before the file closes
      source: catalog
      code: |
        def read_rows(path):
            with open(path) as handle:
                return [line.strip() for line in handle]
      tempting: |
        def read_rows(path):
            with open(path) as handle:
                return (line.strip() for line in handle)
      why: |
        The `with` closes the file as the function returns, so the first `next()` on the generator raises `ValueError: I/O operation on closed file`; the eager list is what reads the rows while the source is open.
  similar:
    - C3.S6
    - C6.S2
    - C9.S2
- id: C6.S4
  in_one_line: |
    something long-lived holding far more data than anything later reads
  look_for: |
    Something that holds data -- a cache, an instance attribute, a list of kept rows -- retaining whole objects when the code that reads it consults only an identifier, one field or a total: a dict caching whole records whose ids alone are summed, `dict(row)` copies of every field when only `"id"` is read, an object keeping its rows only to sum them later. Every retained object stays allocated, and the collector traverses it, for as long as the holder lives. Read the code that reads the retained data.
  refactoring:
    summary: retain the smallest thing that answers the later question
  repairs:
    - case: C6S4_cache_holds_whole_objects
    - case: C6S4_summary_instead_of_source
      note: |
        Summing at construction retains one number instead of the rows, but it moves the work earlier and makes it unconditional, so it is wrong if `headline` is often not called.
    - case: C6S4_oversized_retaining
    - case: C6S4_fields_never_read
      note: |
        The repair projects at the point of retention rather than at the point of use, which is why it is this root cause and not C9.S2: nothing crosses a process boundary.
  not_this:
    - title: a later reader needs the whole object
      source: catalog
      code: |
        class Deduplicator:
            def __init__(self):
                self._seen = {}

            def is_duplicate(self, doc):
                return doc.checksum in self._seen

            def add(self, doc):
                self._seen[doc.checksum] = doc

            def original_of(self, doc):
                return self._seen[doc.checksum]
      tempting: |
        class Deduplicator:
            def __init__(self):
                self._seen = set()

            def is_duplicate(self, doc):
                return doc.checksum in self._seen

            def add(self, doc):
                self._seen.add(doc.checksum)

            def original_of(self, doc):
                return self._seen[doc.checksum]
      why: |
        `original_of` hands back the stored document, which a set of checksums cannot do, so it raises `TypeError`. Retaining the identifier alone is valid only when nothing reads the cached values.
  similar:
    - C5.S3
    - C6.S5
    - C6.S7
    - C11.S3
    - C12.S2
- id: C6.S5
  in_one_line: |
    capacity reserved up front for data that never arrives
  look_for: |
    Capacity reserved up front that the input does not fill: a list multiplied out to a fixed length, or a `bytearray` sized for the worst case on every call, then sliced down to what was written. The whole reservation is allocated and zero-filled whatever the input size, so the work follows the declared size rather than the data. Python's own containers grow as needed without a hint, so the tell is an explicit size.
  refactoring:
    summary: size the buffer to the workload, or let the container grow
  repairs:
    - case: C6S5_over_allocation
    - case: C6S5_worst_case_bytearray
      note: |
        The original allocates and zeroes the whole reserve whatever the input size.
    - case: C6S5_presized_versus_grown
      note: |
        A container that grows dynamically reallocates and copies, and doing that repeatedly can cost more than the pre-sizing did.
  not_this:
    - title: a size fixed by the protocol
      source: catalog
      code: |
        buffer = bytearray(65536)
        received = sock.recv_into(buffer)
      tempting: |
        buffer = bytearray(1024)
        received = sock.recv_into(buffer)
      why: |
        The buffer is sized for the largest datagram the protocol allows, and `recv_into` reads at most `len(buffer)` bytes, so a smaller buffer truncates the large messages.
  similar:
    - C1.S6
    - C6.S4
- id: C6.S6
  signals:
    - unmanaged_resource
    - ruff_SIM115
  in_one_line: |
    a file, socket or connection acquired with nothing guaranteeing its release
  look_for: |
    An `open`, `Path(...).open()` or database `cursor()` whose release is neither prompt nor guaranteed: a handle bound to a name, read, and abandoned to the collector; a trailing `.close()` that an exception before it would skip; every handle of a batch held open until the batch ends. CPython's reference counting usually closes an abandoned handle quickly, but not while a traceback keeps the frame alive, not inside a reference cycle, and not on interpreters that do not count references. Each open handle holds a descriptor until it is released.
  refactoring:
    summary: acquire the resource in a `with` statement so it closes deterministically
  repairs:
    - case: C6S6_handles_without_with
      note: |
        On CPython the original closes almost immediately when the refcount drops, which is why it survives review. It stops closing promptly the moment something on the path raises and the frame is captured in a traceback, or the moment the code runs anywhere without refcounting.
    - case: C6S6_leaked_handle
    - case: C6S6_prompt_release
      note: |
        Both variants close every handle: `before` holds all of them open until the end of the call, `after` releases each as soon as it is done.
  not_this:
    - source: lookalike:C6S6_lookalike
      why: |
        The handle is the return value; a `with` around the `open()` closes it before the caller reads, which raises `ValueError: I/O operation on closed file`. A handle that is returned, stored, pooled or yielded belongs to its owner, and the `with` goes there.
  similar:
    - C6.S7
    - C11.S3
- id: C6.S7
  signals:
    - mutable_default_argument
  in_one_line: |
    a mutable default argument that quietly accumulates across every call
  look_for: |
    A mutable object as a parameter default -- `[]`, `{}`, `set()`, `Counter()`, `defaultdict(list)`, a comprehension -- that the body mutates by appending, adding or filling. The default is evaluated once, when the `def` runs, and every call that omits the argument shares that one object, so whatever one call leaves in it is there for the next. The object grows for the life of the process, and any work that depends on its size grows with it.
  refactoring:
    summary: default to `None` and create the mutable object inside the body
  repairs:
    - case: C6S7_default_is_the_cache
    - case: C6S7_mutable_default
      note: |
        A scratch buffer cleared on every call is the one shape where the default does not leak, so the repair is equivalent: both variants return the same list every time and only the allocation differs.
    - case: C6S7_default_only_read
      note: |
        The body only reads the default, so nothing accumulates; the `None` default plus a guard costs a comparison on every call while saving nothing.
  not_this:
    - title: the shared default is a memo, kept on purpose
      source: catalog
      code: |
        def fib(n, memo={0: 0, 1: 1}):
            if n not in memo:
                memo[n] = fib(n - 1, memo) + fib(n - 2, memo)
            return memo[n]
      tempting: |
        def fib(n, memo=None):
            if memo is None:
                memo = {0: 0, 1: 1}
            if n not in memo:
                memo[n] = fib(n - 1, memo) + fib(n - 2, memo)
            return memo[n]
      why: |
        The dict is shared across calls on purpose, as a cache; with a fresh one per call, every top-level call recomputes from scratch what earlier calls had already stored.
  similar:
    - C6.S4
    - C6.S6
