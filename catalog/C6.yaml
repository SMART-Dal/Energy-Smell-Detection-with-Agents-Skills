  - C6.S4
- id: C6.S6
  signals:
  - unmanaged_resource
  - ruff_SIM115
  in_one_line: |
    a file, socket or connection acquired with nothing guaranteeing its release
  what_to_look_for: |
    An operating-system resource is held until something releases it.  CPython's reference counting usually releases it promptly when the last reference goes, which is why the sloppy form so often works -- but "usually" is doing a lot of work here: a reference caught in a cycle waits for the collector, an exception on the path leaves the handle bound in a traceback, and other implementations do not refcount at all.  Look for an acquisition -- `open`, `socket`, `connect`, `cursor` -- bound to a name rather than acquired in a `with` header, and then look for what releases it, because a `.close()`, a `try`/`finally` or a later `with` that adopts the handle are all release and reporting one of them is the commonest false positive here.  The failure path is the real question: not whether it closes but whether it closes when the code between raises, which is what a `with` guarantees and a trailing `.close()` does not.  Ownership decides the rest -- a handle returned, yielded, stored on `self` or given to an `ExitStack` belongs to someone else, and closing it here would be a bug.  The energy cost of one open handle is small; the cost of exhausting a descriptor table or a connection pool is a failure mode rather than a slowdown, so volume is what makes this worth reporting.
  not_a_smell_when:
  - |
    the handle is closed deterministically by a `.close()`, a `finally`, or a later `with` that adopts it
  - |
    ownership is deliberately handed over -- returned, yielded, stored on the instance, given to an `ExitStack`
  - |
    the resource is meant to live for the process, such as a module-level log handle
  - |
    it is a one-shot script where the interpreter's exit closes everything anyway
  counter_examples:
  - code: |
      def open_log(path):
          handle = open(path, "a", encoding="utf-8")
          handle.write("--- session start\n")
          return handle
    why: |
      No `with` and no `close`, and correct: the handle is returned, so the caller owns it and closing it here would break every caller. A factory that opens and returns is ordinary library code, and this is the shape that makes a bare search for `open` without `with` so unreliable.
  - code: |
      handle = open(path, "wb")
      with handle as f:
          f.write(payload)
    why: |
      The acquisition is not in the `with` header, so a rule looking for that shape reports it -- and the `with` on the next line adopts the handle and closes it. NumPy writes exactly this in several modules. Read the following lines before claiming.
  refactoring:
    summary: acquire the resource in a `with` statement so it closes deterministically
    examples:
    - title: a handle abandoned to the collector
      before: |
        _PATHS = []


        def before(count):
            total = 0
            for path in _PATHS[:count]:
                handle = open(path, encoding="utf-8")     # never closed explicitly
                total += len(handle.read())
            return total
      after: |
        _PATHS = []


        def after(count):
            total = 0
            for path in _PATHS[:count]:
                with open(path, encoding="utf-8") as handle:
                    total += len(handle.read())
            return total
      note: |
        On CPython the original closes almost immediately when the refcount drops, which is why it survives review. It stops closing promptly the moment `json.loads` raises and the frame is captured in a traceback, or the moment the code runs anywhere without refcounting. The repair also drops the intermediate string, which is C6.S3.

        Measured in `validation/taxonomy/C6S6_handles_without_with.py`.
    - title: one handle per iteration
      before: |
        def before(paths):
            total = 0
            for p in paths:
                f = open(p)
                total += len(f.read())
                f.close()
            return total
      after: |
        def after(paths):
            total = 0
            for p in paths:
                with open(p) as f:
                    total += len(f.read())
            return total
      note: |
        The loop opens a descriptor per input and only drops the previous one when `part` is rebound. With enough inputs this exhausts the process's descriptor limit -- a failure rather than a slowdown, which is how most of this root cause's real instances present.

        Measured in `validation/taxonomy/C6S6_leaked_handle.py`.
    - title: every handle held open until the end of the batch
      before: |
        from contextlib import ExitStack


        _PATHS = []


        def before(count):
            total = 0
            with ExitStack() as stack:
                for path in _PATHS[:count]:
                    handle = stack.enter_context(open(path, encoding="utf-8"))
                    total += len(handle.read())      # every handle stays open until the end
            return total
      after: |
        _PATHS = []


        def after(count):
            total = 0
            for path in _PATHS[:count]:
                with open(path, encoding="utf-8") as handle:
                    total += len(handle.read())      # released immediately
            return total
      note: |
        When the handle is released, not
        whether.

        Both variants close every handle, so this isolates the one thing a paired
        comparison can see: `before` holds all of them open until the end of the call,
        `after` releases each as soon as it is done. The card says the energy cost of
        one open handle is small and the cost of exhausting a descriptor table is a
        failure mode rather than a slowdown -- so a reading near zero here is the card
        being right, and the finding it should report is the descriptor count.

        Measured in `validation/taxonomy/C6S6_prompt_release.py`.
  patch_shape: statement_local
  measurability: constant_small
  notes: |
    Report this as a correctness and robustness finding with an energy consequence, not as a measured saving.  On CPython the repaired and unrepaired versions usually close at the same moment, so a paired energy comparison measures nothing and refuting it would be the wrong conclusion -- the claim is about what happens on the failure path and at scale, which the harness does not exercise.
  similar:
  - C6.S7
  - C11.S3
- id: C6.S7
  signals:
  - mutable_default_argument
  - ruff_B006
  in_one_line: |
    a mutable default argument that quietly accumulates across every call
  what_to_look_for: |
    A default argument is evaluated once, when the `def` runs, and the resulting object is stored on the function and shared by every call that does not supply its own.  For an immutable default that is invisible.  For a `[]`, `{}`, `set()` or a constructed instance it means the same object accumulates across calls: memory grows without bound for the process lifetime, and any operation whose cost depends on the container's size gets slower with every call that touched it.  So the energy cost is a consequence of a correctness bug rather than a separate thing -- the function does more work each time because it is carrying every previous call's data -- and the honest finding states the growth rate rather than an energy figure.  Two things decide whether it is live: whether the body actually mutates it, and whether callers ever omit the argument.  And check whether the accumulation is load-bearing before removing it, because a memo built accidentally in a default argument works, and replacing it with `None` silently deletes a cache.
  not_a_smell_when:
  - |
    the default is immutable -- a number, a string, a tuple, `None`, a frozenset
  - |
    the default is never mutated by the body, only read
  - |
    the shared object is deliberate, as a memo or a registry, and the sharing is documented rather than accidental
  - |
    the parameter is annotated and enforced such that the default is unreachable
  counter_examples:
  - code: |
      def render(items, separator=", ", limits=(0, 100)):
          return separator.join(str(i) for i in items[limits[0]:limits[1]])
    why: |
      Two defaults, both immutable. A tuple default is shared too and it does not matter, because nothing can change it. The rule is about mutability, not about defaults.
  - code: |
      def fib(n, memo={0: 0, 1: 1}):
          if n not in memo:
              memo[n] = fib(n - 1, memo) + fib(n - 2, memo)
          return memo[n]
    why: |
      A mutable default that is mutated -- and the sharing across calls is exactly the point, which is what makes it fast. Replacing it with `None` and rebuilding per call turns a linear function into an exponential one. The pattern is present and the repair would be a serious regression. (The better repair is `functools.cache`, which is C8.S1.)
  refactoring:
    summary: default to `None` and create the mutable object inside the body
    examples:
    - title: an accumulator that grows across calls
      before: |
        def _cost(n):
            total = 0
            for i in range(1, 90):
                total += (n * i) % 17
            return total


        def _shared_memo(values, memo={}):
            total = 0
            for value in values:
                hit = memo.get(value)
                if hit is None:
                    hit = memo[value] = _cost(value)
                total += hit
            return total


        def before(batches):
            return sum(_shared_memo(batch) for batch in batches)
      after: |
        def _cost(n):
            total = 0
            for i in range(1, 90):
                total += (n * i) % 17
            return total


        def _fresh_memo(values, memo=None):
            if memo is None:
                memo = {}
            total = 0
            for value in values:
                hit = memo.get(value)
                if hit is None:
                    hit = memo[value] = _cost(value)
                total += hit
            return total


        def after(batches):
            return sum(_fresh_memo(batch) for batch in batches)
      note: |
        `collect(1)`, `collect(2)`, `collect(3)` returns `[1]`, `[1, 2]`, `[1, 2, 3]` in the original -- and the list is never freed. The repaired version returns `[1]`, `[2]`, `[3]`. Note that is a *behaviour change*, and the right one: any caller relying on the accumulation was relying on a bug, but you should still check whether one does.

        Measured in `validation/taxonomy/C6S7_default_is_the_cache.py`.
    - title: a shared scratch buffer behind a default argument
      before: |
        def _shared_scratch(row, scratch=[]):
            scratch.clear()                      # reset, so nothing leaks between calls
            for i in range(row % 8):
                scratch.append(row + i)
            return len(scratch)


        def before(rows):
            return sum(_shared_scratch(row) for row in rows)
      after: |
        def _fresh_scratch(row, scratch=None):
            if scratch is None:
                scratch = []
            for i in range(row % 8):
                scratch.append(row + i)
            return len(scratch)


        def after(rows):
            return sum(_fresh_scratch(row) for row in rows)
      note: |
        What the standard repair costs.

        The previous version of this file had `acc=None` and the `if acc is None`
        guard in *both* variants: two byte-identical helpers behind two different
        names. It read -0.7%, which was the measurement of nothing.

        The obstacle it was working around is real and is the card's own point: on a
        default that genuinely accumulates, `before` and `after` do not return the same
        answers, so a paired comparison cannot be built at all. What can be measured is
        the case where the default is mutated and then reset -- a scratch buffer, which
        is the one shape where the leak does not happen and the repair is therefore
        equivalent. Both variants return the same list every time; only the allocation
        differs.

        That makes this the price of the repair rather than the price of the defect:
        `before` reuses one list and clears it, `after` builds a fresh one per call. If
        the reading is a loss, the card can say that the repair is a correctness change
        with an energy cost, which is a more honest thing to tell an agent than
        implying it saves something.

        Measured in `validation/taxonomy/C6S7_mutable_default.py`.
    - title: the default that is only ever read
      before: |
        _ALLOWED = ("read", "write", "admin")


        def _check_shared(scope, allowed=list(_ALLOWED)):
            return scope in allowed


        def before(scopes):
            return sum(1 for s in scopes if _check_shared(s))
      after: |
        _ALLOWED = ("read", "write", "admin")


        def _check_guarded(scope, allowed=None):
            if allowed is None:
                allowed = list(_ALLOWED)
            return scope in allowed


        def after(scopes):
            return sum(1 for s in scopes if _check_guarded(s))
      note: |
        A mutable default the body never mutates.

        The card's second `NOT a smell when` clause: a mutable default that is only
        read is not accumulating anything, though it is still fragile. The usual repair
        still applies mechanically -- `seen=None` plus a guard -- and it costs a
        comparison on every call while saving nothing at all.

        Expected to read at or below zero, which is the answer that stops an agent
        applying this root cause to every mutable default it sees rather than to the
        ones that grow.

        Measured in `validation/taxonomy/C6S7_default_only_read.py`.
  patch_shape: statement_local
  measurability: scales_with_calls
  min_workload_hint: |
    the effect appears only across many calls, since the container grows per call; a case file that calls the unit once measures nothing
  notes: |
    Measuring this needs care.  `before` and `after` are not equivalent by construction -- that is the finding -- so the verifier will report `not_equivalent` unless the case file compares two variants that both behave correctly and differ only in how they get there.  The honest presentation is a correctness finding whose energy consequence is unbounded growth, with the growth rate stated rather than an energy figure.
