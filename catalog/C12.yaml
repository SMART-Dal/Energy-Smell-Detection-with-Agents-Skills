- id: C12.S1
  signals:
    - column_major_traversal
  in_one_line: |
    a contiguous buffer traversed against the direction its memory is laid out in
  look_for: |
    A loop that walks a contiguous buffer across its layout: `matrix[:, j]` inside a loop over the columns of a C-ordered NumPy array, including one reached through a DataFrame's `.values`, or a row walk over a Fortran-ordered array. Each step jumps a whole row ahead, so every element lands on a different cache line and the prefetcher cannot predict the next one. Read the layout from `arr.flags` rather than assuming it, since a transpose or an `asfortranarray` upstream flips which axis is contiguous.
  refactoring:
    summary: |
      traverse along the contiguous axis, or store the array in the layout the traversal needs
  repairs:
    - case: C12S1_stride_traversal
      note: |
        Only the order the buffer is read in differs. Each slice now walks consecutive addresses, so the prefetcher is right every time.
    - case: C12S1_fortran_order
    - case: C12S1_cache_resident
    - case: C12S1_transpose_costs_a_copy
      note: |
        The column sums have to stay column sums, so the only edit left is a contiguous copy of the transpose, which reads every element once with the bad stride. It pays only when the copied layout is then traversed many times.
  not_this:
    - title: an algorithm that has to go column by column
      source: catalog
      code: |
        for j in range(grid.shape[1]):
            column = grid[:, j]
            solve_in_place(column)
      tempting: |
        for i in range(grid.shape[0]):
            row = grid[i, :]
            solve_in_place(row)
      why: |
        The algorithm works on one column at a time, so walking rows hands `solve_in_place` different data and changes the result. Only the layout can move, by creating `grid` in Fortran order where it is made.
  similar:
    - C12.S2
    - C12.S4
- id: C12.S2
  in_one_line: |
    scattered reads into a large buffer, using one element of every cache line fetched
  look_for: |
    Reads that touch a small, scattered subset of a large buffer, so each cache line fetched contributes one element and the rest is evicted unused: a NumPy array indexed by unordered indices, or one field read out of every record of a wide structured array. The addresses come from the data, so there is no loop order to fix; what can change is the order the indices are visited in, so nearby ones go together, or the density of the structure, so the wanted elements sit side by side.
  refactoring:
    summary: sort or group the accesses so nearby indices are visited together
  repairs:
    - case: C12S2_sparse_access
      note: |
        Addition is commutative, so the visiting order is free and sorting makes the reads walk forwards. Reordering a floating-point sum can change the last bits of the result, so an equivalence check needs a tolerance.
    - case: C12S2_hot_column_split
    - case: C12S2_cache_resident_scatter
      note: |
        Every line of a buffer this small is already in cache, so the sort has no misses to avoid.
  not_this:
    - title: reads whose order is the result
      source: catalog
      code: |
        for step in trajectory:
            position = advance(position, step)
            samples.append(field[position])
      tempting: |
        positions = []
        for step in trajectory:
            position = advance(position, step)
            positions.append(position)
        for position in sorted(positions):
            samples.append(field[position])
      why: |
        `samples` records the field along the path in the order it was walked; visiting the positions sorted appends the same values in a different order, which every reader of `samples` takes for a different path.
  similar:
    - C5.S3
    - C6.S4
    - C12.S1
    - C12.S4
- id: C12.S3
  in_one_line: |
    a data-dependent branch in a compiled hot loop that the CPU cannot predict
  look_for: |
    A conditional inside a tight loop whose outcome depends on the data and flips between elements with no pattern, so the processor's branch predictor guesses wrong often and throws away the work it speculated past. The repairs sort the data so each outcome arrives in one long run, or replace the branch with arithmetic such as `total += x * (x > 0)`. The predictor sees the branch directly in compiled loops -- Cython, a C extension; in interpreted Python the interpreter's work around each comparison is far larger.
  refactoring:
    summary: make the branch predictable, or replace it with branchless arithmetic
  repairs:
    - case: C12S3_unpredictable_branch
      note: |
        In CPython the interpreter's overhead may swamp the effect entirely.
    - case: C12S3_sorted_then_many_passes
      note: |
        After the sort the branch is false for one long run and then true for one long run, which any predictor handles.
    - case: C12S3_predictable_branch
      note: |
        The condition takes long runs of one outcome, which any predictor learns, so the branchless rewrite can only cost its extra arithmetic.
  not_this:
    - source: lookalike:C12S3_lookalike
      why: |
        The condition guards a division, so the branchless form evaluates `value / divisor` on every element and raises on the first zero divisor. A branch may be flattened into arithmetic only when both arms are safe to compute for every input.
    - title: a branch whose order is the meaning
      source: catalog
      code: |
        for record in records:
            if record.kind == "header":
                flush(buffer)
            buffer.append(record)
      tempting: |
        for record in sorted(records, key=lambda r: r.kind != "header"):
            if record.kind == "header":
                flush(buffer)
            buffer.append(record)
      why: |
        Each header closes the records that came before it, so the order of `records` is the data. Sorting the headers to the front makes the branch predictable and hands `flush` a different buffer every time.
  similar:
    - C4.S1
    - C4.S3
- id: C12.S4
  in_one_line: |
    a declared struct whose field order puts cold data in front of hot data
  look_for: |
    A declared memory layout that places rarely used data in front of the data read on every access. In a `ctypes.Structure`, a `struct` format or a Cython `cdef struct`, fields sit at fixed offsets in declaration order: a large cold buffer declared first pushes the hot field far from the start of every record, and small fields alternating with large ones make the compiler insert padding, so fewer records share a cache line. Read which fields are hot from the code that uses the structure.
  refactoring:
    summary: declare the hot fields first
  repairs:
    - case: C12S4_ctypes_cold_before_hot
      note: |
        The 4 KB buffer in front of `samples` means reaching it touches a line 4 KB into the structure. The repair is only available because this layout is ours: if it mirrors something a C library defines, it does not exist.
    - case: C12S4_ctypes_padding
      note: |
        Alternating one-byte and eight-byte fields pads each small field out to the next eight-byte boundary: 32 bytes for 18 bytes of data, against 24 when grouped by size. `ctypes.sizeof` gives both numbers without measuring anything.
    - case: C12S4_declaration_order
  not_this:
    - source: lookalike:C12S4_lookalike
      why: |
        The `_fields_` list mirrors a record another program wrote, so reordering the declaration does not move the bytes; every field is then read from the wrong offset. Layout is free to change only where nothing outside the process depends on it.
  similar:
    - C5.S3
    - C12.S1
    - C12.S2
