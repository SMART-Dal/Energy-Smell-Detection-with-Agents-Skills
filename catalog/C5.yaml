- id: C5.S1
  signals:
  - membership_test_on_sequence
  in_one_line: |
    a container whose type makes its most frequent operation the expensive one
  what_to_look_for: |
    A container's cost is paid per operation, and the same operation has a very different price depending on the type holding the data.  `x in lst` compares `x` against each element until one matches, so N lookups over an M-element list cost N*M comparisons where the same lookups against a set cost N hash probes.  The repair removes no work from the program's logic -- every step still happens -- it changes what one of those steps costs, which is why the saving grows with the collection size *and* with the number of operations and vanishes when either is small.  So name the operation the hot path performs most, then check whether it is the expensive one for this type: `in` is a linear scan over `list`, `tuple` and `str` and a hash probe on `set`, `dict` and `frozenset`; indexing is constant on a list and unavailable on a set; inserting or removing at the front is linear on a list and constant on a `collections.deque`; `.count()` and `.index()` are always a full scan.  The repair happens where the container is *built*, which is often another method or another file, and it is unavailable when that site belongs to a caller or a library.  Two things bound it: a set only repays its construction past roughly a dozen elements searched more than once, and the replacement has to be able to hold this data -- set and dict keys must be hashable, and a set discards both order and duplicates.
  not_a_smell_when:
  - |
    the collection is small enough that the constant factors dominate, which for membership means roughly a dozen elements or fewer
  - |
    order or duplicates are part of the answer, so a set would change what the function returns
  - |
    the elements are unhashable, so a set or dict key is not available
  - |
    the container is built once and iterated once, never searched
  - |
    the type is fixed by an API boundary -- a caller's argument or a return value other code depends on -- and you do not control both sides
  counter_examples:
  - code: |
      if request.method in ("GET", "HEAD", "OPTIONS"):
          return self._read_only(request)
    why: |
      Three constant elements. A tuple scan of three items is faster than hashing the key once, and CPython stores the tuple as a code constant so there is no per-call construction either. Size is what decides this, not the operation.
  - code: |
      seen = []
      for row in rows:
          if row.id not in seen:
              seen.append(row.id)
      return seen
    why: |
      `seen` is returned, and a list preserves first-seen order where a set does not. The membership test really is linear, but the repair is C5.S2 -- keep the list for the answer and add a set beside it for the test -- not a change of this container's type.
  refactoring:
    summary: swap the container type at its construction site
    examples:
    - title: the construction site is next to the loop
      before: |
        def before(haystack, needles):
            return [n for n in needles if n in haystack]
      after: |
        def after(haystack, needles):
            lookup = set(haystack)
            return [n for n in needles if n in lookup]
      note: |
        One line moves. `allowed` is built once and searched once per request, so the hashing pass is paid once and every lookup after it is constant instead of linear in the number of scopes.

        Measured in `validation/taxonomy/C5S1_membership_list.py`.
    - title: the construction site is in another method
      before: |
        class BeforeRouter:
            __slots__ = ("blocked",)

            def __init__(self, paths):
                self.blocked = list(paths)

            def handle(self, requests):
                return sum(1 for r in requests if r not in self.blocked)


        def before(paths, requests):
            return BeforeRouter(paths).handle(requests)
      after: |
        class AfterRouter:
            __slots__ = ("blocked",)

            def __init__(self, paths):
                self.blocked = set(paths)

            def handle(self, requests):
                return sum(1 for r in requests if r not in self.blocked)


        def after(paths, requests):
            return AfterRouter(paths).handle(requests)
      note: |
        The waste is visible in `handle` and fixable only in `__init__`. That is normal, and it is still one repair: read outward until you find where the container is built. Before editing, check every other use of `self.blocked` -- anything that indexes it or depends on its order has to change too, and if something does, this is the wrong repair.

        Measured in `validation/taxonomy/C5S1_built_in_another_method.py`.
    - title: the operation is not membership
      before: |
        def before(pending):
            order = []
            while pending:
                order.append(pending.pop(0))
            return len(order)
      after: |
        from collections import deque


        def after(pending):
            queue = deque(pending)
            order = []
            while queue:
                order.append(queue.popleft())
            return len(order)
      note: |
        `list.pop(0)` moves all n-1 remaining elements down one slot, so draining a list this way is quadratic in its length. A `deque` pops from either end in constant time. Same root cause, different operation -- which is why the operation has to be named before the container is judged.

        Measured in `validation/taxonomy/C5S1_pop_front_deque.py`.
    - title: the set rebuilt for a single probe, which pays for nothing
      before: |
        def before(rows):
            kept = 0
            for value, allowed in rows:
                if value in allowed:
                    kept += 1
            return kept
      after: |
        def after(rows):
            kept = 0
            for value, allowed in rows:
                if value in set(allowed):
                    kept += 1
            return kept
      note: |
        The set has to be
        rebuilt for every lookup it serves.

        `x in list` is O(n) and `x in set` is O(1); `C5S1_membership_list` measures the
        repair at +99.2%. The asymptotics are not in doubt.

        The container here is per-row data, six elements long, and it is consulted once.
        Converting it costs six hashes and an allocation to replace at most six
        comparisons -- and the six comparisons stop at the first hit. The complexity
        argument holds for the number of lookups per container, and here that number is
        one.

        Read the ratio before the container: a set pays off over a list when it is built
        once and probed many times. Built once and probed once, it is strictly more
        work, whatever the length.

        Measured in `validation/taxonomy/C5S1_set_built_per_probe.py`.
    - title: a heap where the whole collection is wanted in order
      before: |
        import heapq


        def before(occurrences):
            heap = []
            for item, count in occurrences:
                heapq.heappush(heap, (item, count))
            out = []
            while heap:
                item, count = heapq.heappop(heap)
                out.extend([item] * count)
            return out
      after: |
        def after(occurrences):
            out = []
            for item, count in sorted(occurrences, key=lambda pair: pair[0]):
                out.extend([item] * count)
            return out
      note: |
        A heap built and then drained
        completely.

        From Javad's ImproperDataStructure/BuildSortedListBasedOnOccurence, where the
        refactoring replaces `heapq` with `sorted`.

        A heap is the right container when the question is "the smallest one", asked a
        few times against a collection that keeps changing. Draining it to empty asks
        for every element in order, which is a sort -- done as N interpreted
        `heappush` calls and N interpreted `heappop` calls, each of which sifts through
        log N Python-level comparisons. `sorted` does the whole thing in one C call.

        Same elements, same order out. What changes is whether the ordering work happens
        in the interpreter or under it, and the card's own test -- which operation does
        the hot path actually perform -- is what separates the two.

        Measured in `validation/taxonomy/C5S1_heap_for_a_full_sort.py`.
    - title: records as dicts where the field read is the hot operation
      before: |
        def before(rows):
            total = 0
            for row in rows:
                total += row["id"] + row["score"]
            return total
      after: |
        from collections import namedtuple


        Record = namedtuple("Record", ("id", "name", "score"))


        def after(rows):
            records = [Record(r["id"], r["name"], r["score"]) for r in rows]
            total = 0
            for record in records:
                total += record.id + record.score
            return total
      note: |
        Records as dicts, read as fields.

        The taxonomy's own second example for this root cause, which had no
        implementation: "storing records as dicts of dicts when a list of namedtuples
        would provide faster attribute access and lower memory overhead".

        The other measured files in this root cause change the container to change the
        cost of *membership* or of *popping*. This one changes it to change the cost of
        a field read: a dict lookup hashes the key string and probes a table, where a
        namedtuple field is a fixed index into a tuple resolved at class creation.

        The memory half of the claim is the larger one and is not what the window
        measures: a namedtuple carries no per-instance dict, so a million records is
        tens of megabytes rather than hundreds. The reading here is the access cost
        alone, and the card should say so rather than claim both.

        Measured in `validation/taxonomy/C5S1_dicts_versus_namedtuples.py`.
  patch_shape: expression
  measurability: scales_with_input
  min_workload_hint: |
    both the collection and the number of operations must be large; a three-element list beats a set, and one lookup never repays building one
  similar:
  - C3.S4
  - C4.S3
  - C5.S2
  - C5.S3
  - C7.S1
- id: C5.S2
  in_one_line: |
    a collection searched again and again where one index built beside it would answer every question
  what_to_look_for: |
    An index turns repeated search into arithmetic.  Scanning an n-element collection to answer each of m questions costs n*m comparisons; building a dict from it costs n hashes once and answers each question in constant time, for n + m in total.  So look for a collection searched more than once with a different key each time -- as a loop, a `next(... for ...)`, an `in`, an `.index()` or a `.count()` -- and count the lookups, because m of one makes the index strictly more work than the scan it replaces.  What defines this root cause rather than a change of container type is that the original collection is still needed as it is: for its order, its duplicates, or because it is what the function returns.  Two structures exist afterwards rather than one changed one.  The index has to be built where the data arrives and read where the question is asked, so this repair routinely spans two methods -- and building one on an object creates an obligation, since anything that mutates the underlying collection afterwards invalidates it. Check the key is hashable and is what every search actually looks up: a range overlap, a prefix or a fuzzy comparison has no hash index.
  not_a_smell_when:
  - |
    the collection is mutated between lookups, so the index would need rebuilding and the rebuild costs as much as the scans
  - |
    there are only a handful of lookups, so building the index is the larger of the two costs
  - |
    the lookup key is unhashable, or the match is not equality -- a range overlap, a prefix, a fuzzy comparison -- so no hash index answers it
  - |
    the collection is small and the code is clearer as a scan
  counter_examples:
  - code: |
      def find_owner(users, email):
          return next((u for u in users if u.email == email), None)
    why: |
      One lookup. The scan touches at most n elements; building a dict touches all n and then does one probe. An index here is a pure loss. The same code called inside a loop over many addresses is the smell.
  - code: |
      def assign(tasks, workers):
          for task in tasks:
              free = next(w for w in workers if w.load < w.capacity)
              free.load += 1
              free.queue.append(task)
    why: |
      A repeated scan of one collection inside a loop, which is the shape -- and the loop body changes what the scan would find. An index built before the loop is stale after the first assignment, and the predicate is a comparison between two fields rather than an equality on a key, so there is nothing to hash on either. Both halves of the precondition fail at once. The repair here is a heap ordered by remaining capacity, which is C7.S1.
  refactoring:
    summary: build a lookup index once, then query it
    examples:
    - title: the scan is inside the loop that needs it
      before: |
        def before(rows, queries):
            out = []
            for q in queries:
                for name, value in rows:
                    if name == q:
                        out.append(value)
                        break
            return out
      after: |
        def after(rows, queries):
            index = dict(rows)
            return [index[q] for q in queries if q in index]
      note: |
        len(orders) scans of len(customers) elements become one pass over `customers` plus one hash probe per order.

        Measured in `validation/taxonomy/C5S2_missing_index.py`.
    - title: the original collection is still needed
      before: |
        def before(rows):
            kept = []
            for row in rows:
                if row not in kept:
                    kept.append(row)
            return kept
      after: |
        def after(rows):
            kept = []
            seen = set()
            for row in rows:
                if row not in seen:
                    seen.add(row)
                    kept.append(row)
            return kept
      note: |
        `kept` stays a list because the function returns it and first-seen order matters. The set exists only to answer the membership question. Two structures afterwards rather than one changed one is exactly what separates this from C5.S1.

        Measured in `validation/taxonomy/C5S2_set_beside_the_list.py`.
    - title: the index belongs to the object, not to the call
      before: |
        class BeforeCatalog:
            __slots__ = ("products",)

            def __init__(self, products):
                self.products = products

            def price_of(self, sku):
                for product in self.products:
                    if product[0] == sku:
                        return product[1]
                raise KeyError(sku)


        def before(products, skus):
            catalog = BeforeCatalog(products)
            return sum(catalog.price_of(s) for s in skus)
      after: |
        class AfterCatalog:
            __slots__ = ("products", "_by_sku")

            def __init__(self, products):
                self.products = products
                self._by_sku = {p[0]: p[1] for p in products}

            def price_of(self, sku):
                try:
                    return self._by_sku[sku]
                except KeyError:
                    raise KeyError(sku) from None


        def after(products, skus):
            catalog = AfterCatalog(products)
            return sum(catalog.price_of(s) for s in skus)
      note: |
        Two methods change, and that is still one repair -- an index has to be built where the data arrives and read where the question is asked. It also creates an obligation: `self.products` must not be mutated afterwards without the index being updated. If anything mutates it, say so and reject.

        Measured in `validation/taxonomy/C5S2_index_on_the_object.py`.
  patch_shape: structural
  measurability: scales_with_input
  min_workload_hint: |
    the driver must perform many lookups, not one; the effect lives in the ratio of lookups to collection size
  similar:
  - C3.S4
  - C5.S1
  - C8.S1
- id: C5.S3
  signals:
  - float_literal_on_int_data
  - constant_sequence_literal
  in_one_line: |
    a representation heavier than the data it holds actually requires
  what_to_look_for: |
    A heavier representation costs on three axes at once: bytes per instance, the allocation and collection of those bytes, and the work the interpreter does to operate on them.  A float multiply is not a slower integer multiply -- it converts the operand, takes a different execution path and allocates a new float for the result, which this project measured at 39% on integer data.  An instance with a `__dict__` is a second heap object per instance and a dict lookup per attribute read, where `__slots__` or a `namedtuple` is neither.  A list literal inside a function is built element by element on every call, where a tuple of the same constants is stored once in the code object and merely loaded.  So name the capability the heavier type provides -- fractional values, mutability, arbitrary attributes, named fields -- and then go and find whether anything uses it, here or anywhere else.  A tuple returned to a caller that appends to it is a bug rather than a repair. Check the value's history too: a number that arrives as a float is already a float, and changing a literal beside it changes nothing.  The saving is a small fixed amount per instance or per operation, so it needs volume before it is measurable at all.
  not_a_smell_when:
  - |
    the extra capability is used somewhere, even if not in the unit you are reading
  - |
    the heavier type is required at an API boundary, by a library, or by a serialisation format
  - |
    so few instances exist that the per-instance overhead is irrelevant
  - |
    the lighter type would lose precision or range the data actually uses
  - |
    the container is mutated after construction
  counter_examples:
  - code: |
      def scale(values, factor):
          return [v * factor for v in values]
    why: |
      There is no literal to change. Whether this multiplies in integers or floats is the caller's decision, and the measured repair -- `v * 3.0` written where `v * 3` would do -- has nothing to apply to. The float path is only waste when this code chose it and did not need it.
  - code: |
      def defaults():
          return ["stdout", "stderr"]
    why: |
      The list is returned, and a caller that appends to it breaks against a tuple. The per-call rebuild is real; the repair is unavailable unless you can see every caller.
  refactoring:
    summary: use the lightest representation the data actually requires
    examples:
    - title: a float literal on integer data
      before: |
        def before(xs):
            return [x * 3.0 for x in xs]
      after: |
        def after(xs):
            return [x * 3 for x in xs]
      note: |
        Measured **+39.0% ± 0.5** over a million integers against a 1.2% noise floor -- far more than a "one bytecode" intuition predicts, because each multiply converts the int, runs float arithmetic and allocates a float object, and the integer path does none of it. Valid only when the caller does not depend on getting floats back.

        Measured in `validation/taxonomy/C5S3_float_literal.py`.
    - title: a constant sequence rebuilt on every call
      before: |
        def before(n):
            total = 0
            for i in range(n):
                types = ["red", "blue", "green"]
                total += len(types[i % 3])
            return total
      after: |
        def after(n):
            total = 0
            for i in range(n):
                types = ("red", "blue", "green")
                total += len(types[i % 3])
            return total
      note: |
        A list display is constructed element by element on every call; a tuple of constants is folded into the function's constant pool and loaded in one instruction. The effect is per call, so it needs a genuinely hot function -- and it is only available because `types` is local, never mutated and never escapes.

        Measured in `validation/taxonomy/C5S3_tuple_constant.py`.
    - title: instances that need no per-instance dictionary
      before: |
        class Plain:
            def __init__(self, key, value):
                self.key = key
                self.value = value


        def before(n):
            rows = [Plain(i, i * 2) for i in range(n)]
            return sum(r.key + r.value for r in rows)
      after: |
        class Slotted:
            __slots__ = ("key", "value")

            def __init__(self, key, value):
                self.key = key
                self.value = value


        def after(n):
            rows = [Slotted(i, i * 2) for i in range(n)]
            return sum(r.key + r.value for r in rows)
      note: |
        `__slots__` replaces the per-instance dict with fixed offsets: less memory per instance and a faster attribute read. It also forbids attributes the class did not declare, and breaks anything relying on `__dict__` or on multiple inheritance from another slotted class. Check for those before claiming it.

        Measured in `validation/taxonomy/C5S3_slots_versus_dict.py`.
    - title: a set chosen where nothing is ever looked up
      before: |
        def before(values, floor):
            kept = set()
            for value in values:
                if value > floor:
                    kept.add(value)
            return sorted(kept)
      after: |
        def after(values, floor):
            kept = []
            for value in values:
                if value > floor:
                    kept.append(value)
            return sorted(kept)
      note: |
        A set used only to collect.

        From Javad's BuiltInBehavior/GreaterThanK1 and UniqueDivisbleByK1, where the
        accumulator is a `set` and every element added to it is already distinct.

        A set costs a hash and a probe on every `add` in exchange for deduplication and
        O(1) membership. This loop never asks about membership, and the values are
        distinct by construction -- they are derived from an index -- so the
        deduplication has nothing to remove. `list.append` writes a pointer.

        Both variants return the same sorted list, so the deduplication genuinely is
        dead weight rather than a difference the caller could see. The card's test is
        which operations the container's cost is buying, and an accumulator that is
        never probed and never collides is buying neither of a set's two properties.

        Measured in `validation/taxonomy/C5S3_set_never_probed.py`.
    - title: a one-character string where a character code would do
      before: |
        def before(text, targets):
            hits = 0
            for character in text:
                for target in targets:
                    if character == target:
                        hits += 1
            return hits
      after: |
        def after(text, targets):
            codes = [ord(t) for t in targets]
            hits = 0
            for code in map(ord, text):
                for target in codes:
                    if code == target:
                        hits += 1
            return hits
      note: |
        A one-character string where an int does.

        The taxonomy's own first example for this root cause, which had no
        implementation: "storing a single-character value as a full string object where
        a character code would suffice in a tight numerical loop".

        Every one-character string is a full `str` object with a header, a length and
        an encoding kind, and comparing two of them enters the string compare path. An
        `int` from `ord()` compares as a machine word. CPython interns single
        characters, so the allocation is not the cost here -- the comparison path is.

        The repair moves the conversion to the boundary: `after` pays one `ord()` per
        element to buy integer comparisons for the whole loop, which is why it needs
        the comparisons to outnumber the conversions to pay at all.

        Measured in `validation/taxonomy/C5S3_character_code.py`.
  patch_shape: structural
  measurability: scales_with_input
  min_workload_hint: |
    needs many instances alive at once, or many operations, before a per-instance or per-operation saving is visible
  similar:
  - C5.S1
  - C5.S4
  - C6.S4
  - C12.S2
  - C12.S4
- id: C5.S4
  signals:
  - redundant_materialisation
  - ruff_C411
  - ruff_C414
  - ruff_C416
  - ruff_PERF101
  in_one_line: |
    a conversion between representations that the code on either side did not need
  what_to_look_for: |
    A conversion walks the whole source and allocates a whole new container. That is worth paying for when the new form makes later work cheaper -- hashing for repeated lookup, indexing for repeated access, a snapshot that survives a mutation -- and it is pure loss when the consumer would have accepted the original.  So the tell is never the conversion itself but what happens next, and which of the two forms that code actually needs.  Most builtins taking an iterable accept the unconverted form: `sum`, `any`, `all`, `min`, `max`, `str.join`, a `for` loop, `in`.  Three things make the conversion load-bearing: the result being indexed, sliced, measured with `len()` or iterated twice, all of which need a sequence; the conversion being a snapshot taken before the source is mutated, closed or exhausted; and the *receiving operation* having a fast path for the converted type. That last one is the step that gets skipped and it is where the answer most often flips -- this project measured `set(a).difference(set(b))` as the faster spelling and `set(a).intersection(set(b))` as the slower one, the same edit with opposite verdicts, decided entirely by which method receives it.  The largest instances are not one expression at all: one function serialises and the next immediately parses, and neither is visible from the other alone.
  not_a_smell_when:
  - |
    the conversion snapshots a value that would otherwise be mutated or closed before it is read
  - |
    the result is iterated more than once, indexed, sliced or measured, so a lazy source would be exhausted or unusable
  - |
    the converted type is what an API boundary requires
  - |
    the target operation has a fast path for the converted type, so the conversion buys more than it costs
  counter_examples:
  - code: |
      missing = set(wanted).difference(set(available))
    why: |
      This looks exactly like a redundant conversion and is not. `set.difference` runs faster against a hashed argument, so the inner `set()` pays for itself. The mirror image *is* the smell: `set(a).intersection(set(b))` should drop its inner `set()`, because `intersection` iterates its argument and probes the receiver, so a list argument costs nothing. The same edit, opposite verdicts, decided entirely by which method receives it -- and both directions appear in this project's own measured samples.
  - code: |
      rows = list(cursor.fetchall())
      connection.close()
      return summarise(rows)
    why: |
      The conversion pins the result before the connection closes. Removing it does not save a pass; it raises.
  - code: |
      total = sum([x * 2 for x in values])
    why: |
      The reflex repair is a generator expression. Measured on this project's host, the list comprehension was **ahead by 22%** for a short pipeline consumed once by a C-level function: generator resumption is not free. Prefer the generator for memory, for long pipelines, and where the consumer may stop early -- not by default.
  refactoring:
    summary: delete the conversion and pass the value through directly
    examples:
    - title: the consumer already accepts an iterable
      before: |
        def before(xs):
            return sum(list([x * 2 for x in xs]))
      after: |
        def after(xs):
            return sum([x * 2 for x in xs])
      note: |
        `sum` takes any iterable. The `list()` walks the source and allocates a container that is read once and dropped.

        Measured in `validation/taxonomy/C5S4_representation_change.py`.
    - title: a chain of intermediates, none of them read twice
      before: |
        def before(records):
            rows = list(records)
            names = [r["name"] for r in rows]
            return sorted(set(names))
      after: |
        def after(records):
            return sorted({r["name"] for r in records})
      note: |
        Three containers become one. Each intermediate was a full pass and a full allocation and none was read more than once. The `set` survives, because it does real work: removing duplicates before the sort.

        Measured in `validation/taxonomy/C5S4_chain_of_intermediates.py`.
    - title: the shape was chosen too early
      before: |
        import json


        def _store_from_payloads(payloads, sink):
            for payload in payloads:
                record = json.loads(payload)
                sink[record["id"]] = record["value"]
            return len(sink)


        def before(rows):
            payloads = [json.dumps(r) for r in rows]
            return _store_from_payloads(payloads, {})
      after: |
        def _store_from_records(records, sink):
            for record in records:
                sink[record["id"]] = record["value"]
            return len(sink)


        def after(rows):
            return _store_from_records(rows, {})
      note: |
        This is the form that matters in real code, and it is invisible from either function alone: one serialises, the other immediately parses, so the round trip is two full passes and two allocations per row buying nothing at all. Finding it needs the caller and the callee read together. The repair spans two units -- say which ones in the finding.

        Measured in `validation/taxonomy/C5S4_shape_chosen_too_early.py`.
