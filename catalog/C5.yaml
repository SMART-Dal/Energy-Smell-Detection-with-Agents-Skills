- id: C5.S2
  in_one_line: |
    a collection searched again and again where one index built beside it would answer every question
  look_for: |
    A collection searched again for each of many questions while it has to stay as it is -- for its order, its duplicates, or because it is returned: a nested loop that breaks on the first equal key, a method that walks `self.products` for one SKU per call, a `not in` against the list being built. The scans cost n*m comparisons; a dict or set built once beside it answers each question with one hash probe. The index is built where the data arrives and read where the question is asked.
  refactoring:
    summary: build a lookup index once, then query it
  repairs:
    - case: C5S2_missing_index
    - case: C5S2_set_beside_the_list
      note: |
        `kept` stays a list because the function returns it and first-seen order matters; the set exists only to answer the membership question.
    - case: C5S2_index_on_the_object
      note: |
        An index has to be built where the data arrives and read where the question is asked, so two methods change. It also creates an obligation: `self.products` must not be mutated afterwards without the index being updated.
  not_this:
    - title: the collection changes after the index is built
      source: catalog
      code: |
        class Inventory:
            def __init__(self, items):
                self.items = items

            def add(self, item):
                self.items.append(item)

            def find(self, sku):
                for item in self.items:
                    if item.sku == sku:
                        return item
                return None
      tempting: |
        class Inventory:
            def __init__(self, items):
                self.items = items
                self._by_sku = {item.sku: item for item in items}

            def add(self, item):
                self.items.append(item)

            def find(self, sku):
                return self._by_sku.get(sku)
      why: |
        `add` appends to `self.items` after the index is built, so `find` returns `None` for every item added later; an index over mutable data has to be updated by every mutation.
    - title: the match is a range test, not equality
      source: catalog
      code: |
        def owners(slots, times):
            out = []
            for when in times:
                for slot in slots:
                    if slot.start <= when < slot.end:
                        out.append(slot.owner)
                        break
            return out
      tempting: |
        def owners(slots, times):
            by_start = {slot.start: slot.owner for slot in slots}
            return [by_start[when] for when in times if when in by_start]
      why: |
        A hash index answers only equality on its key, so every time that falls inside a slot but not exactly on its start is dropped from the result.
  similar:
    - C3.S4
    - C5.S1
    - C8.S1
- id: C5.S3
  signals:
    - float_literal_on_int_data
    - constant_sequence_literal
  in_one_line: |
    a representation heavier than the data it holds actually requires
  look_for: |
    A representation carrying a capability the data never uses: a float literal such as `3.0`, `+= 4.0` or `- 1.0` on integer data, which makes every result a new float; a constant list literal that is only indexed or searched, rebuilt on every call where a tuple is stored once in the code object; a per-instance `__dict__` for a fixed set of fields; a `set` collecting values that are never probed and already distinct; one-character strings compared in a tight loop. Name the capability, then check that nothing uses it.
  refactoring:
    summary: use the lightest representation the data actually requires
  repairs:
    - case: C5S3_float_literal
      note: |
        Each multiply converts the int, runs float arithmetic and allocates a float object, and the integer path does none of it. Valid only when the caller does not depend on getting floats back.
    - case: C5S3_tuple_constant
      note: |
        A list display is constructed element by element on every call; a tuple of constants is folded into the function's constant pool and loaded in one instruction. It is available only because `types` is local, never mutated and never escapes.
    - case: C5S3_slots_versus_dict
      note: |
        `__slots__` replaces the per-instance dict with fixed offsets: less memory per instance and a faster attribute read. It also forbids attributes the class did not declare, and breaks anything relying on `__dict__` or on multiple inheritance from another slotted class.
    - case: C5S3_set_never_probed
      note: |
        The loop never asks about membership and the values are already distinct, so the hash and probe on every `add` buy neither of a set's two properties; `list.append` writes a pointer.
    - case: C5S3_character_code
      note: |
        Comparing two one-character strings enters the string compare path, where an `int` from `ord()` compares as a machine word. `after` pays one `ord()` per element to buy integer comparisons for the whole loop, so it needs the comparisons to outnumber the conversions.
  not_this:
    - source: lookalike:C5S3_lookalike
      why: |
        `__slots__` also removes `__dict__`, and the enrichment pass sets an attribute the class never declared, so the slotted version raises `AttributeError` on the first row. Every attribute anyone sets on an instance has to be declared before the class can be narrowed.
    - title: a list literal grown with `+=`
      source: rule:constant_sequence_literal/build_command
      code: |
        def build_command(csv):
            cmd = ["perf", "stat"]
            if csv:
                cmd += ["-x", ","]
            return cmd
      tempting: |
        def build_command(csv):
            cmd = ("perf", "stat")
            if csv:
                cmd += ["-x", ","]
            return cmd
      why: |
        `cmd += [...]` is an in-place extend on a list; on a tuple it raises `TypeError: can only concatenate tuple (not "list") to tuple` whenever `csv` is true.
    - title: the list is returned to the caller
      source: rule:constant_sequence_literal/returned_to_the_caller
      code: |
        def returned_to_the_caller():
            labels = ["low", "medium", "high"]
            return labels
      tempting: |
        def returned_to_the_caller():
            labels = ("low", "medium", "high")
            return labels
      why: |
        The caller receives a list and may treat it as one; a caller that appends to it, sorts it or assigns into it fails against a tuple, in code this function never sees.
    - title: the float is part of the output
      source: catalog
      code: |
        import json

        def as_json(counts):
            return json.dumps([n * 3.0 for n in counts])
      tempting: |
        import json

        def as_json(counts):
            return json.dumps([n * 3 for n in counts])
      why: |
        `json.dumps` writes a float as `3.0` and an int as `3`, so every number in the serialised output changes; the integer literal is valid only when nothing depends on getting floats back.
  similar:
    - C5.S1
    - C5.S4
    - C6.S4
    - C12.S2
    - C12.S4
- id: C5.S4
  signals:
    - redundant_materialisation
    - ruff_C411
    - ruff_C414
    - ruff_C416
    - ruff_PERF101
  in_one_line: |
    a conversion between representations that the code on either side did not need
  look_for: |
    A conversion whose result the next step did not need: `list()` around a generator or comprehension handed straight to `sum`, `any`, `max`, `sorted` or `zip`, which accept any iterable; `set()` around the argument of `set.intersection`; a chain of intermediates such as `list(records)`, then a list of names, then a `set`, none read more than once; a value serialised by one function and parsed straight back by the next. Each conversion walks the whole source and allocates a whole container; what decides it is what the next step does with the result.
  refactoring:
    summary: delete the conversion and pass the value through directly
  repairs:
    - case: C5S4_representation_change
      note: |
        `sum` takes any iterable. The `list()` walks the source and allocates a container that is read once and dropped.
    - case: C5S4_chain_of_intermediates
      note: |
        Each intermediate was a full pass and a full allocation, and none was read more than once. The `set` survives because it does real work: removing duplicates before the sort.
    - case: C5S4_shape_chosen_too_early
      note: |
        One function serialises and the next immediately parses, so the round trip is two full passes and two allocations per row buying nothing, and it is invisible from either function alone. The repair spans two units.
    - case: C5S4_conversion_direction_flips
      note: |
        `set.intersection` iterates its argument and probes the receiver, so a list argument costs nothing and the inner `set()` is pure overhead.
  not_this:
    - source: lookalike:C5S4_lookalike
      why: |
        The converted sequence feeds two consumers, and a generator is exhausted by the first, so the second counts nothing and the function returns a wrong count instead of raising. Dropping the `list()` is valid only when the result is consumed exactly once.
    - title: two arguments to `min`, not one sequence
      source: rule:redundant_materialisation/pick_optimal
      code: |
        def pick_optimal(candidate_a, candidate_b):
            return min(list(candidate_a), list(candidate_b))
      tempting: |
        def pick_optimal(candidate_a, candidate_b):
            return min(candidate_a, candidate_b)
      why: |
        Given two arguments, `min` compares them as values rather than walking one iterable; two lists compare element by element, while two generators raise `TypeError`.
    - title: the copy is a snapshot of a collection the loop shrinks
      source: rule:redundant_materialisation/flush_pending
      code: |
        def flush_pending(active_queue):
            for idx, task in enumerate(list(active_queue)):
                if task.is_expired():
                    active_queue.remove(task)
      tempting: |
        def flush_pending(active_queue):
            for idx, task in enumerate(active_queue):
                if task.is_expired():
                    active_queue.remove(task)
      why: |
        The body removes from `active_queue` while the loop walks it; without the snapshot each removal shifts the list under the iterator, and the task after every removed one is skipped.
  similar:
    - C5.S3
    - C6.S1
    - C6.S2
