- id: C3.S1
  signals:
    - index_based_iteration
    - append_only_loop
    - ruff_PERF401
    - ruff_PERF403
    - ruff_PERF102
  in_one_line: |
    a loop written in a form that does more interpreter work per element than it needs to
  look_for: |
    A loop whose form does more interpreter work per element than the job needs. `for i in range(len(xs))` with `xs[i]` builds an index object and a bounds-checked subscript every pass where `for x in xs` takes the next element from the iterator; two sequences on one index are `zip`, an index carried out of the loop is `enumerate`, a stride is a slice, a reverse walk is `reversed`. An `.append()` loop resolves the method and makes a call every iteration where a comprehension uses a dedicated bytecode, and an `if` around the append becomes its filter.
  refactoring:
    summary: use the iteration construct with the least per-element overhead
  repairs:
    - case: C3S1_index_iteration
      note: |
        The original builds a `range`, boxes each index and does a bounds-checked subscript per element; the repair asks the list's iterator for the next pointer.
    - case: C3S1_zip_versus_index
      note: |
        `zip` advances both iterators in C. It stops at the shorter sequence where the original raises `IndexError` if `second` is shorter; if that error was load-bearing, use `zip(..., strict=True)`.
    - case: C3S1_plain_append
      note: |
        The explicit loop resolves `records.append` on every iteration and makes a call; the comprehension uses a dedicated bytecode. This only holds because the body is exactly one append.
    - case: C3S1_append_to_comprehension
      note: |
        A comprehension can carry an `if`, so the filter keeps the repair available; a `continue`, a `break` or a side effect in the body would block it.
    - case: C3S1_comprehension_cannot_stop
      note: |
        The `break` is a second statement in the body, and a comprehension has nowhere to put it. Written as a comprehension plus a slice, the loop runs to the end of the input and the slice throws away what it did not need.
  not_this:
    - title: the list being appended to belongs to the caller
      source: rule:append_only_loop/populate_queue
      code: |
        def populate_queue(shared_queue, new_items):
            for item in new_items:
                shared_queue.append(item.data)
      tempting: |
        def populate_queue(shared_queue, new_items):
            shared_queue = [item.data for item in new_items]
      why: |
        The comprehension builds a fresh local list and rebinds the name, so the caller is left holding the list it passed in, without the new items.
    - title: the filter reads the list being built
      source: rule:append_only_loop/reads_the_list_it_builds
      code: |
        def reads_the_list_it_builds(xs):
            out = []
            for x in xs:
                if x not in out:
                    out.append(x)
            return out
      tempting: |
        def reads_the_list_it_builds(xs):
            out = []
            out = [x for x in xs if x not in out]
            return out
      why: |
        While the comprehension runs, `out` is still the empty list, so `x not in out` is always true and the duplicates the loop dropped are kept.
  similar:
    - C10.S1
    - C10.S3
- id: C3.S2
  signals:
    - loop_invariant_expression
  in_one_line: |
    an expression recomputed every iteration whose answer never changes
  look_for: |
    An expression inside a loop whose operands nothing in the loop changes, so every pass pays again for the same answer. Look for a set built from parameters, `len()` or a call in a `while` condition, a subscript into a config or module-level table, an attribute chain or string method on an outside value, and `sum()` in a comprehension's body, which runs once per element and makes a linear-looking function quadratic. It is invariant only when nothing in the body, a call included, can change what it reads.
  refactoring:
    summary: hoist the invariant expression to just above the loop
  repairs:
    - case: C3S2_set_rebuilt_per_iteration
      note: |
        The set depends only on `k`, which the loop never touches, so it is built once instead of once per element. What was hoisted is O(k) work, so the saving is len(values) * k rather than a few bytecodes.
    - case: C3S2_sum_inside_comprehension
      note: |
        A comprehension's body runs once per element, so `sum(exponentials)` is a full pass per element and the function is quadratic where it reads as linear. The iterable is evaluated once; it is the body that repeats.
    - case: C3S2_loop_invariant
    - case: C3S2_len_in_while_condition
      note: |
        Nothing in the body mutates the list, so the length is invariant and the hoist is legal. A loop that deletes as it goes is textually identical, and only reading the body tells them apart.
  not_this:
    - source: lookalike:C3S2_lookalike
      why: |
        `len(out)` reads the list the loop is appending to, so hoisting it computes the capacity once against an empty list and every later row is checked against the wrong threshold.
    - title: the body deletes from the list whose length the condition reads
      source: rule:loop_invariant_expression/compact
      code: |
        def compact(values):
            i = 0
            while i < len(values):
                if values[i] is None:
                    del values[i]
                else:
                    i += 1
            return values
      tempting: |
        def compact(values):
            i = 0
            n = len(values)
            while i < n:
                if values[i] is None:
                    del values[i]
                else:
                    i += 1
            return values
      why: |
        Each `del` shortens the list, so the hoisted bound outlives it and `values[i]` raises `IndexError` once anything has been deleted.
    - title: the invariant is a generator, which one pass uses up
      source: rule:loop_invariant_expression/score_batches
      code: |
        def score_batches(batches, static_weights):
            for batch in batches:
                gen = (w * 2 for w in static_weights)
                consume(batch, gen)
      tempting: |
        def score_batches(batches, static_weights):
            gen = (w * 2 for w in static_weights)
            for batch in batches:
                consume(batch, gen)
      why: |
        A generator is a single-use iterator: the first batch exhausts it and every later batch receives an empty one.
  similar:
    - C1.S4
    - C3.S3
    - C4.S5
    - C8.S3
    - C10.S5
- id: C3.S3
  signals:
    - regex_in_loop
  in_one_line: |
    an object or resource created once per iteration that the whole loop could share
  look_for: |
    An object or resource built on every pass of a loop that carries no per-iteration state, so one instance could serve the whole loop. Look for `re.search`, `re.sub`, `re.findall` or `re.compile` with a fixed pattern, which looks the pattern up in the module's cache on every call; a file opened and closed per row, which adds syscalls to every iteration; a `lambda` or a set built from values the loop never changes; and an object constructed per pass that never leaves the iteration that filled it.
  refactoring:
    summary: create the object once before the loop and reuse it
  repairs:
    - case: C3S3_regex_compiled_per_iteration
      note: |
        `re.search` looks the pattern up in a module-level cache on every call, which is a dict probe plus the call itself; the compiled object skips both. Hoisting to module scope rather than to just above the loop makes this C8.S2 as well.
    - case: C3S3_file_opened_per_iteration
      note: |
        One open and one close instead of N of each, and the buffer is flushed when it fills rather than on every row. It changes the failure mode: a crash mid-loop now loses buffered rows.
    - case: C3S3_object_reuse_with_reset
      note: |
        One allocation instead of N, available only because the instance is rendered to a string immediately and never escapes. If `out` collected the objects rather than their renderings, every entry would be the same object and the repair would be a bug.
    - case: C3S3_lambda_in_loop
      note: |
        A `lambda` in a loop body is a `MAKE_FUNCTION` per iteration: a fresh function object, with its own closure cell when it captures anything, allocated and discarded each pass.
    - case: C3S3_per_iteration_setup
  not_this:
    - title: the pattern is the loop variable
      source: rule:regex_in_loop/compile_per_pattern
      code: |
        def compile_per_pattern(patterns, text):
            return [re.compile(p).findall(text) for p in patterns]
      tempting: |
        def compile_per_pattern(patterns, text):
            matcher = re.compile(patterns[0])
            return [matcher.findall(text) for p in patterns]
      why: |
        The compiled object depends on the loop variable, so there is no single object to share: one compiled before the loop applies the first pattern to every iteration.
    - title: the object built per iteration is kept, not discarded
      source: catalog
      code: |
        for group in groups:
            members = []
            for user in group.users:
                members.append(user.name)
            result[group.id] = members
      tempting: |
        members = []
        for group in groups:
            members.clear()
            for user in group.users:
                members.append(user.name)
            result[group.id] = members
      why: |
        Each list is stored in `result`, so a hoisted list cleared per pass leaves every key pointing at the same object, holding only the last group's names.
  similar:
    - C1.S8
    - C3.S2
    - C6.S1
    - C8.S2
- id: C3.S4
  signals:
    - membership_test_on_sequence
  in_one_line: |
    an inner loop that searches, where a lookup would turn n*m into n+m
  look_for: |
    Nested iteration whose inner level is a search: an inner loop looking for a matching element, or an `in` test against a list inside a loop, which scans the list every pass and makes the work n*m. The list may be built once, grown by `.append` as the loop goes, rebuilt per row, or passed in as a constant or parameter. The second form is a double loop over one collection computing a symmetric relation for every ordered pair, so each pair is computed twice.
  refactoring:
    summary: replace the inner scan with a hash lookup, or halve a symmetric traversal
  repairs:
    - case: C3S4_nested_scan
      note: |
        n*m comparisons become m hashes plus n probes.
    - case: C3S4_triangular_traversal
      note: |
        `gcd` is symmetric, so half the pairs were being computed twice.
  excluded:
    - case: C3S4_genuinely_quadratic
      reason: |
        its after hoists the row lookup out of the inner loop, which is C3.S2's repair, not this one's
  not_this:
    - title: the inner loop matches by prefix, not by equality
      source: catalog
      code: |
        hits = []
        for word in words:
            for prefix in prefixes:
                if word.startswith(prefix):
                    hits.append(word)
                    break
      tempting: |
        lookup = set(prefixes)
        hits = [word for word in words if word in lookup]
      why: |
        A set answers equality only. `startswith` matches every word that begins with a prefix, so the lookup keeps only the words that equal one exactly.
  similar:
    - C5.S1
    - C5.S2
    - C7.S1
    - C9.S3
- id: C3.S5
  signals:
    - missing_early_exit
  in_one_line: |
    a loop that keeps going after its answer is already settled
  look_for: |
    A loop that keeps iterating after its answer is settled. Look for a flag set to a constant that nothing can set back -- `found = True` in a search, `valid = False` in a validation -- with no `break` or `return` after it, and for a comprehension that filters a whole collection before a slice keeps the first few. A `break` in an inner loop, or a `return` in a nested function, leaves the outer loop running. Every pass after the answer is paid for and changes nothing.
  refactoring:
    summary: stop as soon as the outcome is settled, ideally with a primitive that does so
  repairs:
    - case: C3S5_all_short_circuits
      note: |
        `all` stops at the first false. The value is entirely in the input distribution: where the first failure sits.
    - case: C3S5_take_only_what_is_wanted
      note: |
        The original filters the whole collection and then discards all but the first `limit`; `islice` stops as soon as it has enough.
    - case: C3S5_missing_early_exit
  not_this:
    - source: lookalike:C3S5_lookalike
      why: |
        The loop appends every failing position, so it is a fold rather than a search; a `break` after the first append reports one problem where the original reports all of them.
    - title: a later element can still change the answer
      source: rule:missing_early_exit/get_system_status
      code: |
        def get_system_status(servers, limit):
            status = "ALL_SYSTEMS_GO"
            for server in servers:
                if server.ping > limit:
                    status = "SYSTEM_DEGRADED"
                elif server.offline:
                    status = "SYSTEM_DOWN"
            return status
      tempting: |
        def get_system_status(servers, limit):
            status = "ALL_SYSTEMS_GO"
            for server in servers:
                if server.ping > limit:
                    status = "SYSTEM_DEGRADED"
                    break
                elif server.offline:
                    status = "SYSTEM_DOWN"
                    break
            return status
      why: |
        The loop assigns different values and a later server can overwrite an earlier one, so breaking at the first match can return `SYSTEM_DEGRADED` where the original returns `SYSTEM_DOWN`.
    - title: the loop returns the last match, not the first
      source: catalog
      code: |
        found = None
        for record in records:
            if record.matches(query):
                found = record
        return found
      tempting: |
        found = None
        for record in records:
            if record.matches(query):
                found = record
                break
        return found
      why: |
        The value assigned comes from the element, so each later match overwrites it and the loop returns the last one; a `break` returns the first.
    - title: every iteration has a side effect the caller sees
      source: rule:missing_early_exit/audit_every_row
      code: |
        def audit_every_row(stream, stats):
            found = False
            for item in stream:
                log_event(item)
                stats.total += 1
                if item.is_target:
                    found = True
            return found
      tempting: |
        def audit_every_row(stream, stats):
            for item in stream:
                log_event(item)
                stats.total += 1
                if item.is_target:
                    return True
            return False
      why: |
        The loop logs every item and counts it on an object the caller holds; returning at the first target skips both for the rest of the stream.
  similar:
    - C3.S6
    - C7.S2
- id: C3.S6
  signals:
    - ruff_RUF015
  in_one_line: |
    the whole collection processed when only a subset was ever wanted
  look_for: |
    Work spent on every element of a collection when the result needs only some of them. Look for a full sort followed by an index or slice -- `sorted(xs)[0]` for a minimum, `sorted(xs, reverse=True)[:k]` for the top k -- an expensive test run over every value, repeats included, before a set keeps the distinct results, a transform applied before a filter that reads only the raw element, and rows selected in Python that a query could filter at the source. The expensive step is paid for elements that never reach the result.
  refactoring:
    summary: reduce the collection before the expensive step, not after
  repairs:
    - case: C3S6_top_k_without_sorting
      note: |
        Sorting n elements to keep k is n log n where the heap is n log k. `nlargest` and a reverse sort agree on the values but not necessarily on the order of ties, so check whether the caller depends on that.
    - case: C3S6_deduplicate_first
      note: |
        The extra `set()` pass replaces the predicate calls on repeated values with a hashing pass that was going to happen anyway for the result set.
    - case: C3S6_unfiltered_bulk
  not_this:
    - source: lookalike:C3S6_lookalike
      why: |
        The consumer wants the largest k, which is a question about every element; `islice` returns the first k in input order, which is a different answer.
    - title: the filter tests the transformed value
      source: catalog
      code: |
        scores = [expensive(x) for x in items]
        best = [s for s in scores if s > threshold]
      tempting: |
        best = [expensive(x) for x in items if x > threshold]
      why: |
        The predicate reads `expensive`'s output, so filtering first tests the raw item instead and keeps a different set; there is nothing to filter on until the transform has run.
  similar:
    - C1.S5
    - C3.S5
    - C6.S3
    - C7.S4
- id: C3.S7
  signals:
    - mutation_during_iteration
  in_one_line: |
    a collection edited while it is being walked
  look_for: |
    A loop that removes, inserts, reorders or appends to the collection it is scanning. Removing from a list shifts the rest down, so a `for` loop skips the next element, and every `remove`, `pop` or `del` in the loop moves the whole tail, so a filtering loop that deletes as it goes is quadratic where a rebuild is linear. Appending can run the loop without end, a new key in a dict being iterated raises `RuntimeError`, and a `while` loop whose counter is not updated on every path never ends.
  refactoring:
    summary: build the items to keep into a new collection instead of editing the one being walked
  repairs:
    - case: C3S7_mutation_in_loop
    - case: C3S7_delete_while_scanning
      note: |
        Each `del` shifts the tail, making the loop quadratic. The rebuild is one pass and one allocation.
  excluded:
    - case: C3S7_iterating_a_snapshot
      reason: |
        its before already walks a snapshot, and its after removes the per-item linear `remove`, which is C7.S1's repair, not this one's
  not_this:
    - source: lookalike:C3S7_lookalike
      why: |
        Rebuilding with `values = [...]` rebinds a local and leaves every other reference to the list pointing at the unfiltered version; the rebuild has to keep the list's identity, with `values[:] =`, when anything else can see it.
    - title: a work list that is meant to grow
      source: rule:mutation_during_iteration/work_list
      code: |
        def work_list(pending):
            seen = []
            while pending:
                node = pending.pop()
                seen.append(node)
                pending.extend(node.children)
            return seen
      tempting: |
        def work_list(pending):
            seen = []
            for node in list(pending):
                seen.append(node)
                pending.extend(node.children)
            return seen
      why: |
        Growing `pending` is how the traversal reaches the children; walking a snapshot visits only the nodes present at the start and never descends.
    - title: one removal, then the loop stops
      source: rule:mutation_during_iteration/remove_then_stop
      code: |
        def remove_then_stop(users, target):
            for user in users:
                if user is target:
                    users.remove(user)
                    break
      tempting: |
        def remove_then_stop(users, target):
            users[:] = [user for user in users if user is not target]
      why: |
        The `break` ends the loop straight after the removal, so no element is skipped. The rebuild removes every occurrence of `target` where the original removes one.
  similar:
    - C6.S2
